[entries.what_it_does]
status = "answered"
recorded_at = "2026-08-27T09:14:02Z"
source = "builder"
answer = "Reads an expense claim, checks it against the expense policy, and approves it, refuses it, or hands it to finance."

[entries.used_through]
status = "answered"
recorded_at = "2026-08-27T09:14:02Z"
source = "builder"
answer = "A script the claims inbox calls once a claim is submitted. The claimant receives a notice, and approved claims are added to the ledger automatically."

[entries.how_far]
status = "answered"
recorded_at = "2026-08-27T09:14:02Z"
source = "builder"
answer = "It approves and books claims that follow the policy on its own. Anything the policy sends to finance is settled by finance, or parked."

[entries.involvement]
status = "answered"
recorded_at = "2026-08-27T09:14:02Z"
source = "builder"
answer = "Finance answers when the agent asks. A parked claim waits for a person."

[entries.purpose]
status = "answered"
recorded_at = "2026-08-27T09:14:02Z"
source = "builder"
answer = "Finance spends two days a month on claims that the policy already decides. This should take those away."

[entries.end_user]
status = "answered"
recorded_at = "2026-08-27T09:14:02Z"
source = "builder"
