[entries.answer_form]
status = "answered"
recorded_at = "2026-08-27T09:14:02Z"
source = "builder"
answer = "A decision with the fields it rests on: vendor, total, category and PO number. A parked claim is an absence, since nothing was decided."

[entries.judged_steps]
status = "answered"
recorded_at = "2026-08-27T09:14:02Z"
source = "builder"
answer = "Yes: extract and decide each have their own right answer, because a field misread is wrong before anything is decided, and a decision can be wrong on fields read correctly."

[entries.judged_path]
status = "answered"
recorded_at = "2026-08-27T09:14:02Z"
source = "builder"
