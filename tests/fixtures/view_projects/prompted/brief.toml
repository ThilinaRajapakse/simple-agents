[decisions.what_the_reader_is_told]
kind = "prompt_rule"
status = "agreed"
recorded_at = "2026-09-04T09:14:02Z"
produces = ["read_request"]
chose = "read_request uses the traveller's message alone, and returns unknown for a date the message does not give"
considered = ["letting it fill in a likely date"]
because = "a guessed date is read as the traveller's own by every step after it"

[decisions.three_stops_a_day]
kind = "prompt_rule"
status = "agreed"
recorded_at = "2026-09-04T09:14:02Z"
