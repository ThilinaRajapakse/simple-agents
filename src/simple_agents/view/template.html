  return !many || step.notes.length > 0;
}
/* What the path says under a step's name, and what its shut card says instead of the text. */
function promptWarnings(step) {
  const out = [];
  if (!step.decision && !step.planned) out.push("no agreed rule");
  if (step.changed) out.push("edited since this run");
  if (step.notes.some(n => n.kind === "cut")) out.push("a value is cut short");
  if (step.notes.some(n => n.kind === "varies")) out.push("the words come from the run");
  return out;
}

function promptTree() {
  const held = ((DATA.prompts || {}).pipelines) || [];
  const groups = held.map(one => {
    const rows = one.steps.filter(promptKept).map(step => {
      const key = promptKey(step);
      const warn = promptWarnings(step);
      const under = warn.length ? warn.join(" · ")
        : step.planned ? "not built yet"
        : step.filled ? "rule agreed"
        : "read from the code";
      const gap = (one.gaps || {})[step.node_id];
      return `<li><a data-pstep="${esc(key)}" class="${promptHere === key ? "here" : ""} ${
        warn.length ? "warn" : ""}" tabindex="0">${esc(step.short)}<span>${esc(under)}</span></a></li>`
        + (gap ? `<li class="gap">${fmt(gap)} step${gap === 1 ? "" : "s"} with no prompt</li>` : "");
    }).join("");
    const before = (one.gaps || {})[""];
    const shut = promptShutPipes.has(one.name);
    return `<div class="pipe"><button class="pname" data-ppipe="${esc(one.name)}">
      <span class="tw">${shut ? "▸" : "▾"}</span>${esc(one.name)}</button>
      <ul${shut ? ` style="display:none"` : ""}>${
      before ? `<li class="gap">${fmt(before)} step${before === 1 ? "" : "s"} with no prompt</li>` : ""
      }${rows || `<li class="gap">nothing under this filter</li>`}</ul></div>`;
  }).join("");
  const filter = (name, label) => `<button class="btn ${promptFilter === name ? "primary" : ""}"
    data-pfilter="${name}">${label}</button>`;
  return `<nav class="ptree" aria-label="Prompts by pipeline path"><h3>The path</h3>${groups}
    <div class="filters">${filter("unagreed", "Only unagreed")}${
      filter("changed", "Only changed")}</div>
  </nav>`;
}

/* One message, drawn from the fixed text and the values the record kept apart.

   The two views are the same pieces: as sent puts each value's own words in the gap, as
   written puts the gap's name back. Both come from the record, so a step whose source the
   page cannot read still reads correctly in either. */
function promptBody(step, message, index) {
  const key = promptKey(step);
  const written = promptShow === "written";
  const inner = (message.pieces || []).map((piece, i) => {
    if (piece.kind === "fixed") return esc(piece.text);
    const id = `${key}#${piece.name}#${index}#${i}`;   // the panel's own key, not an address
    const shown = written || !piece.text ? "{" + piece.name + "}" : piece.text;
    return `<span class="pv ${piece.capped_from ? "capped" : ""}" tabindex="0" role="button"
      data-pvalue="${esc(id)}">${esc(shown)}${written || !piece.text ? "" :
      `<span class="nm">${esc(piece.name)}</span>`}</span>`;
  }).join("");
  const instead = message.blocks
    ? message.blocks.join(", ") + " sent as content that is not text"
    : message.how === "run_time" ? "The text is chosen while the run happens, so it is in the "
      + "record of a run rather than in the code."
    : message.how === "interpolated" ? "A value is formatted into the text itself, so there is "
      + "no fixed text to read here. The words are in the record of a run."
    : message.how === "carried" ? "The conversation so far, carried in."
    : "empty";
  return `<div class="pbody ${promptShow === "written" ? "tpl" : ""}"
    data-pmsg="${esc(key + "#" + index)}">${inner
      || `<span class="pshut">${esc(instead)}</span>`}</div>`;
}

/* The call one step's shown prompt was read from, where a run filled it. */
const filledOf = step => (step.filled && step.filled.sequence ? step.filled : null);

function valuePanel(step, message, index) {
  const key = promptKey(step);
  const showing = promptValue[key];
  if (!showing || !showing.startsWith(`${key}#`)) return "";
  const parts = showing.split("#");
  if (Number(parts[2]) !== index) return "";
  const piece = (message.pieces || [])[Number(parts[3])];
  if (!piece || piece.kind !== "value") return "";
  const rows = [
    ["value", piece.name],
    piece.origin ? ["from", piece.origin] : null,
    piece.unfilled
      ? ["size", "unknown; this is the text as the code writes it"]
      : ["size", piece.capped_from
          ? `${fmt(piece.chars)} of ${fmt(piece.capped_from)} characters`
          : `${fmt(piece.chars)} character${piece.chars === 1 ? "" : "s"}`],
    piece.parts ? ["written as", `${fmt(piece.parts)} parts, joined`] : null,
    piece.section ? ["built from", "a named section of its own"] : null,
  ].filter(Boolean);
  return `<div class="pvpanel"><dl>${rows.map(([k, v]) =>
    `<dt>${esc(k)}</dt><dd>${esc(v)}</dd>`).join("")}</dl>
    ${piece.capped_from ? `<p class="warnline">The step's own code cuts this at ${
      fmt(piece.chars)} characters, so the other ${fmt(piece.capped_from - piece.chars)}
      never reached the model.</p>` : ""}
    ${piece.clipped ? `<p class="warnline">The page carries the first ${
      fmt(piece.text.length)} characters of it.${live() && filledOf(step)
        ? "" : " The run's record holds the rest."}</p>` : ""}
    ${piece.clipped && live() && filledOf(step) ? `<div class="pacts">
      <button class="btn" data-pwhole="${esc(filledOf(step).run)}/${filledOf(step).sequence}"
        >Read the whole record it came from</button></div>
      <div class="fullrec" data-pwholerec="${esc(filledOf(step).run)}/${
        filledOf(step).sequence}" hidden></div>` : ""}
    <div class="pacts"><button class="btn" data-pcomment="${esc(step.at)}#${esc(piece.name)}"
      data-plabel="${piece.unfilled ? "read from the code" : fmt(piece.chars) + " characters"}${
        piece.origin ? ", from " + esc(piece.origin) : ""}"
      >Comment on this value</button></div></div>`;
}

function turnLine(turn, label) {
  const called = turn.called.length
    ? `called <em>${turn.called.map(esc).join(", ")}</em>` : "";
  const got = turn.got.length
    ? " and " + turn.got.map(g => `${g.failed ? "the call failed" : g.asked_a_person
        ? "was told" : "read"} <em>${esc(g.text)}</em>`).join(" · ") : "";
  const said = turn.said ? `“${esc(turn.said)}”` : "";
  const cost = [turn.ms !== null && turn.ms !== undefined ? (turn.ms / 1000).toFixed(1) + "s" : null,
    turn.tokens !== null && turn.tokens !== undefined
      ? fmt(turn.tokens) + (turn.tokens_partial ? "+ tokens" : " tokens") : null]
    .filter(Boolean).join(" · ");
  return `<div class="pturn"><span class="n">${esc(label || "turn " + turn.n)}</span>
    <span class="what">${called + got || said || "no answer recorded"}</span>
    <span class="cost">${esc(cost)}</span></div>`;
}

function promptTurnsBlock(step) {
  const filled = step.filled;
  if (!filled || !filled.answered) return "";
  const key = promptKey(step);
  const open = promptTurns.has(key);
  const answered = step.kind === "agent" ? "turn 1" : "it answered";
  const grouped = filled.grouped ? `<div class="pturn"><span class="n">turns ${
    filled.grouped.from}-${filled.grouped.to}</span><span class="what">${
    fmt(filled.grouped.turns)} more turns, calling ${fmt(filled.grouped.called)} tool${
    filled.grouped.called === 1 ? "" : "s"}</span><span class="cost">${
    [filled.grouped.ms !== null ? (filled.grouped.ms / 1000).toFixed(1) + "s" : null,
     filled.grouped.tokens !== null ? fmt(filled.grouped.tokens) + " tokens" : null]
      .filter(Boolean).join(" · ")}</span></div>` : "";
  const more = filled.total
    ? `<button data-pturns="${esc(key)}">${open ? "▾" : "▸"} ${fmt(filled.total)} more turn${
        filled.total === 1 ? "" : "s"} in this loop, on the run above</button>` : "";
  const rows = turnLine(filled.answered, answered)
    + (open ? filled.turns.map(one => turnLine(one)).join("") : "");
  return `<div class="pturns">${rows}${more}${open ? grouped : ""}</div>`;
}

function promptStep(step, many) {
  const key = promptKey(step), open = promptIsOpen(step, many);
  const filled = step.filled;
  const warn = promptWarnings(step);
  const badges = [
    step.decision
      ? `<span class="badge acc">rule agreed</span>`
      : step.planned ? `<span class="badge mut">not built yet</span>`
      : `<span class="badge warn">no agreed rule</span>`,
    filled && filled.items ? `<span class="badge mut">${fmt(filled.items)} items this run</span>` : "",
    step.changed ? `<span class="badge warn">edited since this run</span>` : "",
  ].join("");
  const rule = step.decision
    ? `<p class="prule"><b>Agreed rule:</b> ${esc(step.decision.chose)}</p>`
    : step.planned
    ? `<p class="prule">${esc(step.does || "This step is declared and not built yet.")}</p>`
    : `<p class="prule">The words below tell the model what to do, and no decision records
       them. <button class="btn" data-pask="${esc(step.node_id)}">Ask for the rule</button></p>`;
  /* A step no run has reached still has its words in the code, so the page reads them from
     the source and says so. The text of a message the run decides exists only once it has
     run, and the page says that in its place. */
  const readFromCode = {written: "written in the project's code",
    carried: "carried from the conversation", interpolated: "written in the project's code",
    blocks: "written in the project's code", run_time: "chosen while the run happens"};
  const messages = filled && filled.messages.length
    ? filled.messages
    : step.written.map(w => ({role: w.role, origin: readFromCode[w.how] || readFromCode.written,
        pieces: w.pieces, fromCode: true, how: w.how}));
  const body = messages.map((message, index) => {
    const outside = /^set outside/.test(message.origin || "");
    return `<div class="pmsg ${message.carried ? "carried" : ""} ${outside ? "outside" : ""}">
      <div class="prole"><b>${esc(message.role || "carried")}</b><span>${
        esc(message.origin)}</span></div>
      ${promptBody(step, message, index)}</div>${valuePanel(step, message, index)}`;
  }).join("");
  const nothingToRead = !messages.length;
  const source = filled
    ? `filled from run <b>${esc(filled.run)}</b>${filled.when ? ", " + esc(filled.when) : ""}${
        filled.rollout ? `, a rollout of ${esc(filled.rollout)}` : ""}`
    : step.planned ? "read from the code; this step is not built yet"
    : "read from the code";
  return `<section class="pstep ${open ? "" : "shut"}" id="p-${esc(key)}">
    <div class="shead">
      <button class="id" data-popen="${esc(key)}"><span class="tw">${open ? "▾" : "▸"}</span>${
        esc(step.short)}</button>
      <span class="kind">${esc(step.kind_words)} · ${esc(step.pipeline)}${
        filled && filled.model ? " · " + esc(filled.model) : ""}</span>${badges}
    </div>
    ${rule}
    ${open ? "" : `<p class="pshut">${[
      warn.length ? cap(esc(warn.join(", "))) + "." : "",
      filled && filled.items && filled.one_text
        ? `All ${fmt(filled.items)} items used the same text.` : "",
      "Open to read it.",
    ].filter(Boolean).join(" ")}</p>`}
    <div class="pnotes">${step.notes.map(n =>
      `<p class="pnote ${n.kind === "varies" || n.kind === "changed" ? "plain" : ""}">${
        esc(n.says)}</p>`).join("")}</div>
    <div class="pmsgs">${body}
      <div class="pacts wide">
        <span class="ppicker">${source}</span>
        <button class="btn" data-pcomment="${esc(step.at)}"
          data-plabel="${esc(step.kind_words)} in ${esc(step.pipeline)}">Comment on this ${
          nothingToRead ? "step" : "prompt"}</button>
        ${nothingToRead ? "" :
          `<button class="btn" data-pselect="${esc(key)}">Select words to comment on them</button>`}
      </div>
    </div>
    ${promptTurnsBlock(step)}
    ${promptThreads(step)}</section>`;
}

/* Every thread filed on this prompt, on one of its values, or on words in it. */
function promptThreads(step) {
  const held = (DATA.comments || []).filter(
    c => c.at === step.at || c.at.startsWith(step.at + "#"));
  if (!held.length) return "";
  return `<div class="pmsgs">${held.map(c => `<div class="pacts wide">${renderThread(c)}</div>`).join("")}</div>`;
}

function promptsPage() {
  const held = DATA.prompts || {pipelines: [], counts: {}};
  const counts = held.counts || {};
  if (!counts.prompts) return "";
  const steps = promptSteps();
  const many = steps.length > 10;
  const shown = steps.filter(promptKept);
  const badges = [
    counts.unagreed ? `<span class="badge warn">${fmt(counts.unagreed)} with no agreed rule</span>` : "",
    counts.cut ? `<span class="badge warn">${fmt(counts.cut)} with a value cut short</span>` : "",
    counts.varies ? `<span class="badge warn">${fmt(counts.varies)} whose words come from the run</span>` : "",
    counts.changed ? `<span class="badge warn">${fmt(counts.changed)} edited since the run shown</span>` : "",
  ].join("");
  const pipelines = held.pipelines || [];
  const runsLeft = pipelines.reduce((a, p) => a + (p.runs_left || 0), 0);
  return `<div data-section="prompts">
    <div class="phead"><h2>Prompts</h2>${badges}
      <span class="count">${fmt(counts.prompts)} prompt${counts.prompts === 1 ? "" : "s"} · ${
        fmt(counts.pipelines)} pipeline${counts.pipelines === 1 ? "" : "s"}</span></div>
    <p class="plede">Every instruction this project sends to a model. Each step shows the text
    as it was written and the values that filled it on one real run, and every message says
    where its words came from. Select any of it to comment, and your coding agent answers in
    the thread.</p>
    <div class="pcontrols">
      <span class="pseg" role="group" aria-label="How the prompt is shown">
        <button data-pshow="sent" aria-pressed="${promptShow === "sent"}">As sent</button>
        <button data-pshow="written" aria-pressed="${promptShow === "written"}">As written</button>
      </span>
      ${counts.unfilled ? `<span class="ppicker">${fmt(counts.unfilled)} of them read from the
        code${runsLeft ? `, with ${fmt(runsLeft)} older run${runsLeft === 1 ? "" : "s"}
        still to look in` : ""}</span>` : ""}
      ${pipelines.some(p => p.runs_carry_nothing)
        ? `<span class="ppicker">the runs on record were made before the project kept what it
          sends, so the words below are the code's</span>` : ""}
      ${counts.unfilled && runsLeft && live()
        ? `<button class="btn" id="p-everyrun">Look in every run</button>` : ""}
    </div>
    <div class="pcols">${promptTree()}
      <div class="pstack">${shown.map(s => promptStep(s, many)).join("")
        || `<p class="pageempty">No prompt matches this filter.</p>`}</div></div>
  </div>`;
}

function wirePrompts(holder) {
  const q = sel => [...holder.querySelectorAll(sel)];
  q("[data-pshow]").forEach(b => b.onclick = () => { promptShow = b.dataset.pshow; renderSections(); });
  q("[data-pfilter]").forEach(b => b.onclick = () => {
    promptFilter = promptFilter === b.dataset.pfilter ? null : b.dataset.pfilter;
    renderSections();
  });
  q("[data-popen]").forEach(b => b.onclick = () => {
    const key = b.dataset.popen;
    if (promptShut.has(key)) { promptShut.delete(key); promptOpen.add(key); }
    else { promptShut.add(key); promptOpen.delete(key); }
    renderSections();
  });
  const goTo = key => {
    promptHere = key; promptShut.delete(key); promptOpen.add(key);
    renderSections();
    const step = document.getElementById("p-" + key);
    if (step) step.scrollIntoView({behavior: reduced ? "auto" : "smooth", block: "start"});
  };
  q("[data-pstep]").forEach(a => {
    a.onclick = () => goTo(a.dataset.pstep);
    a.onkeydown = e => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); goTo(a.dataset.pstep); } };
  });
  q("[data-ppipe]").forEach(b => b.onclick = () => {
    /* Held in state rather than on the element: the next control redraws the path, and a
       collapse written onto the DOM would spring open again. */
    const name = b.dataset.ppipe;
    if (promptShutPipes.has(name)) promptShutPipes.delete(name); else promptShutPipes.add(name);
    renderSections();
  });
  q("[data-pvalue]").forEach(v => {
    const show = () => {
      const key = v.dataset.pvalue.split("#")[0];
      promptValue[key] = promptValue[key] === v.dataset.pvalue ? null : v.dataset.pvalue;
      renderSections();
    };
    v.onclick = show;
    v.onkeydown = e => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); show(); } };
  });
  q("[data-pturns]").forEach(b => b.onclick = () => {
    const key = b.dataset.pturns;
    if (promptTurns.has(key)) promptTurns.delete(key); else promptTurns.add(key);
    renderSections();
  });
  q("[data-pcomment]").forEach(b => b.onclick = () => {
    select(b.dataset.pcomment, b.dataset.plabel || addressName(b.dataset.pcomment), "comment");
    putTheComposerWhereTheWordsAre(holder);
    focusComposer();
  });
  q("[data-pask]").forEach(b => b.onclick = () => oneClick(SAY.showRule(b.dataset.pask)));
  q("[data-pselect]").forEach(b => {
    const label = b.textContent;
    b.onclick = () => {
      const words = String(window.getSelection());
      if (!words.trim()) {
        /* The hint replaces the label, and the label comes back: nothing else redraws this
           button, so a builder who pressed it once would keep the hint. */
        b.textContent = "Drag across the words first, then press this";
        setTimeout(() => { b.textContent = label; }, 4000);
        return;
      }
      selectWords(b.dataset.pselect, words, true);
    };
  });
  q(".pbody").forEach(body => body.onmouseup = () => {
    const words = String(window.getSelection());
    if (words.trim().length > 1) selectWords(body.dataset.pmsg.split("#")[0], words, false);
  });
  putTheComposerWhereTheWordsAre(holder);
  q("[data-pwhole]").forEach(b => b.onclick = () => {
    const where = b.dataset.pwhole;
    const into = holder.querySelector(`[data-pwholerec="${cssId(where)}"]`);
    if (!into) return;
    if (!into.hidden) { into.hidden = true; return; }
    b.textContent = "Reading…";
    fetch(`/record/${encodeURIComponent(where.slice(0, where.lastIndexOf("/")))}/${
      where.slice(where.lastIndexOf("/") + 1)}`)
      .then(r => { if (!r.ok) throw new Error("gone"); return r.text(); })
      .then(text => {
        let shown = text;
        if (text.length < 2_000_000) {
          try { shown = JSON.stringify(JSON.parse(text), null, 1); } catch (e) { /* raw */ }
        }
        into.textContent = shown.length > 200_000
          ? shown.slice(0, 200_000) + `\n… ${fmt(shown.length - 200_000)} more characters`
          : shown;
        into.hidden = false;
        b.textContent = "Read the whole record it came from";
      })
      .catch(() => { b.textContent = "Could not be read"; });
  });
  const every = holder.querySelector("#p-everyrun");
  if (every) every.onclick = async () => {
    every.textContent = "reading…";
    try {
      const answer = await fetch("/prompts/every-run");
      DATA.prompts = await answer.json();
      renderSections();
    } catch (e) { every.textContent = "could not read them"; }
  };
}

/* The writing panel follows the prompt being spoken about.

   This page is long, and its whole point is saying something about words in the middle of
   it. The panel is one element on the page, so it is moved to the step rather than copied,
   and it goes back to the rail when the selection leaves this page. */
let composerHome = null;
let composerPanel = null;
function putTheComposerWhereTheWordsAre(holder) {
  /* Held by reference rather than looked up: the panel is moved into a step, and the next
     redraw of the sections detaches it from the document, where an id lookup would find
     nothing and the writing panel would vanish. */
  const panel = composerPanel || document.getElementById("composerwrap");
  if (!panel) return;
  composerPanel = panel;
  composerHome = composerHome || panel.parentElement;
  const held = selected && promptParts(selected.address);
  const at = held ? holder.querySelector(`#p-${cssId(held.where)}`) : null;
  if (at) { at.appendChild(panel); } else if (composerHome) { composerHome.appendChild(panel); }
}
/* An id written into a selector, with the characters a selector reads escaped. */
function cssId(key) {
  return window.CSS && CSS.escape ? CSS.escape(key) : key.replace(/[^\w-]/g, "\\$&");
}

/* Words the builder dragged across. The thread is filed under a digest of the words, so
   selecting them again lands in the thread that is already open on them, and it keeps the
   words, the run and the instruction's digest so it still reads after the text is rewritten. */
function selectWords(key, words, scroll) {
  const step = promptSteps().find(s => promptKey(s) === key);
  if (!step) return;
  const said = words.replace(/\s+/g, " ").trim();
  promptSelection = {
    quoted: said,
    run: step.filled ? step.filled.run : null,
    instruction: step.filled ? step.filled.instruction : null,
  };
  select(`${step.at}#words-${digestOf(said)}`, `the words “${clipWords(said)}”`, "comment");
  /* The panel is moved rather than the page redrawn: a redraw here would take away the
     highlight the reader just made. */
  putTheComposerWhereTheWordsAre(document.getElementById("sections"));
  if (scroll) focusComposer();
}
const clipWords = s => s.length > 60 ? s.slice(0, 60) + "…" : s;
/* An id for one selection, from the words themselves, so selecting them again lands in the
   thread already open on them. FNV-1a twice over the text, which is what a page with no
   crypto in it can compute. It is this page's own id and not the record's `sha256:` digest
   of a piece of fixed text, which is a different function over a different thing. */
function digestOf(text) {
  const one = fnv(text, 0x811c9dc5), two = fnv(text, 0x01000193);
  return (one >>> 0).toString(16).padStart(8, "0") + (two >>> 0).toString(16).padStart(8, "0").slice(0, 4);
}
function fnv(text, seed) {
  let hash = seed;
  for (let i = 0; i < text.length; i++) {
    hash ^= text.charCodeAt(i);
    hash = Math.imul(hash, 0x01000193);
  }
  return hash;
}

function renderSections() {
  /* Every section has a home page. What the sitting ruled by name is filed there; the
     elicitation record follows its stages (a question and its answer file under the stage
     that asks it, a decision under the stage its kind belongs to); everything read from
     runs sits on `ship` until the operations page exists. */
  const bucket = {};
  const put = (page, held) => { (bucket[pageFor(page)] ||= []).push(...held); };
  const shapeHeld = [], buildHeld = [], measureHeld = [], shipHeld = [], leadHeld = [];
  /* The data path's rows carry how much moved through each step, which only a run fills, so
     the table sits with the runs. Its other half, what each step is for and the seams it
     holds, is the story rail beside the drawing at `shape`. */
  dataPathSection(buildHeld);
  workspaceSection(shipHeld);
  if (DECLARED.length) {
    shapeHeld.push(`<div class="mrow outcomes" data-section="seams">${
      seamsRegion()}${stateRegion()}</div>`);
    /* Progress is the build page's first region and sits above the drawing, which is
       where the design put it; everything else on the page follows the drawing. */
    leadHeld.push(progressRegion());
    buildHeld.push(`<div class="mrow outcomes" data-section="constants">${
      constantsRegion()}${promptRulesRegion()}</div>`);
  }
  buildHeld.push(departuresRegion());
  buildHeld.push(lastRunRegion());
  const brainHeld = [], researchHeld = [];
  if (stageSet().includes("brainstorm")) {
    brainHeld.push(ideaRegion());
    brainHeld.push(questionsRegion("brainstorm"));
    brainHeld.push(stagesRegion());
    brainHeld.push(ideaFileRegion());
  }
  if (stageSet().includes("research")) {
    researchHeld.push(decidingFactorRegion());
    researchHeld.push(questionsRegion("research"));
    researchHeld.push(candidatesRegion());
    researchHeld.push(restingRegion());
    researchHeld.push(saidRegion());
  }
  const operateHeld = [];
  if (DATA.operating) {
    const op = DATA.operating;
    operateHeld.push(nowRegion(op));
    operateHeld.push(historyRegion(op));
    operateHeld.push(`<div class="mrow outcomes" data-section="stuck">${
      stuckRegion(op)}${shelvedRegion(op)}</div>`);
    operateHeld.push(`<div class="mrow change" data-section="conversations">${
      conversationsRegion(op)}${changesRegion(op)}</div>`);
    operateHeld.push((op.jobs || []).length
      ? `<div class="mrow outcomes" data-section="ran">${ranRegion(op)}${jobsRegion(op)}</div>`
      : ranRegion(op));
  }
  shipHeld.push(checksRegion());
  shipHeld.push(productRegion());
  shipHeld.push(`<div class="mrow outcomes" data-section="retention">${
    retentionRegion()}${briefBoardRegion()}</div>`);

  const all = DATA.comments || [];
  const threads = all.filter(c => c.status !== "withdrawn");
  const taken = all.filter(c => c.status === "withdrawn");
  if (all.length || live()) {
    const open = threads.filter(c => c.status === "open").length;
    let inner = threads.length
      ? threads.slice().reverse().map(c => renderThread(c)).join("")
      : `<p>The project has no comment threads yet. Select anything on the page and write in
         the panel. It is saved in the project, and your coding agent answers here.</p>`;
    if (taken.length) {
      inner += `<details class="sub" data-sub="taken-back"><summary>Taken back
        <span class="count">${taken.length}</span></summary><div class="subinner">
        <p>These stay in the project's record and are not being acted on. Putting one back
        reopens it.</p>${
        taken.slice().reverse().map(c => renderThread(c)).join("")}</div></details>`;
    }
    shipHeld.push(section("conversation", "The conversation",
      threads.length ? `${threads.length} thread${threads.length === 1 ? "" : "s"} · ${open} open`
      : taken.length ? `${taken.length} taken back` : "No threads yet",
      inner, open > 0));
  }

  if ((DATA.questions_due || []).length) {
    const pendingAnswers = {};
    (DATA.comments || []).forEach(c => {
      if (c.kind === "answer" && c.status === "open" && c.at.startsWith("question:")) {
        pendingAnswers[c.at.slice(9)] = c;
      }
    });
    const row = q => {
      const pending = pendingAnswers[q.name];
      return `<div class="qrow">
        <span class="qname">${esc(q.title || q.name)}</span>
        <p class="asks">${esc(q.asks)}</p>
        ${pending ? `<p class="answer">“${esc(pending.said)}”</p>
           <p class="pending">Answer sent to your coding agent</p>` : ""}
        ${!pending ? `<div class="actions"><button class="btn" data-answer="${esc(q.name)}">Answer it here</button></div>` : ""}
      </div>`;
    };
    /* Each question files under the page of the stage that asks it. */
    stageSet().forEach(page => {
      /* `brainstorm` and `research` draw every question of theirs in four states, which is
         more than the ones this stage still needs. */
      if (page === "brainstorm" || page === "research") return;
      const rows = DATA.questions_due.filter(q => pageFor(q.stage || "brainstorm") === page);
      if (!rows.length) return;
      put(page, [section("questions", "Questions this stage still needs",
        `${rows.filter(q => !q.pending).length} unanswered`,
        rows.map(row).join("") + `<p>An answer given here goes to your coding agent, which
          records it in the project's brief and asks any follow-up the question needs.</p>`)]);
    });
  }

  const brief = DATA.brief || {entries: [], decisions: []};
  const answered = (brief.entries || []).filter(e => e.status === "answered" && e.answer);
  stageSet().forEach(page => {
    /* `brainstorm` and `research` draw every answer inside their Questions region. */
    if (page === "brainstorm" || page === "research") return;
    const rows = answered.filter(e => pageFor(e.stage || DATA.stage || "brainstorm") === page);
    if (!rows.length) return;
    const inner = rows.map(e => `<div class="qrow">
        <span class="qname">${esc(e.title || e.name)}</span>
        ${e.asks ? `<p class="asks">${esc(e.asks)}</p>` : ""}
        <p class="answer">${longText(`question:${e.name}`, e.answer)}</p>
        <div class="actions">
          <button class="btn" data-amend="question:${esc(e.name)}">Amend this answer</button>
          <button class="btn" data-comment="question:${esc(e.name)}">Comment</button>
        </div>
      </div>`).join("");
    put(page, [section("answers", "What was asked, and what the builder said",
      `${rows.length} answered`, inner)]);
  });
  stageSet().forEach(page => {
    const rows = (brief.decisions || []).filter(
      d => pageFor(KIND_PAGE[d.kind] || "shape") === page);
    if (!rows.length) return;
    /* The shape page draws its own, with the mark for each status and the click that agrees
       to one. Every other page lists them. */
    if (page === "shape") { shapeHeld.push(decisionsRegion(rows, "Decisions")); return; }
    const inner = rows.map(d => `<div class="qrow">
        <span class="qname">${esc(d.title || d.name)}</span>
        ${d.status && d.status !== "agreed" ? ` <span class="badge warn">${esc(d.status)}</span>` : ""}
        <p class="answer">${longText(`decision:${d.name}`, d.chose)}</p>
        ${d.because
          ? `<p class="asks">${longText(`decision:${d.name}:why`, `Because ${d.because}`)}</p>`
          : ""}
        <div class="actions">
          <button class="btn" data-amend="decision:${esc(d.name)}">Amend this decision</button>
          <button class="btn" data-comment="decision:${esc(d.name)}">Comment</button>
        </div>
      </div>`).join("");
    put(page, [section("decisions", "What was decided together", `${rows.length}`, inner)]);
  });

  askedSection(shipHeld);
  movedSection(buildHeld);
  examplesSection(measureHeld);
  measureSection(measureHeld);

  const ledgers = DATA.ledgers || {};
  if (Object.keys(ledgers).length) {
    const changeCount = Object.values(ledgers).reduce((a, l) => a + l.length, 0);
    buildHeld.push(section("changes", "What changed since the last run",
      changeCount + (changeCount === 1 ? " change" : " changes"),
      Object.entries(ledgers).map(([name, lines]) =>
        `<p><b>${esc(name)}</b></p><ul>` + lines.map(l => `<li>${esc(l)}</li>`).join("") + `</ul>`
      ).join(""), true));
  }

  const rollouts = DATA.rollouts || {runs: 0, evaluations: []};
  /* What moved through one recorded shape, step by step. A project with no registered
     pipeline has no other account of what its data does. */
  const throughput = p => {
    const nodes = ((p.runs || {}).newest || {}).nodes || {};
    const rows = Object.entries(nodes)
      .filter(([, v]) => v.example && v.example.took_in_volume)
      .map(([id, v]) => `<div class="pathrow" style="grid-template-columns:minmax(0,1fr) minmax(0,1fr) minmax(0,1fr)">
        <span class="st">${esc(id)}</span>
        <span class="much">${esc(v.example.took_in_volume)}</span>
        <span class="much">→ ${esc(v.example.handed_on_volume)}</span></div>`).join("");
    if (!rows) return "";
    return `<details class="sub" data-sub="through-${esc(p.name || p.signature)}">
      <summary>What moved through its last run</summary>
      <div class="subinner"><div class="path">${rows}</div></div></details>`;
  };
  const proven = DECLARED.filter(p => p.runs);
  if (proven.length || HISTORY.length || rollouts.runs) {
    let inner = proven.map(p => {
      const r = p.runs;
      const costs = Object.entries(r.cost_by_basis || {}).filter(([, v]) => v > 0)
        .map(([k, v]) => costText(k, v));
      const figs = [`${fmt(r.runs)} run${r.runs === 1 ? "" : "s"}`];
      if (costs.length) figs.push("spent " + costs.join(" + "));
      if (r.consultations) figs.push(`${fmt(r.consultations)} question${r.consultations === 1 ? "" : "s"} asked`);
      if (r.models && r.models.length) figs.push(r.models.join(", "));
      return `<div class="runrow"><span class="nm">${esc(p.name)}${
        r.code_moved_since ? ` <span class="badge warn">Code changed since</span>` : ""
      }</span><span class="figs">${figs.map(esc).join(" · ")}</span></div>` + throughput(p);
    }).join("");
    const explainRetired = DECLARED.length > 0;
    inner += HISTORY.map(p => {
      const r = p.runs;
      return `<div class="runrow dim"><span class="nm">${esc(p.signature || p.name)}${
        explainRetired ? `<br><span style="font-size:var(--s-1);color:var(--faint)">No longer in the code</span>` : ""
      }</span>
        <span class="figs">${fmt(r.runs)} run${r.runs === 1 ? "" : "s"}${
          r.last ? " · last " + esc(String(r.last).slice(0, 10)) : ""}</span></div>`
        + throughput(p);
    }).join("");
    if (rollouts.runs) {
      const evals = rollouts.evaluations;
      inner += `<p style="margin-top:10px">${fmt(rollouts.runs)} more run${
        rollouts.runs === 1 ? " was" : "s were"} made by ${
        evals.length === 1 ? "an evaluation" : `${fmt(evals.length)} evaluations`} (${
        evals.map(e => `<span class="mono">${esc(e)}</span>`).join(", ")}), and sit under
        <span class="mono">runs/eval/</span>. They are not counted above: the figures there are
        what the project's own runs did.</p>`;
    }
    const runCount = proven.reduce((a, p) => a + p.runs.runs, 0)
      + HISTORY.reduce((a, p) => a + p.runs.runs, 0);
    (DATA.operating ? [] : shipHeld).push(section("history", "What has run",
      `${runCount.toLocaleString("en-US")} run${runCount === 1 ? "" : "s"}`, inner,
      DECLARED.length === 0));
  }

  const info = (DATA.findings || []).filter(f => f.severity === "info");
  if (info.length) {
    shipHeld.push(section("notes", "Worth knowing", `${info.length}`,
      info.map(f => `<p><b>${esc(f.head)}</b> ${esc(f.body)}</p>`).join("")));
  }
  if ((DATA.problems || []).length) {
    shipHeld.push(section("problems", "What the page could not read", `${DATA.problems.length}`,
      `<ul>` + DATA.problems.map(p => `<li>${esc(p)}</li>`).join("") + `</ul>`));
  }

  put("brainstorm", brainHeld);
  put("research", researchHeld);
  put(OPERATE, operateHeld);
  put(PROMPTS, [promptsPage()].filter(Boolean));
  put("shape", shapeHeld);
  put("build", buildHeld);
  put("measure", measureHeld);
  put("ship", shipHeld);
  const holder = document.getElementById("sections");
  const lead = document.getElementById("lead");
  const qsa = sel => [...lead.querySelectorAll(sel), ...holder.querySelectorAll(sel)];
  const openSubs = {};
  qsa("details.sub").forEach(d => { openSubs[d.dataset.sub] = d.open; });
  const EMPTY = {
    brainstorm: "the idea: what the project is for, and the brainstorm questions with their answers",
    research: "the research record: what was looked into, and the dependency decisions later stages rest on",
    shape: "the design: the questions and decisions that shaped it, and where the data goes",
    build: "the build record: what changed since the last run, and the decisions behind the code",
    measure: "what the evaluation measured; the project has not measured anything yet",
    ship: "the run record, the conversation, and the checks",
    operate: "what the live runs are doing, and what they have done since",
    prompts: "every prompt the project sends",
  };
  const ORDER = {
    brainstorm: ["idea", "questions", "staging", "ideafile", "answers", "decisions"],
    research: ["turnson", "questions", "candidates", "resting", "researchsaid", "answers",
               "decisions"],
    shape: ["seams", "decisions", "questions", "answers"],
    build: ["progress", "constants", "claims", "walk", "changes", "moved", "datapath",
            "questions", "decisions", "answers"],
    measure: ["measure", "browser", "groups", "comparison", "trend", "ladder", "examples",
              "questions", "decisions", "answers"],
    ship: ["checks", "product", "retention", "claims", "conversation", "asked", "history",
           "workspace", "notes", "problems", "questions", "decisions", "answers"],
    operate: ["now", "daily", "stuck", "conversations", "ran"],
    prompts: ["prompts"],
  };
  const order = ORDER[shownStage] || [];
  const rank = html => {
    const m = html.match(/data-section="([^"]+)"/);
    const i = m ? order.indexOf(m[1]) : -1;
    return i < 0 ? order.length : i;
  };
  const ordered = (bucket[shownStage] || []).slice().sort((a, b) => rank(a) - rank(b));
  lead.innerHTML = shownStage === "build" ? leadHeld.join("") : "";
  /* A map page with nothing to draw says that once, here, rather than as an empty frame,
     an empty step card and an empty page under each other. */
  const nothingDrawn = MAP_PAGES.includes(shownStage) && !DECLARED.length && !HISTORY.length;
  holder.innerHTML = ordered.join("")
    || (nothingDrawn
      ? `<p class="pageempty">The project has no pipeline yet. The picture starts with the
          first one. This page then holds ${esc(EMPTY[shownStage] || "this stage's record")}.</p>`
      : `<p class="pageempty">This page holds ${esc(EMPTY[shownStage] || "this stage's record")}.
        Nothing is filed here yet.</p>`);
  qsa("details.sub").forEach(d => {
    if (d.dataset.sub in openSubs) d.open = openSubs[d.dataset.sub];
  });
  /* Measured rather than counted: a line the builder wrote can wrap into several, and how
     many depends on the width the reader has. A cell that fits keeps no control. */
  qsa(".longtext").forEach(el => {
    const id = el.dataset.whole;
    const over = el.scrollHeight - el.clientHeight > 4;
    if (!shownWhole.has(id) && !over) { el.classList.remove("clipped"); return; }
    if (shownWhole.has(id)) el.classList.remove("clipped");
    el.insertAdjacentHTML("afterend", `<button class="showall" data-showall="${esc(id)}">${
      shownWhole.has(id) ? "Show less" : "Show all of it"}</button>`);
  });
  wireThreads(holder);
  wirePrompts(holder);
  wireWalk(holder); wireWalk(lead);
  const m = DATA.measured || {};
  qsa("[data-outcome]").forEach(b => b.onclick = () =>
    setBrowserFilter("outcome", b.dataset.outcome, (m.by_outcome || {})[b.dataset.outcome]));
  qsa("[data-criterion]").forEach(b => b.onclick = () =>
    setBrowserFilter("criterion", b.dataset.criterion, (m.criteria_failed || {})[b.dataset.criterion]));
  qsa("[data-group]").forEach(b => b.onclick = () => {
    const cell = ((((m.groups || {}).keys || {})[groupKey]) || []).find(c => c.value === b.dataset.group);
    setBrowserFilter("group", b.dataset.group, cell ? cell.example_ids : []);
  });
  qsa("[data-groupkey]").forEach(b => b.onclick = () => { groupKey = b.dataset.groupkey || null; renderSections(); });
  qsa("[data-clearfilter]").forEach(b => b.onclick = () => { browserFilter = null; renderSections(); });
  qsa("[data-fig]").forEach(b => b.onclick = () => { openFigure = openFigure === b.dataset.fig ? null : b.dataset.fig; renderSections(); });
  qsa("[data-cell]").forEach(b => b.onclick = () => { openCell = openCell === b.dataset.cell ? null : b.dataset.cell; renderSections(); });
  qsa("[data-gridsort]").forEach(b => b.onclick = () => { gridSort = b.dataset.gridsort; renderSections(); });
  qsa("[data-cmp]").forEach(b => b.onclick = () => { comparisonPick = b.dataset.cmp; renderSections(); });
  qsa("[data-pick]").forEach(sel => sel.onchange = () => {
    if (sel.dataset.pick === "before") pickBefore = sel.value; else pickAfter = sel.value;
  });
  qsa("[data-gridsearch]").forEach(input => input.oninput = () => {
    const q = input.value.trim().toLowerCase();
    qsa(".grow").forEach(row => { row.hidden = !!q && !row.dataset.example.toLowerCase().includes(q); });
  });
  qsa("[data-rung]").forEach(b => b.onkeydown = e => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); b.onclick(); } });
  qsa("[data-rung]").forEach(b => b.onclick = () => {
    /* The key is the pipeline's hash and the file, and the hash carries a colon of its own. */
    const cut = b.dataset.rung.lastIndexOf(":");
    const of = b.dataset.rung.slice(0, cut), file = b.dataset.rung.slice(cut + 1);
    const ladder = (m.ladders || []).find(l => l.of === of);
    const rung = ladder && ladder.rungs.find(r => r.file === file);
    if (rungShown && rungShown.key === b.dataset.rung) { rungShown = null; }
    else if (rung) {
      const ids = rung.whole ? null : rung.nodes;
      rungShown = ids ? {key: b.dataset.rung, has: id => ids.includes(id) || ids.some(p => id.startsWith(p + "."))} : null;
    }
    drawGraph(); renderSections();
  });
  qsa("[data-compare]").forEach(b => b.onclick = () => {
    const before = holder.querySelector('[data-pick="before"]').value;
    const after = holder.querySelector('[data-pick="after"]').value;
    b.textContent = "comparing…";
    pickBefore = before; pickAfter = after;
    fetch(`/compare?before=${encodeURIComponent(before)}&after=${encodeURIComponent(after)}`)
      .then(r => r.json()).then(held => { compared = held; comparisonPick = "picked"; renderSections(); })
      .catch(() => { b.textContent = "could not compare"; });
  });
  qsa(".pathrow[data-step]").forEach(row => {
    row.style.cursor = "pointer";
    row.onclick = () => { showStep(row.dataset.step, true);
      document.getElementById("map").scrollIntoView({behavior: reduced ? "auto" : "smooth"}); };
  });
  qsa("[data-answer]").forEach(b => b.onclick = () => {
    const name = b.dataset.answer;
    const q = DATA.questions_due.find(x => x.name === name);
    select(`question:${name}`, q ? q.asks : name, "answer");
    focusComposer();
  });
  qsa("[data-showall]").forEach(b => b.onclick = () => {
    const id = b.dataset.showall;
    if (shownWhole.has(id)) shownWhole.delete(id); else shownWhole.add(id);
    renderSections();
  });
  qsa("[data-amend]").forEach(b => b.onclick = () => {
    select(b.dataset.amend, `amending ${addressName(b.dataset.amend)}`, "amendment");
    focusComposer();
  });
  qsa("[data-comment]").forEach(b => b.onclick = () => {
    select(b.dataset.comment, addressName(b.dataset.comment), "comment");
    focusComposer();
  });
  qsa("[data-agree]").forEach(b =>
    b.onclick = () => agreeToDecision(b.dataset.agree.replace(/^decision:/, "")));
  qsa("[data-store]").forEach(b => b.onclick = () => {
    showResource(b.dataset.store);
    document.getElementById("map").scrollIntoView({behavior: reduced ? "auto" : "smooth"});
  });
  qsa("[data-step]").forEach(b => b.onclick = () => {
    const held = DECLARED.find(p => p.nodes.some(n => n.id === b.dataset.step));
    if (held && held.name !== currentPipe) selectPipe(held.name, b.dataset.step);
    showStep(b.dataset.step, true);
    document.getElementById("map").scrollIntoView({behavior: reduced ? "auto" : "smooth"});
  });
  qsa("[data-agreenum]").forEach(b => b.onclick = () => {
    const held = (DATA.constants || []).find(r => r.name === b.dataset.agreenum);
    oneClick(SAY.agreeNumber(b.dataset.agreenum, held ? held.value : undefined));
  });
  qsa("[data-agreeprompt]").forEach(b => b.onclick = () => oneClick(SAY.showRule(b.dataset.agreeprompt)));
  qsa("[data-goprompts]").forEach(b => b.onclick = () => showPage(PROMPTS));
  qsa("[data-answerwrong]").forEach(b => b.onclick = () => {
    const c = (DATA.claims || []).find(x => x.entry === b.dataset.answerwrong);
    if (c) oneClick(SAY.answerWrong(c));
  });
  qsa("[data-codewrong]").forEach(b => b.onclick = () => {
    const c = (DATA.claims || []).find(x => x.entry === b.dataset.codewrong);
    if (c) oneClick(SAY.codeWrong(c));
  });
  qsa("[data-idea]").forEach(b => b.onclick = () => {
    const name = b.getAttribute("data-idea");
    const held = ((DATA.brief || {}).entries || []).find(e => e.name === name);
    select(`question:${name}`, titleOfEntry(name),
           held && held.status === "answered" ? "amendment" : "answer");
    focusComposer();
  });
  qsa("[data-confirmidea]").forEach(b => b.onclick = () => oneClick(SAY.confirmIdea()));
  qsa("[data-window]").forEach(b => b.onclick = () => {
    windowDays = Number(b.dataset.window); renderSections();
  });
  qsa("[data-checkgo]").forEach(b => b.onclick = () => {
    const row = ((DATA.checks || {}).rows || []).find(r => r.entry === b.dataset.checkgo);
    if (row && row.where) goTo(row.where);
  });
  qsa("[data-walkstep]").forEach(b => b.onclick = () => {
    const at = Number(b.dataset.walkstep);
    walkOpen = walkOpen === at ? null : at;
    renderSections();
  });
}

/* ---------- footer ---------- */
function renderFooter() {
  document.getElementById("foot").innerHTML =
    `Generated from this project's own code, brief, comments and runs · ${esc(DATA.generated_at || "")}.<br>` +
    (live()
      ? `Live: the page follows the project as it changes, and what is written here lands in it.`
      : `The page is generated from the project. Regenerate any time: <span class="mono">simple-agents view</span>; ` +
        `<span class="mono">simple-agents view --serve</span> makes it live.`);
}

/* ---------- render everything ---------- */
function wireWalk(scope) {
  scope.querySelectorAll("[data-fetchwalk]").forEach(b => b.addEventListener("click", () => {
    const name = b.dataset.fetchwalk;
    b.textContent = "Reading…";
    fetch(`/run/${encodeURIComponent(name)}`).then(r => r.json()).then(held => {
      DATA.walks = DATA.walks || {walks: {}, others: []};
      DATA.walks.walks[name] = held;
      DATA.walks.others = (DATA.walks.others || []).filter(x => x !== name);
      openWalk(name);
    }).catch(() => { b.textContent = "Could not be read"; });
  }));
  scope.querySelectorAll("[data-walkpick]").forEach(b => b.addEventListener("click", () => {
    walking = b.dataset.walkpick; walkOpen = null; renderSections();
  }));
  scope.querySelectorAll("[data-fetchrecord]").forEach(b => b.addEventListener("click", () => {
    const seq = b.dataset.fetchrecord;
    const holder = scope.querySelector(`[data-fullrec="${seq}"]`);
    if (!holder) return;
    if (!holder.hidden) { holder.hidden = true; return; }
    b.textContent = "Reading…";
    fetch(`/record/${encodeURIComponent(walking)}/${seq}`).then(r => {
      if (!r.ok) throw new Error("gone");
      return r.text();
    }).then(text => {
      /* Pretty-printed while that is cheap; a record too large to lay out is shown raw
         and clipped, with the clip named. */
      let shown = text;
      if (text.length < 2_000_000) {
        try { shown = JSON.stringify(JSON.parse(text), null, 1); } catch (e) { /* raw */ }
      }
      holder.textContent = shown.length > 200_000
        ? shown.slice(0, 200_000) + `\n… ${fmt(shown.length - 200_000)} more characters`
        : shown;
      holder.hidden = false;
      b.textContent = "Full record";
    }).catch(() => { b.textContent = "Could not be read"; });
  }));
  scope.querySelectorAll("[data-walk]").forEach(b => b.addEventListener("click", () => {
    const held = (DATA.walks || {}).walks || {};
    if (!held[b.dataset.walk]) return;
    openWalk(b.dataset.walk);
  }));
}
/* The walk lives on the build page. Opening one from the measure grid or the operate page
   switches there and lands on it; a button that loaded the run and changed nothing on the
   page it was pressed on had done nothing the reader could see. */
function openWalk(name) {
  walking = name;
  walkOpen = null;
  const home = pageFor("build");
  if (shownStage !== home) showPage(home); else renderSections();
  const open = document.querySelector('[data-section="walk"]');
  if (open) {
    openAncestors(open);
    if (open.tagName === "DETAILS") open.open = true;
    open.scrollIntoView({behavior: reduced ? "auto" : "smooth"});
  }
}

/* One tooltip for every mark on the measure page: whatever carries `data-tip` shows it on
   hover and on focus, and the same words sit in the mark's own label for a reader with no
   pointer. */
const tipBox = document.getElementById("tip");
function showTip(target, x, y) {
  if (!tipBox || !target) return;
  tipBox.textContent = target.getAttribute("data-tip") || "";
  tipBox.classList.add("on");
  const w = tipBox.offsetWidth || 0, h = tipBox.offsetHeight || 0;
  const left = Math.min(x + 14, (window.innerWidth || 1200) - w - 8);
  const top = y + 18 + h > (window.innerHeight || 800) ? y - h - 10 : y + 18;
  tipBox.style.left = `${Math.max(4, left)}px`;
  tipBox.style.top = `${Math.max(4, top)}px`;
}
function hideTip() { if (tipBox) tipBox.classList.remove("on"); }
document.addEventListener("mousemove", e => {
  const t = e.target && e.target.closest ? e.target.closest("[data-tip]") : null;
  if (t) showTip(t, e.clientX, e.clientY); else hideTip();
});
document.addEventListener("focusin", e => {
  const t = e.target && e.target.closest ? e.target.closest("[data-tip]") : null;
  if (t) { const r = t.getBoundingClientRect(); showTip(t, r.left, r.top + r.height); }
});
document.addEventListener("focusout", hideTip);

function renderAll() {
  DECLARED = DATA.pipelines.filter(p => p.origin === "declared");
  HISTORY = DATA.pipelines.filter(p => p.origin === "runs");
  if (!shownStage || !stageSet().includes(shownStage)) {
    shownStage = anchorStage();
    population = shownStage === "measure" ? "rollouts" : "runs";
  }
  const boardless = !MAP_PAGES.includes(shownStage) || (!DECLARED.length && !HISTORY.length);
  const map = document.getElementById("map");
  map.className = boardless ? "boardless" : "";
  /* The measure page is about what was measured: the record comes first and the drawing,
     carrying the evaluation's figures on each step, sits below it. Every other page with a
     drawing opens on the drawing. A page without one opens on its content, and the writing
     panel follows it. */
  const record = document.getElementById("sections");
  if (map.parentElement && record.parentElement === map.parentElement) {
    const first = shownStage === "measure" || boardless ? record : map;
    const second = first === record ? map : record;
    if (first.nextElementSibling !== second && first.compareDocumentPosition
        && (first.compareDocumentPosition(second) & Node.DOCUMENT_POSITION_PRECEDING)) {
      map.parentElement.insertBefore(first, second);
    }
  }
  document.getElementById("rail-title").textContent =
    boardless ? "Say something" : "The selected step";
  if (!currentPipe || !DECLARED.some(p => p.name === currentPipe)) {
    const moving = DATA.running && DATA.running.pipeline;
    currentPipe = (moving && DECLARED.some(p => p.name === moving)) ? moving
      : DECLARED[0] ? DECLARED[0].name : null;
  }
  const kept = window.scrollY;
  renderHeader(); renderStageStrip(); renderEyes(); drawTabs(); renderStory();
  if (boardless) {
    /* No drawing on this page, so no step card either: the rail is the writing surface,
       addressed to the project unless something on this page was selected. */
    /* A prompt's address holds a step in it and is read on this page, so it stays. */
    if (!selected || (selected.address.includes("/") && !selected.address.startsWith("prompt:"))) {
      selected = {address: "project", label: "the whole project", kind: "comment"};
    }
    document.getElementById("stepcard").innerHTML = "";
    renderComposer();
    renderSections(); renderFooter();
    window.scrollTo(0, kept);
    return;
  }
  if (railShows && railShows.kind === "resource"
      && (DATA.resources || []).some(r => r.name === railShows.name)) {
    showResource(railShows.name);
    drawSystem(); renderSections(); renderFooter();
    window.scrollTo(0, kept);
    return;
  }
  if (currentPipe) {
    const p = DECLARED.find(x => x.name === currentPipe);
    if (!currentStep || !p.nodes.some(n => n.id === currentStep)) {
      currentStep = (p.nodes.find(n => n.planned) || p.nodes.find(n => n.kind === "agent") || p.nodes[0] || {}).id || null;
    }
    showStep(currentStep);
  } else { showStep(null); }
  drawSystem(); renderSections(); renderFooter();
  window.scrollTo(0, kept);
}

/* ---------- live polling ---------- */
let lastState = null;
async function poll() {
  try {
    const response = await fetch("/version", {cache: "no-store"});
    if (!response.ok) return;
    const held = await response.json();
    if (lastState !== null && held.state !== lastState) await refresh();
    lastState = held.state;
  } catch (e) { /* the server is away; the next poll tries again */ }
}
if (DATA.live) { poll(); setInterval(poll, 2500); }

matchMedia("(prefers-color-scheme: dark)").addEventListener("change", renderAll);
let resizeTimer = null;
window.addEventListener("resize", () => {
  clearTimeout(resizeTimer);
  resizeTimer = setTimeout(() => {
    if (document.getElementById("map").classList.contains("boardless")) return;
    drawSystem(); drawGraph();
  }, 120);
});
applyTheme(savedTheme());
renderAll();
})();
</script>
