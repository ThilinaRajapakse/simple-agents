<title>__TITLE__</title>
<style>
/* Five palettes, and the page follows the reader's system until they choose one.
   Every pair a reader meets was checked before it shipped: text at 4.5:1 or better,
   and a line in a drawing at 3:1, which is what a shape rather than a letter needs. */
:root{
  --ground:#F7F5F0; --surface:#FFFFFF; --sunk:#F0EDE6;
  --ink:#1E1C18; --muted:#57524A; --faint:#6A665C;
  --line:#DFDAD0; --line-strong:#C2BCB0;
  --edge:#8A8377; --edge-soft:#96907F;
  --accent:#0A6E52; --accent-soft:#D6EDE3;
  --attention:#A8283F; --attention-soft:#F8DDE2;
  --note:#8A5210; --note-soft:#F7E8D2;
    /* the outcome scale: the accent hue's arm for right, the attention hue's arm for wrong, stepped
     for this surface and validated as ordinal ramps; the neutral is for a rollout that measured nothing */
  --o-right:#06654B; --o-absent:#209E78; --o-partial:#D6455A; --o-missed:#AA1338; --o-wrong:#6B1424; --o-none:#6A665C;
  --shadow:0 1px 2px rgba(22,27,25,.05),0 10px 26px -16px rgba(22,27,25,.25);
  --s-1:.8125rem; --s0:.9375rem; --s1:1.0625rem; --s2:1.35rem; --s3:1.9rem; --s4:2.3rem;
  /* Fonts sit in the base block alone: a palette changes colours and nothing else. */
  --mono:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme]){
    --ground:#0D1311; --surface:#151C19; --sunk:#101715;
    --ink:#E7EEEA; --muted:#9AAAA3; --faint:#8A9A93;
    --line:#28332F; --line-strong:#3A4842;
    --edge:#6E837A; --edge-soft:#61736C;
    --accent:#4ECFAF; --accent-soft:#12332C;
    --attention:#F0798F; --attention-soft:#3A171C;
    --note:#F0A24F; --note-soft:#382812;
      /* the outcome scale: the accent hue's arm for right, the attention hue's arm for wrong, stepped
     for this surface and validated as ordinal ramps; the neutral is for a rollout that measured nothing */
  --o-right:#17A689; --o-absent:#036C58; --o-partial:#A81245; --o-missed:#D44568; --o-wrong:#F47A91; --o-none:#8A9A93;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 12px 30px -18px rgba(0,0,0,.8);
  }
}

    /* the outcome scale: the accent hue's arm for right, the attention hue's arm for wrong, stepped

  --shadow:0 1px 2px rgba(22,27,25,.05),0 10px 26px -16px rgba(22,27,25,.25);
}

  --shadow:0 1px 2px rgba(22,27,25,.05),0 10px 26px -16px rgba(22,27,25,.25);
}
:root[data-theme="forest"]{
  --ground:#0D1311; --surface:#151C19; --sunk:#101715;
  --ink:#E7EEEA; --muted:#9AAAA3; --faint:#8A9A93;
  --line:#28332F; --line-strong:#3A4842;
  --edge:#6E837A; --edge-soft:#61736C;
  --accent:#4ECFAF; --accent-soft:#12332C;

}

}
:root[data-theme="midnight"]{
  --ground:#0B0D18; --surface:#141726; --sunk:#0F1220;
  --ink:#E9EAF6; --muted:#9EA2C0; --faint:#8E93B4;
  --line:#242840; --line-strong:#363C5C;
  --edge:#737AA6; --edge-soft:#646D96;
  --accent:#8B7BFF; --accent-soft:#1E1B3D;
  --attention:#FF7A9C; --attention-soft:#3A1524;
  --note:#F5A83C; --note-soft:#3A2A10;
    /* the outcome scale: the accent hue's arm for right, the attention hue's arm for wrong, stepped

  --o-right:#8172EE; --o-absent:#523AB2; --o-partial:#9E0146; --o-missed:#CA3C69; --o-wrong:#F6668E; --o-none:#8E93B4;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 12px 30px -18px rgba(0,0,0,.8);

*{box-sizing:border-box}
body{margin:0;background:var(--ground);color:var(--ink);
  font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;font-size:var(--s0);line-height:1.5;
  -webkit-font-smoothing:antialiased;font-variant-ligatures:none}
svg text,.mono,code{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-variant-ligatures:none}
.wrap{max-width:1500px;margin:0 auto;padding:0 24px 80px}
h1,h2,h3{margin:0;letter-spacing:-.015em;text-wrap:balance}
.mono{font-family:"JetBrains Mono",ui-monospace,Menlo,monospace}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
button:focus-visible,[tabindex]:focus-visible,textarea:focus-visible,input:focus-visible{
  outline:2px solid var(--accent);outline-offset:2px}
textarea,input[type=text]{font:inherit;color:var(--ink);background:var(--ground);
  border:1px solid var(--line-strong);border-radius:6px;padding:8px 10px;width:100%}
textarea{resize:vertical;min-height:64px}

/* header */
header{padding:34px 0 18px;border-bottom:1px solid var(--line)}
.crumbs{display:flex;gap:10px;align-items:baseline;flex-wrap:wrap}
header h1{font-size:var(--s3);font-weight:700}
.chip{font-family:"JetBrains Mono",monospace;font-size:var(--s-1);border:1px solid var(--line-strong);
  border-radius:99px;padding:2px 11px;color:var(--muted);white-space:nowrap}
.chip.acc{color:var(--accent);border-color:var(--accent)}
.chip.live{color:var(--accent);border-color:var(--accent)}
.chip.live::before{content:"●";margin-right:6px}
.stamp{margin-left:auto;color:var(--faint);font-size:var(--s-1);font-family:ui-monospace,monospace}
.themes{display:flex;gap:5px;align-items:center}
.themes button{width:19px;height:19px;padding:0;border-radius:50%;border:1px solid var(--line-strong);
  cursor:pointer;position:relative}
.themes button[aria-pressed="true"]{outline:2px solid var(--accent);outline-offset:2px}
.themes button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.themes .sys{background:var(--surface);color:var(--muted);width:auto;height:19px;border-radius:99px;
  padding:0 8px;font-size:11.5px;line-height:17px}
.standing{font-size:var(--s2);font-weight:500;margin-top:14px;max-width:62ch;line-height:1.4}
.intent{margin-top:18px;max-width:76ch;border-left:3px solid var(--accent);padding:2px 0 2px 15px}
.intent .eyebrow{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:var(--s-1);
  color:var(--faint);letter-spacing:.1em;text-transform:uppercase}
.intent .purpose{font-family:Georgia,serif;font-size:var(--s1);line-height:1.45;margin:4px 0 0}
.intent .facts{display:flex;gap:8px 18px;flex-wrap:wrap;margin-top:7px;color:var(--muted);font-size:var(--s-1)}
.intent .facts b{color:var(--ink);font-weight:600}
.quickactions{display:flex;gap:8px;flex-wrap:wrap;margin-top:17px}
.quickactions button{border:1px solid var(--line-strong);border-radius:7px;padding:6px 12px;
  color:var(--accent);background:var(--surface);font-weight:600;font-size:var(--s-1)}
.quickactions button.primary{color:var(--surface);background:var(--accent);border-color:var(--accent)}
.quickactions button:hover{background:var(--accent-soft)} .quickactions button.primary:hover{filter:brightness(1.08)}

/* the stage strip: one page per stage, the homepage anchored to the project's own */
.stagestrip{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-top:18px;
  padding:8px 10px;border:1px solid var(--line);border-radius:9px;background:var(--surface)}
.stagestrip button{border:1px solid transparent;border-radius:7px;padding:5px 11px;
  background:none;color:var(--muted);font-size:var(--s-1);font-weight:600;cursor:pointer;
  display:flex;gap:7px;align-items:center}
.stagestrip button .mark{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  font-size:var(--s-1)}
.stagestrip button.done{color:var(--ink)}
.stagestrip button.ahead{color:var(--faint)}
.stagestrip button.here{color:var(--accent)}
.stagestrip button[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft);
  color:var(--accent)}
.stagestrip button:hover{background:var(--sunk)}
.stagestrip .youarehere{margin-left:auto;color:var(--faint);font-size:var(--s-1)}
.pageempty{color:var(--muted);border:1px dashed var(--line-strong);border-radius:9px;
  padding:14px 16px;margin-top:18px}
/* the prompts page: the path down the left, the prompts beside it */
.stagestrip button.aside{color:var(--accent)}
.phead{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;margin-top:4px}
.phead h2{font-size:var(--s2);margin:0;font-weight:600}
.phead .count{margin-left:auto;font-family:var(--mono);font-size:var(--s-1);color:var(--faint)}
.plede{color:var(--muted);max-width:88ch;margin:8px 0 0}
.pcontrols{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin:14px 0 16px}
.pseg{display:inline-flex;border:1px solid var(--line-strong);border-radius:7px;overflow:hidden}
.pseg button{font:inherit;font-size:var(--s-1);font-family:var(--mono);background:var(--surface);
  color:var(--muted);border:0;padding:5px 12px;cursor:pointer}
.pseg button+button{border-left:1px solid var(--line)}
.pseg button[aria-pressed="true"]{background:var(--accent-soft);color:var(--accent);font-weight:600}
.ppicker{font-family:var(--mono);font-size:var(--s-1);color:var(--muted);
  border:1px solid var(--line);border-radius:7px;padding:5px 10px;background:var(--sunk)}
.ppicker b{color:var(--ink);font-weight:600}
.pcols{display:grid;grid-template-columns:264px minmax(0,1fr);gap:20px;align-items:start}
@media (max-width:1100px){.pcols{grid-template-columns:minmax(0,1fr)}.ptree{position:static}}
.ptree{position:sticky;top:14px;background:var(--surface);border:1px solid var(--line);
  border-radius:10px;padding:12px 10px 14px;max-height:calc(100vh - 40px);overflow:auto}
.ptree h3{font-family:var(--mono);font-size:11.5px;letter-spacing:.09em;text-transform:uppercase;
  color:var(--faint);font-weight:600;margin:2px 0 8px 8px}
.ptree .pipe{margin-bottom:6px}
.ptree .pname{display:flex;gap:7px;align-items:center;width:100%;text-align:left;font:inherit;
  font-family:var(--mono);font-size:var(--s-1);font-weight:600;color:var(--ink);background:none;
  border:0;padding:5px 8px;border-radius:6px;cursor:pointer}
.ptree .pname:hover{background:var(--sunk)}
.ptree .pname .tw{color:var(--faint);width:11px;display:inline-block;
  font-family:system-ui,-apple-system,"Segoe UI",sans-serif;font-size:11px}
.ptree ul{list-style:none;margin:0 0 0 13px;padding:0 0 0 8px;border-left:1px solid var(--line)}
.ptree li a{display:block;text-decoration:none;color:var(--muted);font-size:var(--s-1);
  padding:4px 8px;border-radius:6px;border-left:2px solid transparent;margin-left:-1px;cursor:pointer}
.ptree li a:hover{background:var(--sunk);color:var(--ink)}
.ptree li a.here{background:var(--sunk);color:var(--ink);border-left-color:var(--accent);font-weight:600}
.ptree li a span{display:block;font-family:var(--mono);font-size:11px;color:var(--faint);margin-top:1px}
.ptree li a.warn span{color:var(--note)}
.ptree li.gap{font-size:12px;color:var(--faint);padding:3px 8px 4px;font-style:italic}
.ptree .filters{display:flex;gap:6px;flex-wrap:wrap;padding:10px 8px 2px;
  border-top:1px solid var(--line);margin-top:8px}
.pstack{display:grid;gap:14px;min-width:0}
.pstep{background:var(--surface);border:1px solid var(--line);border-radius:10px;
  padding:14px 20px 18px;scroll-margin-top:16px}
.pstep.shut{padding-bottom:14px}
.pstep.shut .pmsgs,.pstep.shut .pnotes,.pstep.shut .pturns{display:none}
.shead{display:flex;gap:10px;align-items:baseline;flex-wrap:wrap}
.shead button.id{font:inherit;font-family:var(--mono);font-size:var(--s1);color:var(--ink);
  font-weight:600;background:none;border:0;padding:0;cursor:pointer;text-align:left}
.shead button.id:hover{color:var(--accent)}
.shead .tw{color:var(--faint);font-family:system-ui,-apple-system,"Segoe UI",sans-serif;
  font-size:12px;margin-right:4px}
.shead .kind{font-family:var(--mono);font-size:var(--s-1);color:var(--faint)}
.prule{color:var(--muted);font-size:var(--s-1);margin:7px 0 0;max-width:92ch}
.prule b{color:var(--ink);font-weight:600}
.pnotes{margin:8px 0 0;display:grid;gap:5px}
.pnote{font-size:var(--s-1);color:var(--note);border-left:2px solid var(--note);padding-left:9px}
.pnote.plain{color:var(--muted);border-left-color:var(--line-strong)}
.pmsgs{display:grid;grid-template-columns:126px minmax(0,1fr);gap:12px 14px;margin-top:14px;
  align-items:start}
.pmsg{display:contents}
.prole{padding-top:8px}
.prole b{display:block;font-family:var(--mono);font-size:var(--s-1);color:var(--ink);
  letter-spacing:.06em;text-transform:uppercase;font-weight:600}
.prole span{display:block;font-size:11.5px;color:var(--faint);line-height:1.35;margin-top:3px}
.pbody{border:1px solid var(--line);border-left:2px solid var(--accent);border-radius:0 8px 8px 0;
  background:var(--sunk);padding:11px 14px;font-size:15px;line-height:1.62;
  white-space:pre-wrap;overflow-wrap:anywhere;max-width:96ch}
.pmsg.carried .pbody{border-left-color:var(--line-strong);color:var(--muted)}
.pmsg.outside .pbody{border-left-color:var(--note)}
.pv{background:var(--accent-soft);border-radius:4px;padding:1px 4px;font-family:var(--mono);
  font-size:13px;cursor:pointer;border:1px solid transparent}
.pv:hover,.pv:focus-visible{border-color:var(--accent);outline:none}
.pv.capped{background:var(--note-soft)}
.pv .nm{font-size:11px;letter-spacing:.04em;color:var(--faint);vertical-align:.5em;margin-left:3px}
.pbody.tpl .pv .nm{display:none}
.pvpanel{grid-column:2;border:1px solid var(--line-strong);border-radius:8px;
  background:var(--surface);padding:10px 14px 12px;font-size:var(--s-1);color:var(--muted);
  margin-top:-6px}
.pvpanel dl{display:grid;grid-template-columns:auto minmax(0,1fr);gap:3px 14px;margin:0}
.pvpanel dt{font-family:var(--mono);color:var(--faint)}
.pvpanel dd{margin:0;color:var(--ink);font-variant-numeric:tabular-nums}
.pvpanel .warnline{color:var(--note);margin:8px 0 0}
.pacts{display:flex;gap:8px;margin-top:8px;flex-wrap:wrap}
.pacts.wide{grid-column:2}
.pturns{margin-top:12px;border-top:1px solid var(--line);padding-top:10px}
.pturns>button{font:inherit;font-size:var(--s-1);background:none;border:0;
  color:var(--muted);cursor:pointer;padding:2px 0}
.pturns>button:hover{color:var(--accent)}
.pturn{display:grid;grid-template-columns:92px minmax(0,1fr) auto;gap:12px;padding:6px 0;
  border-top:1px solid var(--line);font-size:var(--s-1);align-items:baseline}
.pturn .n{font-family:var(--mono);color:var(--faint)}
.pturn .what{color:var(--ink);overflow-wrap:anywhere}
.pturn .what em{color:var(--muted);font-style:normal;font-family:var(--mono);font-size:11.5px}
.pturn .cost{font-family:var(--mono);color:var(--faint);font-variant-numeric:tabular-nums;
  text-align:right}
.pshut{color:var(--muted);font-size:var(--s-1);margin:7px 0 0}
.thread .quoted{border-left:2px solid var(--note);background:var(--note-soft);padding:6px 10px;
  border-radius:0 6px 6px 0;margin:0 0 8px;font-size:var(--s-1)}
@media (max-width:900px){
  .pmsgs{grid-template-columns:minmax(0,1fr)}
  .prole{padding-top:0}.pvpanel,.pacts.wide{grid-column:1}
}
/* the measure page: a grid of regions, and nothing that is a chart collapses */
.mpage{display:grid;gap:12px}
.mregion{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:16px 20px 14px;min-width:0}
.mregion>p{color:var(--muted);max-width:100ch}
.mrow{display:grid;gap:12px;min-width:0}
.mrow.outcomes{grid-template-columns:minmax(0,5fr) minmax(0,7fr)}
.mrow.change{grid-template-columns:minmax(0,7fr) minmax(0,5fr)}
@media (max-width:1040px){.mrow.outcomes,.mrow.change{grid-template-columns:minmax(0,1fr)}}
.mhead{display:flex;gap:12px;align-items:baseline;flex-wrap:wrap;margin:0 0 10px}
.mhead h3{margin:0;font-size:var(--s1);font-weight:600;color:var(--ink)}
.mhead .count{font-family:"JetBrains Mono",monospace;font-size:var(--s-1);color:var(--muted)}
.mhead .dial{margin-left:auto}
.crit{margin-top:16px;padding-top:12px;border-top:1px solid var(--line)}

/* the strip */
.stripgrid{display:grid;grid-template-columns:minmax(0,3fr) minmax(0,2fr);gap:24px;align-items:start}
@media (max-width:1040px){.stripgrid{grid-template-columns:minmax(0,1fr)}}
.hero{display:flex;gap:16px;align-items:baseline;flex-wrap:wrap}
.hero .big{font-size:var(--s4);font-weight:600;line-height:1;color:var(--ink);letter-spacing:-.01em}
.hero .big.muted{color:var(--muted);font-size:var(--s3)}
.hero .what{color:var(--muted);line-height:1.35}
.hero .what .mono{color:var(--ink)}
.facts{margin-top:12px;color:var(--muted);font-size:var(--s-1);line-height:1.7}
.tiles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.tile{display:grid;gap:3px;padding:10px 12px;border:1px solid var(--line);border-radius:8px;background:var(--ground);min-width:0}
.tile .lbl{font-size:var(--s-1);color:var(--faint)}
.tile .val{font-size:var(--s1);font-weight:600;color:var(--ink);font-variant-numeric:tabular-nums}
.tile .val.small{font-size:var(--s0);font-weight:500;line-height:1.35}
.tile .val.muted{color:var(--muted);font-weight:500}
.tile .val.up{color:var(--accent)} .tile .val.down{color:var(--attention)}
.tile .sub{font-size:var(--s-1);color:var(--muted);line-height:1.4;overflow-wrap:anywhere}

/* one 0–100% axis, used by the strip, the figures, the conditions and the comparison */
.ax{position:relative;height:12px;border-radius:6px;background:var(--sunk);margin:8px 0 0;min-width:0}
.ax.tall{height:16px;border-radius:8px;margin-top:14px}
.ax.empty{background:transparent;display:flex;align-items:center;margin:0}
.ax .band{position:absolute;top:0;bottom:0;background:var(--accent);opacity:.3;border-radius:6px}
.ax .dot{position:absolute;top:50%;width:10px;height:10px;margin:-5px 0 0 -5px;border-radius:50%;background:var(--accent);
  box-shadow:0 0 0 2px var(--surface)}
.ax.tall .dot{width:14px;height:14px;margin:-7px 0 0 -7px}
.ax .mark{position:absolute;top:50%;width:10px;height:10px;margin:-5px 0 0 -5px;box-sizing:border-box}
.ax .mark.floor{border-radius:50%;border:2px solid var(--ink);background:var(--surface)}
.ax .mark.last{width:11px;height:11px;margin:-5.5px 0 0 -5.5px;transform:rotate(45deg);background:var(--muted);box-shadow:0 0 0 2px var(--surface)}
.axends{display:flex;justify-content:space-between;color:var(--muted);font-size:11px;margin-top:5px}
.axends .range{color:var(--ink);font-weight:500;font-variant-numeric:tabular-nums}
.axkey{display:flex;gap:16px;flex-wrap:wrap;color:var(--muted);font-size:var(--s-1);margin-top:8px}
.axkey span{display:inline-flex;align-items:center;gap:6px}
.axkey i{display:inline-block;width:10px;height:10px;border-radius:50%;background:var(--accent);box-sizing:border-box}
.axkey i.mark.floor{border:2px solid var(--ink);background:var(--surface)}
.axkey i.mark.last{border-radius:0;transform:rotate(45deg);background:var(--muted);width:9px;height:9px}
.axkey i.before{background:var(--surface);border:2px solid var(--accent)}
.ax.dumb .link{position:absolute;top:50%;height:2px;margin-top:-1px;background:var(--accent);opacity:.5}
.ax.dumb .before{position:absolute;top:50%;width:10px;height:10px;margin:-5px 0 0 -5px;border-radius:50%;background:var(--surface);
  border:2px solid var(--accent);box-sizing:border-box}
.drow.held .ax .link,.drow.held .ax .dot{background:var(--faint)} .drow.held .ax .before{border-color:var(--faint)}
.drow.undecided .ax .link,.drow.undecided .ax .dot{background:var(--muted)} .drow.undecided .ax .before{border-color:var(--muted)}

/* the diverging outcome bar */
.divends{display:flex;justify-content:space-between;gap:10px;font-size:var(--s-1);color:var(--ink);font-weight:600}
.divends .muted{color:var(--muted);font-weight:400}
.divbar{display:flex;gap:2px;height:28px;margin:6px 0 10px}
.seg{border:0;height:100%;min-width:3px;cursor:pointer;font-size:var(--s-1);font-weight:500;overflow:hidden;white-space:nowrap;
  padding:0 6px;border-radius:3px;text-overflow:ellipsis}
.seg:first-child{border-radius:6px 3px 3px 6px} .seg:last-child{border-radius:3px 6px 6px 3px}
.seg[aria-pressed="true"]{outline:2px solid var(--ink);outline-offset:2px}
.seg:hover{filter:brightness(1.12)}
.legend{display:flex;gap:6px 18px;flex-wrap:wrap;font-size:var(--s-1);color:var(--muted)}
.keyrow{display:inline-flex;align-items:center;gap:6px}
.keyrow i{display:inline-block;width:11px;height:11px;border-radius:3px}
.keyrow b{color:var(--ink);font-weight:600;font-variant-numeric:tabular-nums}
.crow{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,2fr) 4.5em minmax(0,1.2fr);gap:12px;align-items:center;width:100%;
  text-align:left;background:transparent;border:0;border-top:1px solid var(--line);padding:7px 0;cursor:pointer;color:var(--muted);font:inherit}
.crow:first-of-type{border-top:0}
.crow .ax{margin:0}
.crow .pt{text-align:right;font-weight:600;color:var(--ink);font-variant-numeric:tabular-nums}
.crow[aria-pressed="true"] .mono{color:var(--accent)}
.crow:hover .mono{color:var(--accent)}

/* the example grid */
.gridbar{display:flex;gap:14px;align-items:center;flex-wrap:wrap;margin-bottom:8px}
.gridsearch{font:inherit;font-size:var(--s-1);color:var(--ink);background:var(--ground);border:1px solid var(--line);border-radius:6px;padding:4px 9px;min-width:12em}
.litnote{display:inline-flex;gap:10px;align-items:center;color:var(--ink);font-size:var(--s-1)}
.gridhead,.grow{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1.4fr) auto 3.2em;gap:12px;align-items:center}
.gridhead{font-size:11px;color:var(--faint);text-transform:uppercase;letter-spacing:.07em;padding:0 0 6px}
.grid{max-height:560px;overflow:auto;display:grid;gap:2px;border-top:1px solid var(--line);padding-top:6px}
.grow{padding:2px 0;min-height:26px}
.grow .expects{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;line-height:1.35}
.sentnote{color:var(--accent);font-size:var(--s-1);white-space:nowrap}
.qstate.sent .mark{color:var(--accent)}
.drow .dwhy{grid-column:1 / -1;font-size:var(--s-1);color:var(--muted);padding:0 0 4px}
.grow.dim>*:not(.cells){opacity:.55}
.grow .cells{display:grid;gap:2px}
.gcell{width:22px;height:22px;border:0;border-radius:4px;cursor:pointer;padding:0;box-shadow:0 0 0 2px var(--surface) inset}
.gcell.dim{opacity:.22}
.gcell:hover{outline:2px solid var(--ink);outline-offset:1px}
.gcell.open{outline:2px solid var(--ink);outline-offset:1px}
.grow .score{text-align:right;font-variant-numeric:tabular-nums;color:var(--muted);font-size:var(--s-1)}
.grow .score.wrong{color:var(--ink);font-weight:600}
.gdetail{grid-column:1 / -1;display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:12px;align-items:center;
  padding:8px 10px;margin:2px 0 6px;background:var(--ground);border:1px solid var(--line);border-radius:7px;font-size:var(--s-1);color:var(--muted)}
.gdetail b{color:var(--ink);font-weight:500;overflow-wrap:anywhere}
.chip.outcome{font-size:var(--s-1);padding:1px 8px;border-radius:9px;border:0;white-space:nowrap}

/* every figure on one axis */
.fhead,.dhead{display:grid;font-size:11px;color:var(--faint);text-transform:uppercase;letter-spacing:.07em;padding:0 0 4px;gap:12px}
.fhead{grid-template-columns:minmax(0,1.3fr) minmax(0,3fr) 5em 9em 3em}
.dhead{grid-template-columns:minmax(0,1.7fr) minmax(0,2.6fr) 5em 6em}
.axlbl{display:flex;justify-content:space-between}
.ftable,.dtable{display:grid}
.frow{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,3fr) 5em 9em 3em;gap:12px;align-items:center;width:100%;text-align:left;
  background:transparent;border:0;border-top:1px solid var(--line);padding:6px 0;cursor:pointer;font:inherit;color:var(--muted)}
.frow .ax{margin:0}
.frow .nm{color:var(--ink);overflow-wrap:anywhere}
.frow .pt{text-align:right;font-weight:600;color:var(--ink);font-variant-numeric:tabular-nums}
.frow .rng,.frow .n{font-size:var(--s-1);font-variant-numeric:tabular-nums}
.frow .n{text-align:right}
.frow:hover .nm,.frow.open .nm{color:var(--accent)}
.frow.sub{border-top:1px dotted var(--line);padding:4px 0;font-size:var(--s-1)}
.frow.sub .nm{color:var(--muted);font-family:inherit;padding-left:18px}
.frow.sub[aria-pressed="true"] .nm{color:var(--accent)}
.fnumbers{padding:4px 0 10px 18px;border-top:1px dotted var(--line)}
.numgrid{display:grid;grid-template-columns:max-content minmax(0,1fr);gap:3px 14px;font-size:var(--s-1);color:var(--ink)}
.numgrid span:nth-child(odd){color:var(--faint)}

/* before → after per figure */
.drow{display:grid;grid-template-columns:minmax(0,1.7fr) minmax(0,2.6fr) 5em 6em;gap:12px;align-items:center;border-top:1px solid var(--line);padding:6px 0;color:var(--muted)}
.drow .ax{margin:0}
.drow .nm{color:var(--ink);overflow-wrap:anywhere}
.drow.held .nm,.drow.held .pt{color:var(--muted)}
.drow .pt{text-align:right;font-weight:600;color:var(--ink);font-variant-numeric:tabular-nums}
.drow .verdict{text-align:right}
.differed{margin:0 0 10px;color:var(--muted)}
.differed.head{margin:0 0 4px}
.differed b{color:var(--ink);font-weight:600}
ul.differed{padding-left:18px;max-width:100ch}
ul.differed li{margin:2px 0}
.dial.pick select{font:inherit;font-size:var(--s-1);color:var(--ink);background:var(--ground);border:1px solid var(--line);border-radius:6px;padding:3px 6px;max-width:16em}
.dial.pick{margin-bottom:10px;flex-wrap:wrap}

/* the trend and the rungs */
.trend{width:100%;max-width:720px;height:auto;display:block}
.tpoint{cursor:default}
.ladderwrap{overflow-x:auto;padding-bottom:4px}
.ladder{display:block}
.ladder .rung{cursor:pointer}
.ladder .rung:hover path{stroke-width:3}
.ladder .rung:focus-visible rect{outline:2px solid var(--accent)}

/* the story: the pipeline as a numbered rail beside the drawing, one row a step. The row is
   the cursor: hovering or focusing it lights that step and its edges in the drawing, and the
   arrow keys walk it. */
.story{display:grid;gap:0}
.srow{display:grid;grid-template-columns:1.6em minmax(0,1fr);gap:9px;width:100%;text-align:left;
  background:transparent;border:0;border-top:1px solid var(--line);padding:8px 4px;font:inherit;
  color:var(--muted);cursor:pointer;align-items:baseline}
.srow:first-child{border-top:0}
.srow:hover,.srow[aria-current="true"]{background:var(--sunk)}
.srow[aria-current="true"]{box-shadow:inset 3px 0 0 var(--accent)}
.srow .n{font-family:"JetBrains Mono",monospace;font-size:var(--s-1);color:var(--faint);
  font-variant-numeric:tabular-nums}
.srow .sname{font-family:"JetBrains Mono",monospace;color:var(--ink);overflow-wrap:anywhere}
.srow.planned .sname{color:var(--note)}
.srow .sdoes{display:block;color:var(--muted);font-size:var(--s-1);line-height:1.45;margin-top:1px}
.seams{display:flex;flex-wrap:wrap;gap:4px;margin-top:5px}
.seam{font-family:"JetBrains Mono",monospace;font-size:11.5px;border:1px solid currentColor;
  border-radius:4px;padding:0 6px;white-space:nowrap;color:var(--faint)}
.seam .mono{color:inherit}
.seam.decides,.seam.asks{color:var(--accent)}
.seam.spends,.seam.writes{color:var(--note)}
.seam.permanent{color:var(--attention)}
.storynote{color:var(--faint);font-size:var(--s-1);margin:10px 0 0;line-height:1.5}
#graph .gnode.lit>rect:first-child{stroke:var(--accent);stroke-width:2.4}
#graph .gline.lit{stroke:var(--accent);stroke-width:3;opacity:1}

/* the seams, the shared state and the decisions: the shape page's own regions */
.seamrow{border-top:1px solid var(--line);padding:11px 0}
.seamrow:first-of-type{border-top:0}
.seamrow .sn{color:var(--ink);font-weight:600}
.seamrow .part{display:grid;grid-template-columns:minmax(0,10em) minmax(0,1fr);gap:12px;
  padding:3px 0;font-size:var(--s-1);color:var(--muted);align-items:baseline}
.seamrow .part>span:first-child{color:var(--faint)}
.seamrow .said{font-family:"Source Serif 4",Georgia,serif;color:var(--muted);
  margin:5px 0 0;line-height:1.45}
.seamrow .said b{color:var(--ink);font-weight:500}
.seamrow .bad{color:var(--attention);font-size:var(--s-1);margin:5px 0 0}
.seamrow .thin{color:var(--note);font-size:var(--s-1);margin:5px 0 0}
.staterow{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,2.2fr);gap:12px;
  border-top:1px solid var(--line);padding:9px 0;align-items:baseline;width:100%;text-align:left;
  background:transparent;border-left:0;border-right:0;border-bottom:0;font:inherit;color:var(--muted);
  cursor:pointer}
.staterow:first-of-type{border-top:0}
.staterow:hover .mono{color:var(--accent)}
.staterow .mono{color:var(--ink)}
.staterow .ways{font-size:var(--s-1);line-height:1.6}
.staterow .ways b{color:var(--ink);font-weight:500}
.staterow .ways .none{color:var(--note)}
.drow.dec{grid-template-columns:1.2em minmax(0,1fr) auto;align-items:baseline;gap:12px}
.dec .mark{font-family:"JetBrains Mono",monospace;font-size:var(--s-1)}
.dec.agreed .mark{color:var(--accent)} .dec.changed .mark{color:var(--note)}
.dec.proposed .mark{color:var(--muted)}
.dec .dname{color:var(--ink);font-weight:600}
.dec .chose{display:block;color:var(--ink);font-family:"Source Serif 4",Georgia,serif;
  margin-top:2px;line-height:1.45}
.dec .why{display:block;color:var(--muted);font-size:var(--s-1);margin-top:2px}
.dec .acts{display:flex;gap:7px;flex-wrap:wrap;align-self:center}

/* the build page: progress, the numbers, the last run as a strip */
.chiprow{display:flex;gap:10px;align-items:baseline;margin:0 0 7px}
.chiprow .pn{color:var(--faint);font-size:var(--s-1);flex:0 0 7em;text-align:right}
.chips{display:flex;gap:6px;flex-wrap:wrap;min-width:0}
.stepchip{display:inline-flex;gap:6px;align-items:center;font-family:"JetBrains Mono",monospace;
  font-size:var(--s-1);border:1px solid var(--line);border-radius:6px;padding:2px 9px;
  color:var(--muted);background:var(--ground)}
.stepchip:hover{border-color:var(--accent);color:var(--accent)}
.stepchip i,.stepmark{display:inline-block;width:9px;height:9px;border-radius:2px;flex:0 0 auto}
.stepchip.proven i,.stepmark.proven{background:var(--accent)}
.stepchip.built i,.stepmark.built{background:var(--line-strong)}
.stepchip.moved i,.stepmark.moved{background:var(--note)}
.stepchip.unbuilt i,.stepmark.unbuilt{background:transparent;border:1.5px dashed var(--note)}
.stepchip.unbuilt{color:var(--note);border-style:dashed}
.numhead,.numrow{display:grid;grid-template-columns:minmax(0,1.5fr) 3.5em minmax(0,1.2fr) minmax(0,1.1fr);
  gap:10px;align-items:baseline}
.numhead{font-size:11px;color:var(--faint);text-transform:uppercase;letter-spacing:.07em;
  padding:0 0 4px}
.numrow{border-top:1px solid var(--line);padding:8px 0;font-size:var(--s-1);color:var(--muted)}
.numrow .nm{color:var(--ink);overflow-wrap:anywhere;text-align:left;font:inherit;font-family:"JetBrains Mono",monospace;font-size:var(--s-1)}
button.nm:hover{color:var(--accent)}
.numrow .v{color:var(--ink);font-variant-numeric:tabular-nums}
.numrow .conf{text-align:right;overflow-wrap:anywhere}
.numrow .conf .badge{white-space:normal;display:inline-block}
/* The note is one line in a row of controls and a cell in this table, where holding one line
   put it 56px past the region's edge at 1200. */
.numrow .conf .sentnote{white-space:normal;display:inline-block}
.numrow.open .nm{color:var(--note)}
.numrow.gone .nm,.numrow.gone .v{color:var(--muted);text-decoration:line-through}
.mregion .numrow:has(.rule){grid-template-columns:minmax(0,0.9fr) minmax(0,2.2fr) minmax(0,1.1fr)}
.numrow .rule{color:var(--ink);line-height:1.45}
.seamrow .acts{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.given{color:var(--muted);margin:0 0 10px}
.given b{color:var(--ink);font-weight:500;font-family:"Source Serif 4",Georgia,serif}
.runstrip{display:flex;gap:6px;align-items:center;flex-wrap:wrap;padding:2px 0 4px}
.runstep{display:grid;gap:1px;text-align:left;border:1px solid var(--line-strong);
  border-radius:7px;padding:5px 11px;background:var(--ground);color:var(--ink);
  font-family:"JetBrains Mono",monospace;font-size:var(--s-1)}
.runstep:hover{border-color:var(--accent)}
.runstep.open{border-color:var(--accent);background:var(--accent-soft)}
.runstep.skipped{opacity:.5;border-style:dashed}
.runstep .rf{color:var(--faint);font-size:11px}
.runarrow{color:var(--edge);font-family:"JetBrains Mono",monospace}

/* the ship page: the checks as a board, and the product drawn */
.checkrow{display:grid;grid-template-columns:1.4em minmax(0,1fr) auto;gap:12px;
  border-top:1px solid var(--line);padding:9px 0;align-items:baseline}
.checkrow:first-of-type{border-top:0}
.checkrow .mark{font-family:"JetBrains Mono",monospace;font-weight:600}
.checkrow.passed .mark{color:var(--accent)}
.checkrow.failed .mark{color:var(--attention)}
.checkrow.not_applicable .mark,.checkrow.blocked .mark{color:var(--faint)}
.checkrow .cn{color:var(--ink);min-width:0}
.checkrow.not_applicable .cn{color:var(--muted)}
.checkrow .ce{color:var(--faint);font-size:var(--s-1);margin-left:9px}
.checkrow .cw{display:block;color:var(--attention);font-size:var(--s-1);line-height:1.45;
  margin-top:3px}
.checkrow .cw.quiet{color:var(--muted)}
.pdraw{width:100%;height:auto;display:block;margin:4px 0 14px;max-width:820px}
.pdraw .psurface rect{fill:var(--surface);stroke:var(--line-strong);stroke-width:1.2}
.pdraw .psurface.ppipe rect{fill:var(--accent-soft);stroke:var(--accent)}
.pdraw .psurface.standin rect{stroke:var(--attention);stroke-dasharray:5 4}
.pdraw .psurface.pjob rect{stroke:var(--edge);stroke-dasharray:2 3}
.pdraw .pname{fill:var(--ink);font-family:"JetBrains Mono",monospace;font-size:13px}
.pdraw .psub{fill:var(--muted);font-family:"JetBrains Mono",monospace;font-size:11.5px}
.pdraw .parrow path{stroke:var(--edge);stroke-width:1.4;fill:none}
.pdraw .parrow text{fill:var(--muted);font-family:"JetBrains Mono",monospace;font-size:11px}
.pdraw marker path{fill:var(--edge);stroke:none}
.plist{margin-top:4px}
.prow{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,2.4fr);gap:12px;
  border-top:1px solid var(--line);padding:8px 0;color:var(--muted);font-size:var(--s-1);
  align-items:baseline}
.prow .mono{color:var(--ink)}
.prow .bad{color:var(--attention)}
.mregion>p.bad{color:var(--attention);max-width:100ch}

/* the operate page */
.nowtiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(9.5em,1fr));gap:10px}
.nowtiles .tile.urgent{border-color:var(--attention)}
.nowtiles .tile.urgent .val{color:var(--attention)}
.stuckrow{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,2.4fr) auto;gap:12px;
  border-top:1px solid var(--line);padding:9px 0;align-items:baseline;color:var(--muted);
  font-size:var(--s-1)}
.stuckrow:first-of-type{border-top:0}
.stuckrow .mono{color:var(--ink);overflow-wrap:anywhere;min-width:0}
.stuckrow .bad{color:var(--attention)}
.stagestrip button.operate{color:var(--accent)}

/* the brainstorm page: the idea as boxes, the questions in four states, the staging */
.idraw{width:100%;height:auto;display:block;margin:2px 0 12px;max-width:900px}
.idraw .ibox rect{fill:var(--surface);stroke:var(--line-strong);stroke-width:1.2;cursor:pointer}
.idraw .ibox.ghost rect{fill:none;stroke:var(--note);stroke-dasharray:5 4}
.idraw .ibox.deferred rect{stroke:var(--note)}
.idraw .ilbl{fill:var(--faint);font-family:"JetBrains Mono",monospace;font-size:11.5px;
  text-transform:uppercase;letter-spacing:.07em}
.idraw .isaid{fill:var(--ink);font-size:12px}
.idraw .ibox.ghost .isaid{fill:var(--note)}
.idraw .ibox:hover rect{stroke:var(--accent)}
.idraw .iarrow{stroke:var(--edge);stroke-width:1.4;fill:none}
.idraw marker path{fill:var(--edge);stroke:none}
.ifacts{color:var(--muted);margin:0 0 4px}
.ifacts b{color:var(--ink);font-weight:500}
.qstate{display:grid;grid-template-columns:1.3em minmax(0,1.1fr) minmax(0,2fr) auto;gap:12px;
  border-top:1px solid var(--line);padding:9px 0;align-items:baseline;font-size:var(--s-1)}
.qstate:first-of-type{border-top:0}
.qstate .mark{font-family:"JetBrains Mono",monospace}
.qstate.answered .mark{color:var(--accent)} .qstate.open .mark{color:var(--note)}
.qstate.deferred .mark{color:var(--note)} .qstate.ahead .mark{color:var(--faint)}
.qstate .qn{color:var(--ink)}
.qstate.ahead .qn{color:var(--muted)}
.qstate .qa{color:var(--ink);overflow-wrap:anywhere;white-space:pre-wrap}
.qstate .qgo{text-align:right}
/* An answer is the builder's own words, and it arrives with the blank lines and indents
   they wrote. The row holds all of it and shows the first nine lines of it. */
.longtext{display:block;position:relative}
.longtext.clipped{max-height:10.5em;overflow:hidden}
.longtext.clipped::after{content:"";position:absolute;left:0;right:0;bottom:0;height:3.2em;
  background:linear-gradient(to bottom,transparent,var(--surface));pointer-events:none}
.quote .longtext.clipped::after{background:linear-gradient(to bottom,transparent,var(--sunk))}
.showall{display:block;margin-top:5px;color:var(--accent);font-size:var(--s-1);
  font-family:"JetBrains Mono",monospace;text-align:left}
.showall:hover{text-decoration:underline}
.stagerow{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.stagebox{display:grid;gap:2px;border:1px solid var(--line-strong);border-radius:8px;
  padding:7px 13px;background:var(--ground);text-align:left}
.stagebox .sn{color:var(--ink);font-size:var(--s-1);font-weight:600}
.stagebox .sc{color:var(--muted);font-family:"JetBrains Mono",monospace;font-size:var(--s-1)}
.stagebox.here{border-color:var(--accent);background:var(--accent-soft)}
.stagebox.here .sn{color:var(--accent)}
.stagebox.ahead{opacity:.65;border-style:dashed}
.stagebox:hover{border-color:var(--accent)}
.sarrow{color:var(--edge);font-family:"JetBrains Mono",monospace}

/* the research page */
.factor{font-family:"Source Serif 4",Georgia,serif;font-size:var(--s2);line-height:1.35;
  color:var(--ink);margin:0;max-width:44ch}
.partcols{display:grid;grid-template-columns:repeat(auto-fit,minmax(15em,1fr));gap:18px;
  margin:4px 0 10px}
.partcol{min-width:0}
.partcol .ph{color:var(--ink);font-weight:600;border-bottom:1px solid var(--line-strong);
  padding-bottom:5px;margin-bottom:6px}
.cand{display:grid;grid-template-columns:1.2em minmax(0,1fr);gap:8px;padding:7px 0;
  align-items:baseline;font-size:var(--s-1);color:var(--muted)}
.cand b{color:var(--ink);font-weight:500}
.cand .cm{font-family:"JetBrains Mono",monospace}
.cand.adopted .cm{color:var(--accent)} .cand.rejected .cm{color:var(--muted)}
.cand.not_investigated .cm{color:var(--faint)}
.cand.rejected b,.cand.not_investigated b{color:var(--muted);font-weight:400}
.cand .rests{color:var(--accent)}
.cand .unreached{color:var(--note)}

/* the hover layer: one tooltip, every mark */
#tip{position:fixed;z-index:50;pointer-events:none;max-width:34em;padding:7px 10px;border-radius:7px;
  background:var(--ink);color:var(--surface);font-size:var(--s-1);line-height:1.4;box-shadow:var(--shadow);display:none}
#tip.on{display:block}

/* needs your eyes */
#eyes{margin-top:26px}
.eyes-head{display:flex;gap:10px;align-items:baseline;margin-bottom:9px}
.eyes-head h2{font-size:var(--s-1);letter-spacing:.12em;text-transform:uppercase;color:var(--faint);
  font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-weight:500}
.eyes-head span{color:var(--muted);font-size:var(--s-1)}
.calm{color:var(--muted);border:1px solid var(--line);background:var(--surface);
  border-radius:8px;padding:12px 18px}
.finding{display:flex;gap:16px;align-items:baseline;background:var(--surface);
  border:1px solid var(--line);border-left:4px solid var(--line-strong);
  border-radius:8px;padding:12px 18px;margin-bottom:8px}
.finding.attention{border-left-color:var(--attention)}
.finding.note{border-left-color:var(--note)}
.finding b{font-weight:600}
.finding .body{color:var(--muted)}
.finding>span{min-width:0;overflow-wrap:anywhere;max-width:104ch}
.finding .go{margin-left:auto;white-space:nowrap;align-self:center}
.finding .acts{display:flex;gap:7px;flex-wrap:wrap}
.more-findings{color:var(--faint);font-size:var(--s-1);padding:2px 4px}

/* the map */
/* The map sits in the text column with everything else: a drawing wider than the board
   scrolls sideways, and one that needs the whole column moves the rail under it
   (`drawGraph` measures it and sets `stacked`). The rail is a fixed share rather than a
   fixed width, so a wide window gives the card room as well as the drawing. */
#map.boardless>.board{display:none}
/* Without a drawing the map is only the writing panel, and it sits in the text column with
   everything else rather than in the wider measure a drawing is given. */
#map.boardless{grid-template-columns:minmax(0,1fr)}
#map{margin-top:30px;display:grid;grid-template-columns:minmax(0,1fr) clamp(320px,24%,440px);
  gap:18px;align-items:start}
#map.stacked{grid-template-columns:minmax(0,1fr)}
#map.stacked .rail{position:static;max-height:none;overflow:visible;
  grid-template-columns:repeat(auto-fit,minmax(380px,1fr));align-items:start}
#map.boardless .rail{position:static;max-height:none;overflow:visible;max-width:820px}
@media (max-width:1279px){
  #map{grid-template-columns:minmax(0,1fr)}
  .rail{position:static;max-height:none;overflow:visible}
}
#lead:empty{display:none}
.board{min-width:0}
.board h2,.rail h2{font-size:var(--s-1);letter-spacing:.12em;text-transform:uppercase;
  color:var(--faint);font-family:"JetBrains Mono",monospace;font-weight:500;margin:0 0 10px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:10px;
  padding:16px 18px;box-shadow:var(--shadow)}
#system{margin-bottom:18px}
#sysmap{display:block;width:100%;height:auto}
#sysdials{display:flex;gap:18px;flex-wrap:wrap;align-items:center;padding-bottom:12px}
#sysdials:empty{display:none}
.pipetabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.pipetab{border:1px solid var(--line-strong);border-radius:8px;padding:7px 14px;
  background:var(--surface);display:flex;gap:9px;align-items:baseline}
.pipetab:hover{background:var(--sunk)}
.pipetab[aria-current="true"]{border-color:var(--accent);background:var(--accent-soft)}
.pipetab .st{font-size:var(--s-1);color:var(--muted);font-family:"JetBrains Mono",monospace}
#pipemeta{color:var(--muted);font-size:var(--s-1);font-family:"JetBrains Mono",monospace;
  padding-bottom:10px;margin-bottom:10px;border-bottom:1px solid var(--line);
  display:flex;gap:14px;flex-wrap:wrap;align-items:baseline}
#pipemeta:empty{display:none}
#pipemeta b{color:var(--ink);font-weight:500}
.graphwrap{overflow-x:auto;position:relative}
.scrollnote{color:var(--muted);font-size:var(--s0);margin-top:10px;max-width:88ch;
  line-height:1.5}
.scrollnote:empty{display:none}
#dials{display:flex;gap:18px;flex-wrap:wrap;align-items:center;padding-bottom:12px}
#dials:empty{display:none}
/* Wrapping, because the run picker holds up to 24 chips: on a project with 50 runs the row
   ran to 2,612px at a 1920 window and took the whole page sideways with it. */
.dial{display:flex;gap:7px;align-items:center;flex-wrap:wrap}
.dial>span{font-family:"JetBrains Mono",monospace;font-size:var(--s-1);color:var(--faint);
  text-transform:uppercase;letter-spacing:.07em}
.dial button{font-family:"JetBrains Mono",monospace;font-size:var(--s-1);color:var(--muted);
  border:1px solid var(--line);border-radius:99px;padding:2px 11px;white-space:nowrap}
.dial button:hover{background:var(--sunk)}
.dial button[aria-pressed="true"]{color:var(--accent);border-color:var(--accent);
  background:var(--accent-soft)}
#graphkey{display:flex;gap:16px;flex-wrap:wrap;align-items:center;margin-top:12px;
  padding-top:12px;border-top:1px solid var(--line)}
#graphkey:empty{display:none}
.keyitem{display:flex;gap:7px;align-items:center;color:var(--faint);
  font-family:"JetBrains Mono",monospace;font-size:var(--s-1)}
.keyitem svg{display:block;flex:0 0 auto}
.sig{font-family:"JetBrains Mono",monospace;font-size:var(--s-1);color:var(--ink);
  background:var(--sunk);border:1px solid var(--line);border-radius:6px;padding:7px 10px;
  overflow-x:auto;white-space:pre;margin:6px 0 0;max-width:100%;min-width:0}
.src{font-family:ui-monospace,monospace;font-size:12px;line-height:1.6;color:var(--ink);
  background:var(--sunk);border:1px solid var(--line);border-radius:6px;padding:10px 12px;
  overflow-x:auto;white-space:pre;margin:8px 0 0;max-height:340px;overflow-y:auto;
  max-width:100%;min-width:0}
.where{font-family:"JetBrains Mono",monospace;font-size:var(--s-1);color:var(--faint);
  margin:6px 0 0}
.access{border-left:2px solid var(--line-strong);padding:2px 0 2px 11px;margin:9px 0}
.access .dirn{font-family:ui-monospace,monospace;font-size:11.5px;letter-spacing:.05em;
  text-transform:uppercase;color:var(--faint)}
.access .side{display:flex;gap:10px;margin-top:3px;font-size:var(--s-1)}
.access .side b{font-weight:500;color:var(--faint);flex:0 0 56px;
  font-family:"JetBrains Mono",monospace}
.access .side span{font-family:"JetBrains Mono",monospace;color:var(--ink);
  overflow-wrap:anywhere}
.walk{display:grid;gap:2px}
.walkstep{border-left:2px solid var(--line-strong);padding:8px 0 8px 14px}
.walkstep.quiet{border-left-color:var(--line);opacity:.6}
.walkhead{display:flex;gap:10px;align-items:baseline;flex-wrap:wrap}
.walkhead .wn{font-family:ui-monospace,monospace;font-size:11.5px;color:var(--faint);
  min-width:18px}
.walkhead .mono{color:var(--ink);font-weight:500}
.walkhead .wf{color:var(--muted);font-size:var(--s-1);
  font-family:"JetBrains Mono",monospace}
.walkstep .access{border-left-color:var(--line);margin:6px 0 0 18px}
#graph{display:block;margin:0 auto}
.gnode,.gedge{cursor:pointer}
@keyframes settle{from{stroke-width:6}to{stroke-width:1.2}}
.pulse>rect:first-child{animation:settle .9s ease-out 2}

/* right rail */
/* Sticky, and never taller than the window: a step card is often taller than the screen, and
   a sticky column that overflows the viewport keeps its foot out of reach until the board
   scrolls away. The rail scrolls inside itself instead. */
.rail{position:sticky;top:16px;min-width:0;display:grid;grid-template-columns:minmax(0,1fr);
  gap:14px;align-content:start;max-height:calc(100vh - 32px);overflow-y:auto;
  overscroll-behavior:contain;padding-right:4px;scrollbar-gutter:stable}
.rail>*{min-width:0}
/* The rail's scrollbar is drawn by the page, the same width on every platform: a system
   scrollbar is an overlay on one desktop and a 15px bar on another, and the second clipped
   the card's right edge. */
.rail::-webkit-scrollbar{width:9px}
.rail::-webkit-scrollbar-track{background:transparent}
.rail::-webkit-scrollbar-thumb{background:var(--line-strong);border-radius:5px}
.rail::-webkit-scrollbar-thumb:hover{background:var(--faint)}
.rail .panel{padding:18px 20px}
.subinner .kicker{text-transform:none;letter-spacing:.01em;color:var(--muted);
  font-family:inherit;font-size:var(--s-1);font-weight:500}
.kicker{font-family:"JetBrains Mono",monospace;font-size:var(--s-1);
  color:var(--muted);text-transform:uppercase;letter-spacing:.08em}
#stepcard,#stepcard *{min-width:0}
#stepcard h3{font-size:var(--s1);font-weight:600;margin:3px 0 2px;overflow-wrap:anywhere}
#stepcard .will{font-family:"Source Serif 4",Georgia,serif;font-style:italic;
  color:var(--ink);margin:10px 0 0;padding:10px 14px;border-left:2px solid var(--note);
  background:var(--sunk)}
.badges{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.badge{font-family:ui-monospace,monospace;font-size:11.5px;letter-spacing:.05em;
  border:1px solid currentColor;border-radius:4px;padding:1px 7px;white-space:nowrap}
.badge.warn{color:var(--note)} .badge.bad{color:var(--attention)} .badge.acc{color:var(--accent)}
.badge.mut{color:var(--muted)}
.facts{margin-top:14px;border-top:1px solid var(--line)}
.facts h4,.thread h4{font-size:var(--s-1);letter-spacing:.1em;text-transform:uppercase;
  color:var(--faint);font-family:"JetBrains Mono",monospace;font-weight:500;margin:14px 0 6px}
.kv{display:flex;justify-content:space-between;gap:14px;padding:4px 0;font-size:var(--s0)}
.kv span:first-child{color:var(--muted);white-space:nowrap}
.kv span:last-child{text-align:right;overflow-wrap:anywhere;font-variant-numeric:tabular-nums}
.fieldlist{font-family:"JetBrains Mono",monospace;font-size:var(--s-1);color:var(--muted);
  background:var(--sunk);border-radius:6px;padding:8px 12px;margin-top:4px;line-height:1.7}
.fieldlist b{color:var(--ink);font-weight:500}
.quote{margin:8px 0 0;padding:10px 14px;border-left:2px solid var(--accent);background:var(--sunk);
  font-family:"Source Serif 4",Georgia,serif;line-height:1.5;border-radius:0 6px 6px 0}
.quote cite{display:block;font-family:"JetBrains Mono",monospace;font-style:normal;
  font-size:var(--s-1);color:var(--muted);margin-top:6px}
.nobody{color:var(--muted);font-size:var(--s0);border:1px dashed var(--line-strong);
  border-radius:6px;padding:9px 13px;margin-top:8px}

/* a real value from a run */
.example{margin-top:10px;border:1px solid var(--line);border-radius:8px;padding:8px 12px;
  background:var(--sunk)}
.example .exlabel{font-family:"JetBrains Mono",monospace;font-size:var(--s-1);
  color:var(--faint);letter-spacing:.06em}
.example .exlabel b{text-transform:uppercase;font-weight:500}
.exside{margin-top:7px}
.exside>.exhead{font-family:"JetBrains Mono",monospace;font-size:var(--s-1);color:var(--accent)}
.exrow{font-family:"JetBrains Mono",monospace;font-size:var(--s-1);line-height:1.6;
  overflow-wrap:anywhere;color:var(--ink);margin-top:2px}
.exrow b{color:var(--accent);font-weight:500}
.exrow i{color:var(--faint);font-style:normal}
.exnote{color:var(--faint);font-size:var(--s-1);margin-top:6px}
.exvolume{margin-top:6px;font-size:var(--s0);color:var(--ink);font-variant-numeric:tabular-nums}
.exvolume b{color:var(--muted);font-weight:500;font-size:var(--s-1);
  font-family:"JetBrains Mono",monospace}
.shape{margin-top:8px;border-top:1px solid var(--line);padding-top:6px}
.shrow{display:flex;justify-content:space-between;gap:12px;font-family:"JetBrains Mono",monospace;
  font-size:var(--s-1);line-height:1.7}
.shrow .shname{color:var(--ink);overflow-wrap:anywhere}
.shrow .shamount{color:var(--muted);white-space:nowrap;font-variant-numeric:tabular-nums}
.pathrow .much{font-family:"JetBrains Mono",monospace;font-size:var(--s-1);color:var(--accent);
  font-variant-numeric:tabular-nums}

/* a figure with its interval */
.fig{font-variant-numeric:tabular-nums}
.fig .span{color:var(--faint);font-size:var(--s-1);font-family:"JetBrains Mono",monospace}

/* the data path */
.path{display:grid;gap:0}
.pathrow{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.1fr) minmax(0,1.1fr);
  gap:14px;padding:10px 0;border-top:1px solid var(--line);align-items:baseline}
.pathrow:first-of-type{border-top:0}
.pathrow .st{font-family:"JetBrains Mono",monospace;color:var(--ink);overflow-wrap:anywhere}
.pathrow .st small{display:block;color:var(--faint);font-size:var(--s-1)}
.pathrow .into,.pathrow .outof{font-size:var(--s-1)}
.pathrow .outof b{color:var(--ink);font-weight:500}
.pathenter,.pathleave{padding:9px 0;color:var(--muted);font-size:var(--s0)}
.pathenter b,.pathleave b{color:var(--ink);font-weight:600}

/* threads */
.thread{margin-top:10px;border:1px solid var(--line);border-radius:8px;padding:10px 14px}
.thread.open{border-left:3px solid var(--attention)}
.thread.withdrawn{opacity:.55}
.turn{margin-top:8px}
.turn:first-of-type{margin-top:4px}
.turn .who{font-family:"JetBrains Mono",monospace;font-size:var(--s-1);color:var(--faint)}
.turn.builder .said{font-family:"Source Serif 4",Georgia,serif}
.turn .said{display:block;white-space:pre-wrap}
.thread .meta{color:var(--faint);font-size:var(--s-1);font-family:"JetBrains Mono",monospace;
  margin-top:6px;display:flex;gap:10px;flex-wrap:wrap}
.thread .meta button{color:var(--accent)}
.thread .meta button:hover{text-decoration:underline}
.replybox{display:flex;gap:8px;margin-top:8px}
.replybox input{flex:1}

/* composer */
#composer .tofield{display:flex;gap:8px;align-items:baseline;flex-wrap:wrap;
  font-family:"JetBrains Mono",monospace;font-size:var(--s-1);color:var(--muted);
  margin-bottom:8px}
#composer .tofield b{color:var(--accent);font-weight:500;overflow-wrap:anywhere}
#composer textarea{margin-top:6px}
#composer .send{margin-top:8px;display:flex;gap:12px;align-items:center}
.button{background:var(--accent);color:var(--surface);border-radius:6px;padding:7px 16px;
  font-weight:600}
.button:hover{filter:brightness(1.08)}
.button.quiet{background:var(--sunk);color:var(--ink);border:1px solid var(--line-strong);
  font-weight:500}
.btn{display:inline-block;border:1px solid var(--line-strong);border-radius:6px;
  background:var(--surface);color:var(--accent);padding:3px 11px;font-size:var(--s-1);
  white-space:nowrap}
.btn:hover{background:var(--accent-soft);border-color:var(--accent)}
/* The button on something that waits on the builder is the one thing to press. */
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--surface);
  font-weight:600}
.btn.primary:hover{filter:brightness(1.08);background:var(--accent)}
#eyes details.sub{border-top:0;margin-top:14px}
#eyes details.sub>summary{color:var(--muted);font-size:var(--s-1)}
#eyes details.sub>summary .held{margin-left:0}
#eyes details.sub .subinner{padding-left:0}
.runbanner{display:flex;gap:12px;align-items:baseline;flex-wrap:wrap;margin-bottom:12px;
  border:1px solid var(--accent);background:var(--accent-soft);border-radius:8px;
  padding:9px 14px;color:var(--ink)}
.runbanner .pulse-dot{color:var(--accent);animation:blink 1.6s ease-in-out infinite}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.25}}
.runbanner .figs{color:var(--muted);font-family:"JetBrains Mono",monospace;font-size:var(--s-1)}
@keyframes marching{to{stroke-dashoffset:-14}}
.run-live>rect:first-child{animation:marching 1s linear infinite}
/* Three levels, and each has to look like what it is.

   A band names a part of the step and is not a control. A row inside one opens and shuts, so
   it carries a marker and says on its right what it holds while shut. A row inside a row is
   indented under it. Before this everything was one level in the same small uppercase, a
   `summary` was set `display:flex` (which drops its own `::marker`), and a heading and a
   control were the same object to look at. */
.band{display:flex;gap:12px;align-items:baseline;margin:18px 0 2px;padding-top:12px;
  border-top:1px solid var(--line);
  font-family:ui-monospace,monospace;font-size:11.5px;letter-spacing:.12em;
  text-transform:uppercase;color:var(--faint);font-weight:500}
.band:first-child{margin-top:6px;padding-top:0;border-top:0}
.band .of{letter-spacing:0;text-transform:none;color:var(--muted);font-weight:400}

details.sub{background:none;border:0;border-top:1px solid var(--line);border-radius:0}
details.sub>summary{display:flex;gap:10px;align-items:baseline;padding:9px 0;
  font-family:inherit;font-size:var(--s0);letter-spacing:0;text-transform:none;
  color:var(--ink);font-weight:500;list-style:none}
details.sub>summary::-webkit-details-marker{display:none}
details.sub>summary::before{content:"";flex:0 0 auto;width:0;height:0;align-self:center;
  border-left:5px solid var(--muted);border-top:4.5px solid transparent;
  border-bottom:4.5px solid transparent;transition:transform .12s}
details.sub[open]>summary::before{transform:rotate(90deg)}
details.sub>summary:hover{color:var(--accent)}
details.sub>summary:hover::before{border-left-color:var(--accent)}
details.sub>summary .held{margin-left:auto;text-align:right;color:var(--muted);
  font-weight:400;font-size:var(--s-1);overflow-wrap:anywhere}
details.sub .subinner{padding:0 0 10px 15px}
/* a row inside a row */
details.sub details.sub{border-top:1px dotted var(--line);margin-left:2px}
details.sub details.sub>summary{padding:7px 0;font-size:var(--s-1);color:var(--muted)}
details.sub details.sub>summary::before{border-left-color:var(--faint);
  border-top-width:4px;border-bottom-width:4px}
details.sub details.sub .subinner{padding-left:14px}

details.sub>summary .count{margin-left:auto;text-align:right;color:var(--muted);
  font-weight:400;font-size:var(--s-1);font-family:ui-monospace,monospace}
#composerwrap{margin-top:14px;border-top:1px solid var(--line);padding-top:12px}
#composer .sent{color:var(--accent);font-size:var(--s-1)}
#composer .hint{color:var(--faint);font-size:var(--s-1);margin-top:8px}

/* details sections */
#sections{margin-top:30px;display:grid;gap:10px}
details{background:var(--surface);border:1px solid var(--line);border-radius:10px}
/* `display:flex` drops a summary's own `::marker`, so every level draws its own. Without one
   a shut section is a heading with no sign that anything is behind it. */
summary{cursor:pointer;padding:13px 18px;font-weight:600;display:flex;gap:12px;
  align-items:baseline;list-style:none}
summary::-webkit-details-marker{display:none}
summary::before{content:"";flex:0 0 auto;width:0;height:0;align-self:center;
  border-left:6px solid var(--muted);border-top:5px solid transparent;
  border-bottom:5px solid transparent;transition:transform .12s}
details[open]>summary::before{transform:rotate(90deg)}
summary .count{font-family:"JetBrains Mono",monospace;font-size:var(--s-1);color:var(--muted);
  font-weight:400}
.inner{padding:2px 20px 16px;color:var(--muted)}
.inner p{max-width:100ch}
.inner ul{margin:6px 0;padding-left:20px;max-width:100ch}
.inner li{margin:4px 0}
.qrow{border-top:1px solid var(--line);padding:12px 0}
.qrow:first-of-type{border-top:0}
.qrow .qname{font-family:"JetBrains Mono",monospace;color:var(--ink)}
.qrow .asks{margin:2px 0 0}
.qrow .actions{margin-top:6px;display:flex;gap:14px}
.qrow .actions button{color:var(--accent);font-size:var(--s-1);
  font-family:"JetBrains Mono",monospace}
.qrow .actions button:hover{text-decoration:underline}
.qrow .answer{font-family:"Source Serif 4",Georgia,serif;color:var(--ink);margin-top:4px;
  white-space:pre-wrap}
.qrow .pending{color:var(--note);font-size:var(--s-1);
