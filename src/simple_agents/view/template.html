  return `<div class="mregion">${measureTitle(`${name} over time`, `${fmt(points.length)} evaluations`)}
    ${svg}
    <p class="asks">Oldest on the left. The whisker through a point is its plausible range. The ringed point is the one this project reports. A line joins evaluations of the same figure over the same behaviour.${
      breaks ? ` A dashed break marks where the behaviour changed.${points.length > 4 ? " The file names alternate heights so they can be read." : ""}` : ""} Rungs are left out, because a rung's figure is over its own examples.${
      armsOut ? ` The sweep's ${armsOut === 1 ? "arm is" : `${fmt(armsOut)} arms are`} left out too: ${armsOut === 1 ? "it is an experiment" : "they are experiments"}, not the project's history.` : ""}</p>
    <details class="sub" data-sub="m-history"><summary>Every evaluation on record<span class="count">${fmt(points.length)}</span></summary><div class="subinner">${table}</div></details>
  </div>`;
}

/* ---- 2. where does it lose it: the rungs, drawn as brackets under the steps ---- */
function rungsRegion(m) {
  const ladders = m.ladders || [];
  if (!ladders.length) { rungShown = null; return ""; }
  const inner = ladders.map(l => {
    const rungs = l.rungs;
    const whole = rungs.find(r => r.whole);
    const ids = Object.keys(m.nodes || {}).filter(id => !id.includes("."));
    const order = ids.length ? ids : [...new Set(rungs.flatMap(r => r.nodes || []))];
    const BW = 104, GAP = 14, BH = 30, top = 10, rowH = 30;
    const W = order.length * (BW + GAP) + 8, H = top + BH + 18 + rungs.length * rowH + 6;
    const xOf = i => 4 + i * (BW + GAP);
    const ink = css("--ink"), muted = css("--muted"), line = css("--line-strong"), accent = css("--accent");
    let svg = order.map((id, i) => `<g><rect x="${xOf(i)}" y="${top}" width="${BW}" height="${BH}" rx="6" fill="${css("--sunk")}" stroke="${line}"/>
      <text x="${xOf(i) + BW / 2}" y="${top + BH / 2 + 4}" text-anchor="middle" font-size="12" fill="${ink}">${esc(id.length > 14 ? id.slice(0, 13) + "…" : id)}</text>${
      i < order.length - 1 ? `<line x1="${xOf(i) + BW}" y1="${top + BH / 2}" x2="${xOf(i + 1)}" y2="${top + BH / 2}" stroke="${line}" stroke-width="1.5"/>` : ""}</g>`).join("");
    const sentences = [];
    rungs.forEach((r, ri) => {
      const set = r.whole ? order : (r.nodes || []).filter(n => order.includes(n));
      const first = Math.min(...set.map(n => order.indexOf(n))), last = Math.max(...set.map(n => order.indexOf(n)));
      if (!isFinite(first)) return;
      const key = `${l.of}:${r.file}`;
      const pressed = rungShown && rungShown.key === key;
      const yb = top + BH + 16 + ri * rowH;
      const h = r.headline;
      const words = `${r.whole ? "The whole pipeline" : `From ${r.start || set[0]} on`}${r.dropped.length ? `, without ${r.dropped.join(", ")}` : ""}: ${h ? `${h.name} ${rate(h.point, h.unit)}${rangeText(h) ? ` (${rangeText(h)})` : ""} over ${fmt(r.n || 0)} × ${fmt(r.k || 0)}` : "no figure"}`;
      svg += `<g class="rung" data-rung="${esc(key)}" aria-pressed="${!!pressed}" role="button" tabindex="0" data-tip="${esc(words)}">
        <rect x="${xOf(first) - 2}" y="${yb - 12}" width="${xOf(last) + BW + 4 - xOf(first)}" height="${rowH - 4}" rx="5" fill="${pressed ? css("--accent-soft") : "transparent"}"/>
        <path d="M${xOf(first)},${yb - 4} v6 H${xOf(last) + BW} v-6" fill="none" stroke="${r.whole ? line : accent}" stroke-width="2" stroke-linecap="round"/>
        <text x="${xOf(first) + 4}" y="${yb + 12}" font-size="11" fill="${muted}">${esc(r.whole ? "The whole pipeline" : `From ${r.start || set[0]} on`)}${r.reported ? " · reported" : ""}</text>
        <text x="${xOf(last) + BW - 4}" y="${yb + 12}" text-anchor="end" font-size="12" font-weight="600" fill="${ink}">${h ? esc(rate(h.point, h.unit)) : "no figure"}</text>
        <title>${esc(words)}</title></g>`;
      if (ri > 0) {
        const a = rungs[ri - 1], b = r;
        if (a.headline && b.headline && a.headline.name === b.headline.name) {
          const entered = (a.whole ? order : (a.nodes || [])).filter(id => !(b.nodes || []).includes(id));
          /* `a` is the rung that holds the entered step, so the figure rises when it
             enters if `a` reads higher than `b`. */
          const delta = a.headline.point - b.headline.point;
          sentences.push(`${esc(a.headline.name)} reads ${esc(rate(a.headline.point, a.headline.unit))} ${a.whole ? "over the whole pipeline" : `from ${esc(a.start || "")} on`} and ${
            esc(rate(b.headline.point, b.headline.unit))} from ${esc(b.start || "")} on: it ${delta > 0.001 ? "rises" : delta < -0.001 ? "falls" : "holds"} when ${
            entered.length ? entered.map(esc).join(", ") + (entered.length === 1 ? " enters" : " enter") : "the node set changes"}. Each rung is over its own examples, so this is an observation and not a paired difference.`);
        }
      }
    });
    const table = rungs.map(r => `<div class="kv"><span>${esc(r.file)}${r.reported ? ` <span class="badge acc">Reported</span>` : ""}<br><span class="asks">${
      r.whole ? "The whole pipeline" : `${fmt((r.nodes || []).length)} steps from ${esc(r.start || "")}${r.dropped.length ? `, without ${r.dropped.map(esc).join(", ")}` : ""}`}</span></span>
      <span>${r.headline ? `${esc(figureWords(r.headline))} <span class="asks">${esc(r.headline.name)} over ${fmt(r.n || 0)} × ${fmt(r.k || 0)}</span>` : "no figure"}</span></div>`).join("");
    return `<div class="ladderwrap"><svg class="ladder" width="${W}" height="${H}" viewBox="0 0 ${W} ${H}" role="img" aria-label="The rungs of the pipeline">${svg}</svg></div>
      ${sentences.map(t => `<p class="asks">${t}</p>`).join("")}
      <p class="asks">Select a rung to shade the drawing below to the steps it ran${whole ? "" : ""}.</p>
      <details class="sub" data-sub="m-rungs"><summary>The rungs as a table<span class="count">${fmt(rungs.length)}</span></summary><div class="subinner">${table}</div></details>`;
  }).join("");
  return `<div class="mregion">${measureTitle("Where it loses it, step by step", `${fmt(ladders.reduce((a, l) => a + l.rungs.length, 0))} rungs`)}${inner}</div>`;
}

/* ---- the page ---- */
function measureSection(sections) {
  const m = DATA.measured;
  if (!m) { premeasureSection(sections); return; }
  if (!m.path) {
    sections.push(`<div class="mpage" data-section="measure"><div class="mregion">${measureTitle("What the evaluation measured", "Results unreadable")}
      <p>${(m.problems || []).map(esc).join(" ")}</p></div></div>`);
    return;
  }
  sections.push(`<div class="mpage" data-section="measure">
    ${headlineStrip(m)}
    <div class="mrow outcomes">${outcomesRegion(m)}${gridRegion(m)}</div>
    ${figuresRegion(m)}
    <div class="mrow change">${comparisonRegion(m)}${trendRegion(m)}</div>
    ${rungsRegion(m)}
  </div>`);
}

/* What will be measured, for a project that has not measured anything yet: the same strip,
   in words, and no chart furniture. */
function premeasureSection(sections) {
  const ex = DATA.examples;
  const judged = ((DATA.brief || {}).entries || []).find(e => e.name === "judged_steps" && e.status === "answered");
  const tiles = [];
  if (ex && ex.total) {
    tiles.push(`<div class="tile"><span class="lbl">Examples on file</span><span class="val">${fmt(ex.total)}</span>
      <span class="sub">${Object.keys(ex.splits || {}).length ? Object.entries(ex.splits).map(([k, v]) => `${esc(k.replace(/_/g, "-"))} ${fmt(v)}`).join(" · ") : "No splits declared"}</span></div>`);
  } else {
    tiles.push(`<div class="tile"><span class="lbl">Examples on file</span><span class="val muted">None yet</span><span class="sub">An evaluation needs a labelled example set</span></div>`);
  }
  if (judged) tiles.push(`<div class="tile"><span class="lbl">Judged on their own</span><span class="val small">${esc(judged.answer)}</span></div>`);
  sections.push(`<div class="mpage" data-section="measure"><div class="mregion strip">
    <div class="stripgrid"><div class="heroside"><div class="hero"><span class="big muted">Nothing measured yet</span></div>
      <p>The first number comes from an evaluation over the example set.
      <span class="mono">suite.run(envelope=..., model=..., split="held_out", k=...)</span> writes a
      results file under <span class="mono">evals/results/</span>, and this page draws it.</p></div>
    <div class="tiles">${tiles.join("")}</div></div></div></div>`);
}

function setBrowserFilter(kind, value, examples) {
  browserFilter = (browserFilter && browserFilter.kind === kind && browserFilter.value === value)
    ? null : {kind, value, examples: new Set(examples || [])};
  renderSections();
}

/* ---------- the brainstorm page: the idea, the questions, the staging ---------- */
/* Five boxes, and a box with no answer behind it is drawn as a ghost. On day zero all five
   are ghosts, which is the honest picture of a project that is a conversation so far. */
const IDEA_BOXES = [
  {key: "end_user", words: "Who uses it"},
  {key: "used_through", words: "Entry point"},
  {key: "what_it_does", words: "The agent", wide: true},
  {key: "presentation", words: "What they get"},
];
const IDEA_INPUT = {key: "one_real_input", words: "What it receives"};

function ideaRegion() {
  const brief = DATA.brief || {entries: []};
  const asked = DATA.stages_asked || {};
  const stageOf = name => Object.keys(asked).find(st =>
    (asked[st].rows || []).some(r => r.name === name)) || null;
  const answer = name => {
    const held = (brief.entries || []).find(e => e.name === name);
    if (held && held.status === "answered" && held.answer) return {said: held.answer};
    if (held && held.status === "deferred") {
      return {deferred: held.deferred_to || "a later stage"};
    }
    /* A box whose question a later stage asks is not unanswered yet: it reads the stage
       that will ask it, and is not offered for answering before then. */
    const st = stageOf(name);
    if (st && asked[st] && !asked[st].reached) return {ahead: st};
    return null;
  };
  const BW = 168, BH = 74, GX = 40, GY = 34;
  const W = IDEA_BOXES.length * (BW + GX) - GX + 8, H = BH * 2 + GY + 12;
  const box = (held, x, y, w) => {
    const found = answer(held.key);
    const state = found && found.said ? "said" : found && found.ahead ? "ahead"
      : found ? "deferred" : "ghost";
    const words = found && found.said ? found.said
      : found && found.ahead ? `Asked at ${found.ahead}`
      : found ? `Put off to ${found.deferred}` : "Unanswered";
    /* The text is set in the drawing's monospace, so the line length is the box's width in
       characters of it rather than in characters of the page's own type. */
    const cols = Math.floor((w - 24) / 7.3);
    return `<g class="ibox ${state}"${state === "ahead" ? "" : ` data-idea="${esc(held.key)}" role="button" tabindex="0"`}
      data-tip="${esc(titleOfEntry(held.key))}: ${esc(words)}">
      <rect x="${x}" y="${y}" width="${w}" height="${BH}" rx="9"/>
      <text x="${x + 12}" y="${y + 22}" class="ilbl">${esc(held.words)}</text>
      ${(held => held.length > 3
          ? [...held.slice(0, 2), clip(held.slice(2).join(" "), cols)] : held
        )(wrap(words, cols)).map((line, i) =>
        `<text x="${x + 12}" y="${y + 40 + i * 14}" class="isaid">${esc(line)}</text>`).join("")}
    </g>`;
  };
  let svg = "";
  IDEA_BOXES.forEach((held, i) => {
    const x = 4 + i * (BW + GX);
    svg += box(held, x, 4, BW);
    if (i < IDEA_BOXES.length - 1) {
      svg += `<path class="iarrow" d="M${x + BW + 4} ${4 + BH / 2} H${x + BW + GX - 6}"
        marker-end="url(#ia)"/>`;
    }
  });
  const agentX = 4 + 2 * (BW + GX);
  svg += box(IDEA_INPUT, agentX, 4 + BH + GY, BW);
  svg += `<path class="iarrow" d="M${agentX + BW / 2} ${4 + BH + GY - 6} V${4 + BH + 6}"
    marker-end="url(#ia)"/>`;
  const facts = [
    DATA.tier ? `Tier <span class="mono">${esc(DATA.tier)}</span>` : "",
    (answer("finished_version") || {}).said
      ? `<b>Finished</b> ${esc((answer("finished_version") || {}).said)}` : "",
    (answer("smallest_worthwhile") || {}).said
      ? `<b>First version</b> ${esc((answer("smallest_worthwhile") || {}).said)}` : "",
  ].filter(Boolean);
  const ghosts = [...IDEA_BOXES, IDEA_INPUT].filter(one => !answer(one.key)).length;
  const ahead = [...IDEA_BOXES, IDEA_INPUT].filter(one => (answer(one.key) || {}).ahead).length;
  return `<div class="mregion" data-section="idea">${measureTitle("The idea",
    ghosts ? `${fmt(ghosts)} of ${fmt(IDEA_BOXES.length + 1)} unanswered`
    : ahead ? `${fmt(ahead)} asked at a later stage` : "Every box answered")}
    <svg class="idraw" viewBox="0 0 ${W} ${H}" role="img" aria-label="The idea, in five boxes">
      <defs><marker id="ia" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="9"
        markerHeight="9" markerUnits="userSpaceOnUse" orient="auto">
        <path d="M0 0 L8 4 L0 8 z"/></marker></defs>${svg}</svg>
    ${facts.length ? `<p class="ifacts">${facts.join(" · ")}</p>` : ""}
    <p class="asks">A dashed box is an unanswered question. Select it to answer.${
      ahead ? " A faint box belongs to a later stage." : ""}</p></div>`;
}

/* A brief key named for the builder, which is what every page shows in place of it. */
function titleOfEntry(name) {
  const brief = DATA.brief || {};
  const held = (brief.entries || []).find(e => e.name === name)
    || (DATA.questions_due || []).find(q => q.name === name);
  if (held && held.title) return held.title;
  const asked = DATA.stages_asked || {};
  for (const stage of Object.keys(asked)) {
    const row = (asked[stage].rows || []).find(r => r.name === name);
    if (row) return row.title;
  }
  return name.replace(/_/g, " ").replace(/^./, first => first.toUpperCase());
}

const QUESTION_STATE = {answered: "Answered", deferred: "Put off", open: "Open",
                        ahead: "Not asked yet"};
const QUESTION_MARK = {answered: "●", deferred: "◐", open: "○", ahead: "·"};

/* An answer runs to whatever length the builder wrote, and the row carries the whole of it.
   `renderSections` measures each one once it is in the document and adds the control only
   where the text is taller than the row shows, so a short answer gains nothing. */
/* A summary cell holds as much as it has room for, cut at a word, and hands the whole of it
   to the `title` beside it. Where the reader can have all of it in place, `longText` is the
   one to reach for. */
function short(text, room) {
  const said = String(text || "").replace(/\s+/g, " ").trim();
  if (said.length <= room) return {said, whole: ""};
  const cut = said.slice(0, room);
  const at = cut.lastIndexOf(" ");
  return {said: (at > room * 0.6 ? cut.slice(0, at) : cut) + "\u2026", whole: said};
}

const shownWhole = new Set();
function longText(id, text) {
  return `<span class="longtext clipped" data-whole="${esc(id)}">${esc(text || "")}</span>`;
}

/* This stage's questions in the four states. The brief has three, and a question a later
   stage asks reads the same as an unanswered one; only one of them is anybody's
   business today. */
function questionsRegion(stage) {
  const held = (DATA.stages_asked || {})[stage];
  if (!held || !held.rows.length) return "";
  /* An answer typed on the page is with the coding agent until it lands in the brief; the
     row says so rather than asking again. */
  const pending = {};
  (DATA.comments || []).forEach(c => {
    if (c.kind === "answer" && c.status === "open" && c.at.startsWith("question:")) {
      pending[c.at.slice(9)] = c;
    }
  });
  const row = r => pending[r.name] && r.state !== "answered"
    ? `<div class="qstate sent">
    <span class="mark" data-tip="Answer sent">◐</span>
    <span class="qn">${esc(r.title)}</span>
    <span class="qa">“${esc(pending[r.name].said)}”<br><span class="pending">Answer sent to
      your coding agent</span></span>
    <span class="qgo"></span></div>`
    : `<div class="qstate ${esc(r.state)}">
    <span class="mark" data-tip="${esc(QUESTION_STATE[r.state] || r.state)}">${
      QUESTION_MARK[r.state] || "·"}</span>
    <span class="qn">${esc(r.title)}${
      r.required ? "" : ` <span class="asks">· optional</span>`}${
      r.again ? ` <span class="asks">· asked again each stage</span>` : ""}</span>
    <span class="qa">${r.state === "answered" ? longText(`question:${r.name}`, r.answer)
      : r.state === "deferred" ? `<span class="asks">Put off to ${esc(r.deferred_to || "later")}</span>`
      : r.state === "open" ? `<span class="asks">${esc(r.asks)}</span>`
      : `<span class="asks">Not asked yet.</span>`}</span>
    <span class="qgo">${r.state === "answered"
      ? `<button class="btn" data-amend="question:${esc(r.name)}">Amend</button>`
      : r.state === "open" || r.state === "deferred"
      ? `<button class="btn primary" data-answer="${esc(r.name)}">Answer</button>` : ""}</span>
  </div>`;
  return `<div class="mregion" data-section="questions">${measureTitle("Questions",
    `${fmt(held.answered)} of ${fmt(held.asks)} answered`)}
    <p>What this stage asks, and what has been answered. An answer given here goes to the
    coding agent, which records it in the brief.</p>
    ${held.rows.slice().sort((a, b) =>
      ["open", "deferred", "answered", "ahead"].indexOf(a.state)
      - ["open", "deferred", "answered", "ahead"].indexOf(b.state)).map(row).join("")}</div>`;
}

/* The six stages with what each has asked and answered, so a deferral is distinguishable
   from an omission and what is still ahead is visible. */
function stagesRegion() {
  const held = DATA.stages_asked;
  if (!held) return "";
  const names = Object.keys(held);
  return `<div class="mregion" data-section="staging">${measureTitle("Stages",
    `${fmt(names.length)}`)}
    <div class="stagerow">${names.map((name, i) => {
      const one = held[name];
      const state = one.here ? "here" : one.reached ? "done" : "ahead";
      return `<button class="stagebox ${state}" data-page="${esc(name)}"
        data-tip="${esc(cap(name))}: ${fmt(one.answered)} of ${fmt(one.asks)} answered${
        one.deferred ? `, ${fmt(one.deferred)} put off` : ""}">
        <span class="sn">${esc(cap(name))}</span>
        <span class="sc">${fmt(one.answered)}/${fmt(one.asks)}</span></button>${
        i < names.length - 1 ? `<span class="sarrow">→</span>` : ""}`;
    }).join("")}</div>
    <p class="asks">Answered of asked, per stage. A deferred question is counted when it is
    eventually answered, so it shows up as deferred rather than missing.</p></div>`;
}

function ideaFileRegion() {
  const held = DATA.idea;
  if (!held) {
    return `<div class="mregion" data-section="ideafile">${measureTitle("The idea file",
      "Not written yet")}
      <p>The next session reads <span class="mono">idea.md</span> first. It is generated from
      the answers above.</p></div>`;
  }
  return `<div class="mregion" data-section="ideafile">${measureTitle("The idea file",
    held.confirmed_at ? `Confirmed at ${held.confirmed_at}` : "Not confirmed")}
    ${held.sections.map(s => `<div class="seamrow"><div class="sn">${esc(s.title)}</div>
      <p class="said">${s.body ? longText(`idea:${s.title}`, s.body)
        : `<span class="bad">Nothing here.</span>`}</p>
      </div>`).join("")}
    ${held.stale ? `<p class="bad">It was confirmed at ${esc(held.confirmed_at)}. The project
      has moved past that stage, so it describes an earlier idea until it is confirmed
      again.</p>` : ""}
    <span class="acts">${sentOr(SAY.confirmIdea(), `<button class="btn primary" data-confirmidea>This is right</button>`)}
      <button class="btn" data-comment="project">Something is wrong</button></span></div>`;
}

/* ---------- the research page ---------- */
const CANDIDATE_MARK = {adopted: "■", rejected: "□", not_investigated: "◌", other: "·"};
const CANDIDATE_WORDS = {adopted: "Adopted", rejected: "Rejected",
                         not_investigated: "Not investigated", other: ""};

function decidingFactorRegion() {
  const held = DATA.research;
  const said = held && held.turns_on;
  if (!said) return "";
  return `<div class="mregion" data-section="turnson">${measureTitle("The deciding factor")}
    <p class="factor">${longText("research:turnson", said)}</p></div>`;
}

function candidatesRegion() {
  const held = DATA.research;

    return `<div class="mregion" data-section="candidates">${measureTitle("Parts and candidates",
      "Not written yet")}

    <p>One column per part, with the candidates weighed for it underneath. A filled mark was

    something this library ships says where no run has recorded reaching it.</p>
    <div class="partcols">${held.parts.map(column).join("")}</div>
    ${held.parts_said ? `<p class="asks">${longText("research:parts", held.parts_said)}</p>`
      : ""}</div>`;
}

function restingRegion() {
  const held = DATA.research;
  if (!held || !held.resting_on.length) return "";
  return `<div class="mregion" data-section="resting">${measureTitle("Decisions resting on it",
    `${fmt(held.resting_on.length)}`)}
    ${held.resting_on.map(d => `<div class="seamrow">
      <div class="sn">${esc(titleOfEntry(d.name))}${
        d.status && d.status !== "agreed"
          ? ` <span class="badge warn">${esc(cap(d.status))}</span>` : ""}</div>
      <p class="said">${longText(`decision:${d.name}`, d.chose)}</p>
      <p class="asks">${d.cites.length
        ? `Weighed as ${d.cites.map(c => `<span class="mono">${esc(c)}</span>`).join(" against ")}.`
        : "The survey names no candidate this decision's words reach."}</p>
      ${d.because
        ? `<p class="asks">${longText(`decision:${d.name}:why`, `Because ${d.because}`)}</p>` : ""}
      <span class="acts"><button class="btn" data-amend="decision:${esc(d.name)}">Amend</button>
      </span></div>`).join("")}
    <p class="asks">A dependency decision is what the project rests on. Decisions are matched
    to candidates by their wording. A candidate described in other words is not linked
    here.</p></div>`;
}

function saidRegion() {
  const held = DATA.research;
  if (!held || !held.said) return "";
  return `<div class="mregion" data-section="researchsaid">${measureTitle(
    "What the builder said about it")}
    <div class="quote">${longText("research:said", held.said.replace(/^>\s?/gm, ""))}</div>
    <span class="acts"><button class="btn" data-comment="project">Amend</button></span></div>`;
}

/* ---------- the operate page: now, the history, what is stuck ---------- */
/* The page a builder opens on a Tuesday morning. Everything on it is over the project's own
   live runs: a development run is not real traffic, and counting it here would say the agent
   did work that was never asked for. */
let windowDays = 30;

function nowRegion(op) {
  const now = op.now;
  const tile = (words, value, sub, urgent) => `<div class="tile${urgent ? " urgent" : ""}">
    <span class="lbl">${esc(words)}</span><span class="val">${esc(String(value))}</span>
    <span class="sub">${esc(sub)}</span></div>`;
  return `<div class="mregion" data-section="now">${measureTitle("Now",
    `${fmt(op.runs)} live ${op.runs === 1 ? "run" : "runs"} on record`)}
    <div class="nowtiles">
      ${tile("Running", fmt(now.running), now.running ? "Started and not finished" : "Nothing in flight")}
      ${tile("Waiting", fmt(now.waiting),
             now.waiting ? [now.on_person ? `${fmt(now.on_person)} on a person` : "",
                            now.on_clock ? `${fmt(now.on_clock)} on a clock` : ""]
               .filter(Boolean).join(", ") : "Nothing is waiting", now.on_person > 0)}
      ${tile("Abandoned", fmt(now.abandoned),
             now.abandoned ? "Started, and it cannot still be going" : "None",
             now.abandoned > 0)}
      ${tile("Shelved questions", fmt(now.shelved),
             now.shelved ? "Asked and unanswered" : "None outstanding", now.shelved > 0)}
      ${tile("Spent today", now.currency ? rate(now.spend, now.currency) : "—",
             esc(now.day))}
    </div>
    ${now.unknown ? `<p class="asks">${fmt(now.unknown)} run${now.unknown === 1 ? "" : "s"}
      recorded no outcome and declared no bound, so whether ${
      now.unknown === 1 ? "it is" : "they are"} still going is unknown.</p>` : ""}</div>`;
}

/* One bar a day of how the day's runs ended, with what they cost on its own axis under it.
   Never a second y-axis on one chart: a count and a price share no scale. */
function historyRegion(op) {
  const every = op.history || [];
  if (!every.length) return "";
  const cut = new Date(Date.now() - windowDays * 86400000).toISOString().slice(0, 10);
  const days = every.filter(d => d.day >= cut);
  const shown = days.length ? days : every.slice(-1);
  const W = 640, H = 150, left = 34, right = 12, top = 12, mid = 96, bottom = 30;
  const most = Math.max(1, ...shown.map(d => d.runs));
  const dearest = Math.max(...shown.map(d => d.spend), 0);
  /* A bar keeps a readable width rather than filling whatever the window has room for, so a
     project with three days of runs does not draw three columns the width of a hand. */
  const band = Math.min(44, (W - left - right) / Math.max(shown.length, 1));
  const wide = Math.min(26, Math.max(4, band - 6));
  const tone = {finished: css("--o-right"), failed: css("--o-wrong"), stopped: css("--o-none")};
  const spendY = d => H - bottom - 6
    - (dearest > 0 ? (d.spend / dearest) * (H - bottom - mid - 26) : 0);
  let bars = "", line = "", marks = "";
  shown.forEach((d, i) => {
    const x = left + i * band + (band - wide) / 2;
    let y = mid;
    ["stopped", "failed", "finished"].forEach(kind => {
      const height = (d[kind] / most) * (mid - top);
      if (height <= 0) return;
      y -= height;
      bars += `<rect x="${x}" y="${y}" width="${wide}" height="${height}" rx="2"
        fill="${tone[kind]}"><title>${esc(d.day)}: ${fmt(d[kind])} ${kind}</title></rect>`;
    });
    if (d.throttled) {
      marks += `<text x="${x + wide / 2}" y="${y - 4}" text-anchor="middle" font-size="11"
        fill="${css("--note")}"><title>${esc(d.day)}: ${fmt(d.throttled)} run${
        d.throttled === 1 ? "" : "s"} had a call end throttled</title>▲</text>`;
    }
    line += `<circle cx="${x + wide / 2}" cy="${spendY(d)}" r="3" fill="${css("--accent")}">
      <title>${esc(d.day)}: ${esc(rate(d.spend, op.now.currency || ""))}</title></circle>`;
    if (i > 0) {
      const px = left + (i - 1) * band + band / 2;
      line += `<line x1="${px}" y1="${spendY(shown[i - 1])}" x2="${x + wide / 2}"
        y2="${spendY(d)}" stroke="${css("--accent")}" stroke-width="1.6"/>`;
    }
  });
  /* One day is a point rather than a line, so the figure is written beside it. */
  if (shown.length === 1 && op.now.currency) {
    line += `<text x="${left + band / 2 + 12}" y="${spendY(shown[0]) + 4}" font-size="11"
      fill="${css("--muted")}">${esc(rate(shown[0].spend, op.now.currency))}</text>`;
  }
  const changed = (op.changes || []).filter(c => c.day >= cut);
  changed.forEach(c => {
    const i = shown.findIndex(d => d.day === c.day);
    if (i < 0) return;
    const x = left + i * band + band / 2;
    marks += `<line x1="${x}" y1="${top - 6}" x2="${x}" y2="${H - bottom}" stroke="${
      css("--line-strong")}" stroke-width="1" stroke-dasharray="3 3"><title>${
      esc(c.day)}: ${esc(c.words)}</title></line>`;
  });
  const first = shown[0].day, last = shown[shown.length - 1].day;
  const ends = `<text x="${left}" y="${H - 8}" font-size="11" fill="${css("--muted")}">${
    esc(first)}</text>${first === last ? "" : `<text x="${
    Math.min(W - right, left + shown.length * band)}" y="${H - 8}" text-anchor="end"
    font-size="11" fill="${css("--muted")}">${esc(last)}</text>`}`;
  const total = shown.reduce((a, d) => a + d.spend, 0);
  return `<div class="mregion" data-section="daily">
    <div class="mhead"><h3>History</h3><span class="count">${fmt(shown.length)} ${
      shown.length === 1 ? "day" : "days"}</span>
      <div class="dial"><span>Last</span>${[7, 30, 90].map(n =>
        `<button data-window="${n}" aria-pressed="${n === windowDays}">${n} days</button>`
      ).join("")}</div></div>
    <svg class="trend" viewBox="0 0 ${W} ${H}" role="img"
      aria-label="Live runs a day, and what they cost">
      <line x1="${left}" y1="${mid}" x2="${W - right}" y2="${mid}" stroke="${css("--line")}"/>
      <text x="${left - 6}" y="${top + 8}" text-anchor="end" font-size="11" fill="${
        css("--muted")}">${fmt(most)}</text>
      <text x="${left - 6}" y="${mid + 4}" text-anchor="end" font-size="11" fill="${
        css("--muted")}">0</text>
      ${bars}${line}${marks}${ends}</svg>
    <div class="legend">
      <span class="keyrow"><i style="background:${css("--o-right")}"></i>Finished</span>
      <span class="keyrow"><i style="background:${css("--o-wrong")}"></i>Failed</span>
      <span class="keyrow"><i style="background:${css("--o-none")}"></i>Stopped</span>
      <span class="keyrow"><i style="background:${css("--accent")};border-radius:50%"></i>What it cost</span>
    </div>
    <p class="asks">One bar per day, split by how the day's runs ended. The dot under it is
    what that day cost, on its own scale. ${esc(rate(total, op.now.currency || ""))} over ${
      fmt(shown.length)} ${shown.length === 1 ? "day" : "days"}.${
      shown.some(d => d.throttled) ? " A triangle marks a day a call ended throttled." : ""}${
      changed.length ? " A dashed line marks where the behaviour changed." : ""}</p></div>`;
}

/* A run that stopped and is waiting, and a run that cannot still be going. Resuming one is
   the project's own worker; what the page owes an operator is knowing it is there. */
function stuckRegion(op) {
  const rows = op.stuck || [];
  const open = run => {
    const walks = (DATA.walks || {}).walks || {};
    if (walks[run]) return `<button class="btn" data-walk="${esc(run)}">Open</button>`;
    return live() ? `<button class="btn" data-fetchwalk="${esc(run)}">Open</button>` : "";
  };
  const body = rows.length ? rows.map(r => `<div class="stuckrow">
    <span class="mono">${esc(r.run.length > 26 ? r.run.slice(0, 25) + "…" : r.run)}</span>
    <span>${r.abandoned
      ? `<b class="bad">Abandoned</b> · nothing has been written for ${esc(r.waited)}`
      : `Waiting on ${esc(r.on)} for ${esc(r.waited)}<br><span class="asks">${
          esc(r.waiting_for)}${r.until ? ` · not before ${esc(r.until.slice(0, 16))}` : ""}${
          r.options.length ? ` · offered ${r.options.map(esc).join(", ")}` : ""}</span>`}</span>
    <span>${open(r.run)}</span></div>`).join("")
    : `<p class="asks">Nothing is stuck.</p>`;
  return `<div class="mregion">${measureTitle("Stuck", rows.length ? `${fmt(rows.length)}` : "None")}
    <p>Runs that stopped to ask, runs waiting on a clock, and runs that cannot still be
    going. The project's own worker continues them. This lists which are there.</p>
    ${body}</div>`;
}

function shelvedRegion(op) {
  const rows = op.shelf || [];
  const body = rows.length ? rows.map(q => `<div class="stuckrow">
    <span class="mono">${esc(q.about || q.node_id)}</span>
    <span>“${esc(q.prompt)}”<br><span class="asks">Asked ${esc(q.waited)} ago by ${
      esc(q.run.length > 22 ? q.run.slice(0, 21) + "…" : q.run)}${
      q.reason ? ` · ${esc(q.reason)}` : ""}${
      q.options.length ? ` · offered ${q.options.map(esc).join(", ")}` : ""}</span></span>
    <span></span></div>`).join("")
    : `<p class="asks">No question is outstanding.</p>`;
  return `<div class="mregion">${measureTitle("Shelved",
    rows.length ? `${fmt(rows.length)}` : "None")}
    <p>Questions a run asked that had no one to answer them at the time. The run finished
    without waiting. The project's own worker answers them later.</p>
    ${body}</div>`;
}

function conversationsRegion(op) {
  const rows = op.conversations || [];
  if (!rows.length) {
    return `<div class="mregion">${measureTitle("Conversations", "None")}
      <p>No live run belongs to a conversation. A run joins one with
      <span class="mono">conversation_id=</span>.</p></div>`;
  }
  return `<div class="mregion">${measureTitle("Conversations", `${fmt(rows.length)}`)}
    ${rows.map(c => `<div class="stuckrow">
      <span class="mono">${esc(c.id)}</span>
      <span>${fmt(c.runs)} run${c.runs === 1 ? "" : "s"} · last ${esc(ago(c.last))}${
        c.read ? "" : `<br><span class="asks">No step has read or written it. Its runs are
        turns of a conversation that carries nothing forward.</span>`}</span>
      <span></span></div>`).join("")}</div>`;
}

/* Everything the project has run, by what each run was for. A development run, a
   customer-facing one and an evaluation's rollout answer different questions, so one figure
   over all three describes none of them. */
function ranRegion(op) {
  const rows = op.roles || [];
  if (!rows.length) return "";
  const words = {live: "Real traffic", development: "Made while building",
                 evaluation: "Rollouts of an evaluation"};
  return `<div class="mregion" data-section="ran">${measureTitle("What has run",
    `${fmt(rows.reduce((a, r) => a + r.runs, 0))} runs`)}
    ${rows.map(r => `<div class="stuckrow">
      <span class="mono">${esc(r.role)}</span>
      <span>${fmt(r.runs)} run${r.runs === 1 ? "" : "s"} · ${esc(words[r.role] || "")}${
        r.currency ? ` · ${esc(rate(r.spend, r.currency))}` : ""}<br><span class="asks">Last ${
        esc(String(r.last).slice(0, 10))}</span></span><span></span></div>`).join("")}
    <p class="asks">The figures above this are the live runs alone.</p></div>`;
}

/* The declared jobs against what the live runs say started them. A trigger the runs carry
   that the product does not declare is listed and marked. */
function jobsRegion(op) {
  const rows = op.jobs || [];
  const declared = rows.filter(j => j.declared).length, undeclared = rows.length - declared;
  const ran = j => !j.runs ? "No run yet"
    : `${fmt(j.runs)} run${j.runs === 1 ? "" : "s"} · last ${esc(j.ago)} ago${
        j.ended ? ` · ${esc(j.ended)}` : ""}`;
  const held = j => [j.waiting ? `${fmt(j.waiting)} waiting on a person` : "",
                     j.on_clock ? `${fmt(j.on_clock)} waiting on a clock` : "",
                     j.shelved ? `${fmt(j.shelved)} shelved question${j.shelved === 1 ? "" : "s"}` : ""]
    .filter(Boolean).join(", ");
  return `<div class="mregion" data-section="jobs">${measureTitle("Jobs",
    `${fmt(declared)} declared${undeclared ? ` · ${fmt(undeclared)} undeclared` : ""}`)}
    ${rows.map(j => `<div class="stuckrow">
      <span class="mono">${esc(j.name)}</span>
      <span>${j.declared ? ran(j) : `<span class="bad">Not declared</span> · ${ran(j)}`}<br>
        <span class="asks">${j.declared
          ? `Runs <span class="mono">${esc(j.pipeline)}</span>${j.after
              ? ` · after ${esc(j.after)}` : ""}${held(j) ? ` · ${held(j)}` : ""}`
          : `${j.pipeline ? `Runs of <span class="mono">${esc(j.pipeline)}</span> say this
            started them` : "A run says this started it"}, and the product declares no such
            job. Add it to <span class="mono">Product(jobs=[...])</span> or fix the name the
            scheduler passes.`}</span></span><span></span></div>`).join("")}
    <p class="asks">Read from what each live run recorded as its trigger. A run with none was
    asked for by somebody.</p></div>`;
}

function changesRegion(op) {
  const rows = (op.changes || []).slice().reverse();
  return `<div class="mregion">${measureTitle("Changes",
    rows.length ? `${fmt(rows.length)}` : "None")}
    ${rows.length
      ? rows.map(c => `<div class="stuckrow"><span class="mono">${esc(c.day)}</span>
          <span>${esc(c.words)}<br><span class="asks">From that day, runs of this pipeline
          behaved differently: a step, a prompt, a tool, the model or a limit changed.</span></span>
          <span></span></div>`).join("")
      : `<p class="asks">Every live run of each pipeline used the same behaviour. Nothing has
         changed since the first one on record.</p>`}
    <p class="asks">A confirmation records a stage, not a date, so it cannot be placed on this
    timeline. The marks here are behaviour changes only.</p></div>`;
}

/* ---------- the ship page: the checks, the product, retention ---------- */
/* The gate as a board. `simple-agents check` prints the same verdicts in a terminal and the
   builder is not the one reading a terminal. */
const CHECK_WORDS = {passed: "Passes", failed: "Fails", not_applicable: "Not at this tier",
                     blocked: "Could not run"};

/* The first sentence of what a check said, ending in one full stop however the message was
   punctuated. The rest is in the terminal and in the taxonomy. */
function oneSentence(said) {
  const first = String(said || "").split(". ")[0].trim();
  return first.endsWith(".") ? first : first + ".";
}

function checksRegion() {
  const held = DATA.checks;
  if (!held) {
    return `<div class="mregion" data-section="checks">${measureTitle("Checks", "Not run")}
      <p>The checks need a brief that declares a tier. The tier decides which gates apply.</p>
      </div>`;
  }
  const counts = held.counts || {};
  /* What passing is out of is what ran: a check that could not run is waiting on something
     that does not exist yet, and counting it as a failure reads a project at its first stage
     as a project in trouble. Both of the others are named beside the count. */
  const pass = counts.passed || 0, of = pass + (counts.failed || 0);
  const row = r => `<div class="checkrow ${esc(r.outcome)}">
    <span class="mark" data-tip="${esc(CHECK_WORDS[r.outcome] || r.outcome)}">${
      r.outcome === "passed" ? "✓" : r.outcome === "failed" ? "✗" : "–"}</span>
    <span class="cn">${esc(r.name)}<span class="ce mono">${esc(r.entry)}</span>${
      r.outcome === "failed" && r.says.length
        ? `<span class="cw">${esc(oneSentence(r.says[0]))}</span>` : ""}${
      r.outcome !== "passed" && r.outcome !== "failed" && r.detail
        ? `<span class="cw quiet">${esc(oneSentence(r.detail))}</span>` : ""}</span>
    <span class="cgo">${r.outcome === "failed" && r.where
      ? `<button class="btn" data-checkgo="${esc(r.entry)}">Show me</button>` : ""}</span>
  </div>`;
  const shown = held.rows.filter(r => r.outcome !== "passed");
  const passed = held.rows.filter(r => r.outcome === "passed");
  const beside = [
    counts.blocked ? `${fmt(counts.blocked)} could not run` : "",
    counts.not_applicable ? `${fmt(counts.not_applicable)} not at this stage` : "",
  ].filter(Boolean).join(" · ");
  return `<div class="mregion" data-section="checks">${measureTitle("Checks",
    `${fmt(pass)} of ${fmt(of)} pass${beside ? ` · ${beside}` : ""}`)}
    <p>Every check <span class="mono">simple-agents check</span> runs over this project, at
    tier <span class="mono">${esc(held.tier || "")}</span>. ${held.ok
      ? "Nothing is failing." : "A failing check says what to do about it."}${
      counts.blocked ? " A check that could not run says what it is waiting on." : ""}${
      counts.failed && ALL_STAGES.indexOf(DATA.stage) >= 0 && ALL_STAGES.indexOf(DATA.stage) < ALL_STAGES.indexOf("measure")
        ? ` The project is at ${esc(DATA.stage)}. Checks that read an evaluation or a run fail until the project has made one. This board matters at ship.` : ""}</p>
    ${shown.map(row).join("")}
    ${passed.length ? `<details class="sub" data-sub="checks-pass"><summary>What passes<span
      class="count">${fmt(passed.length)}</span></summary><div class="subinner">${
      passed.map(row).join("")}</div></details>` : ""}</div>`;
}

/* The product, drawn: what the end user meets, what it reaches, and what it shows them. One
   level out from the system map, in the same vocabulary. */
function productRegion() {
  const held = DATA.product;
  if (!held) {
    return `<div class="mregion" data-section="product">${measureTitle("The product",
      "Not declared")}
      <p>A run's record does not include the surface the end user meets, so the page cannot
      find it. Declare it beside the pipelines and the page draws it:</p>
      <div class="sig">@product_factory
def product() -> Product:
    return Product(surfaces=[
        Surface("the support inbox", "starts_a_run", pipeline="triage",
                does="a script takes each new ticket and starts a run"),
    ])</div></div>`;
  }
  const reaching = held.surfaces.filter(s => s.reaches_the_agent);
  const showing = held.surfaces.filter(s => !s.reaches_the_agent);
  const jobs = held.jobs || [];
  /* The left column is what starts or answers a run: the surfaces, then after a gap the jobs,
     which start one without the end user. Each keeps its own row. */
  const GAP = jobs.length && reaching.length ? 0.6 : 0;
  const left = [...reaching.map((s, k) => ({...s, row: k, job: false})),
                ...jobs.map((j, k) => ({...j, row: reaching.length + GAP + k, job: true}))];
  const pipes = [...new Set(left.map(s => s.pipeline || s.pipeline_named).filter(Boolean))];
  /* Three columns: what the end user acts on, what it reaches, and what they read. Every
     surface keeps its own row, so a label never sits on another surface's arrow, and a
     pipeline sits level with the middle of whatever points at it. */
  const SW = 200, PW = 160, SH = 58, GY = 16;
  /* The box carries the kind, so the arrow carries what the box cannot: the channel an
     answer travels through. An arrow with nothing to add is drawn bare. */
  const label = s => s.through || "";
  const widest = [...left.map(label), ...showing.map(s => s.reads ? "writes " + s.reads : "")]
    .reduce((a, w) => Math.max(a, String(w).length), 0);
  const GX = Math.max(110, widest * 6.4 + 30);
  const row = i => 5 + i * (SH + GY);
  const leftRows = left.length ? left[left.length - 1].row + 1 : 0;
  const rows = Math.max(leftRows, showing.length, pipes.length, 1);
  const W = SW + GX + PW + GX + SW + 8, H = Math.ceil(rows * (SH + GY) + 8);
  const at = {};
  pipes.forEach((name, i) => {
    const mine = left.filter(s => (s.pipeline || s.pipeline_named) === name).map(s => s.row);
    at[name] = mine.length ? mine.reduce((a, b) => a + b, 0) / mine.length : i;
  });
  const box = (x, y, w, words, sub, cls) => `<g class="psurface ${esc(cls || "")}">
    <rect x="${x}" y="${y}" width="${w}" height="${SH}" rx="9"/>
    <text x="${x + 12}" y="${y + 24}" class="pname">${esc(clip(words, Math.floor(w / 7.8)))}</text>
    ${sub ? `<text x="${x + 12}" y="${y + 42}" class="psub">${
      esc(clip(sub, Math.floor(w / 6.4)))}</text>` : ""}</g>`;
  /* A link curves where the two ends are on different rows, the way the system map's do. */
  const link = (x1, y1, x2, y2, words) => `<g class="parrow">
    <path d="M${x1} ${y1} C ${x1 + (x2 - x1) / 2} ${y1}, ${x1 + (x2 - x1) / 2} ${y2}, ${x2} ${y2}"
      marker-end="url(#pr)"/>
    <text x="${(x1 + x2) / 2}" y="${Math.min(y1, y2) - 13}" text-anchor="middle">${
      esc(words)}</text></g>`;
  let svg = "";
  left.forEach(s => {
    const y = row(s.row);
    svg += box(4, y, SW, s.name, s.kind_words, s.job ? "pjob" : s.stand_in ? "standin" : "");
    const name = s.pipeline || s.pipeline_named;
    const py = row(at[name] === undefined ? s.row : at[name]) + SH / 2;
    svg += link(SW + 8, y + SH / 2, SW + GX, py, label(s));
  });
  pipes.forEach(name => {
    svg += box(SW + GX + 4, row(at[name]), PW, name, "pipeline", "ppipe");
  });
  showing.forEach((s, i) => {
    const y = row(i);
    svg += box(SW + GX + PW + GX + 4, y, SW, s.name, s.kind_words, "");
    if (s.reads && pipes.length) {
      const from = row(at[pipes[0]]) + SH / 2;
      svg += link(SW + GX + PW + 8, from, SW + GX + PW + GX, y + SH / 2, "writes " + s.reads);
    }
  });
  const bad = held.surfaces.filter(s => s.missing.length);
  const standIn = held.surfaces.filter(s => s.stand_in);
  const params = held.parameters || [];
  const counts = `${fmt(held.surfaces.length)} ${held.surfaces.length === 1 ? "surface" : "surfaces"}`
    + (jobs.length ? ` · ${fmt(jobs.length)} ${jobs.length === 1 ? "job" : "jobs"}` : "");
  return `<div class="mregion" data-section="product">${measureTitle("The product", counts)}
    <p>What the end user meets${jobs.length ? " and what runs by itself" : ""}, declared in
      <span class="mono">${esc(held.declared_in || "the code")}</span> and joined to what the
      pipelines have.</p>
    <svg class="pdraw" viewBox="0 0 ${W} ${H}" role="img"
      aria-label="The surfaces the end user meets${jobs.length
        ? " and the jobs that run without them" : ""}">
      <defs><marker id="pr" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="9"
        markerHeight="9" markerUnits="userSpaceOnUse" orient="auto">
        <path d="M0 0 L8 4 L0 8 z"/></marker></defs>${svg}</svg>
    <div class="plist">${held.surfaces.map(s => `<div class="prow">
      <span class="mono">${esc(s.name)}</span>
      <span>${esc(s.kind_words)}${s.does ? ` · ${esc(s.does)}` : ""}${
        s.channel ? `<br><span class="asks">Through <span class="mono">${
          esc(s.channel.name)}</span> at ${s.channel.at.map(a =>
          `<span class="mono">${esc(a)}</span>`).join(", ")} · answered by ${
          esc(s.channel.answered_by.join(", ").replace(/_/g, " "))}${
          s.stand_in ? ", which is a stand-in" : ""}</span>` : ""}${
        s.writers.length ? `<br><span class="asks">Written by ${s.writers.map(w =>
          `<span class="mono">${esc(w)}</span>`).join(", ")}</span>` : ""}${
        s.missing.length ? `<br><span class="bad">${esc(cap(s.missing.join("; ")))}.</span>`
          : ""}</span></div>`).join("")}${jobs.map(j => `<div class="prow">
      <span class="mono">${esc(j.name)}</span>
      <span>Job${j.does ? ` · ${esc(j.does)}` : ""}<br><span class="asks">Runs <span
        class="mono">${esc(j.pipeline_named)}</span>${j.after ? ` · after <span class="mono">${
        esc(j.after)}</span>` : ""} · the project's own scheduler starts it and passes <span
        class="mono">trigger=${esc(JSON.stringify(j.name))}</span></span>${
        j.missing.length ? `<br><span class="bad">${esc(cap(j.missing.join("; ")))}.</span>`
          : ""}</span></div>`).join("")}</div>
    ${!held.reaches_the_agent ? `<p class="bad">No interaction here starts or answers a run.
      What the end user does never reaches the agent.</p>` : ""}
    ${standIn.length ? `<p class="bad">${standIn.map(s =>
      `<span class="mono">${esc(s.name)}</span>`).join(", ")} still answers through a
      stand-in. The shipping check refuses that.</p>` : ""}
    ${bad.length ? "" : ""}
    <p class="asks"><b>Parameters</b> ${params.length
      ? params.map(p => `<span class="mono">${esc(p.name)}</span> ${esc(String(p.value))}`)
          .join(" · ") + `. The surface's own numbers, from <span class="mono">${
          esc(held.declared_in || "")}</span>. No run reaches them, so they appear in no run
          record. This is the only place they are written down.`
      : "none. The module declaring the product defines no number of its own."}</p>
  </div>`;
}

/* What a live run keeps, which is what the end user's words become on disk. */
function retentionRegion() {
  const brief = DATA.brief || {entries: []};
  const answer = name => (brief.entries || []).find(
    e => e.name === name && e.status === "answered");
  const rows = [
    ["What real runs may keep", answer("live_records")],
    ["What the end user reads", answer("stored_output")],
    ["Whether anyone is there", answer("someone_there")],
    ["Noticing when it stops being right", answer("watching_live")],
  ].filter(([, held]) => held);
  if (!rows.length) return "";
  return `<div class="mregion" data-section="retention">${measureTitle("Retention",
    `${fmt(rows.length)} answered`)}
    <p>What a run of the shipped project keeps, and who reads it.</p>
    ${rows.map(([words, held]) => `<div class="seamrow">
      <div class="sn">${esc(words)}</div>
      <p class="said">${esc(held.answer)}</p></div>`).join("")}</div>`;
}

/* The brief against the code, as a board. The build page carries the same disagreements with
   the two ways out of each; here the question is whether the record is true before other
   people are let in, so it is a tick list. */
function briefBoardRegion() {
  const claims = DATA.claims || [];
  if (!claims.length) return "";
  const row = c => {
    const off = c.named_but_not.length;
    return `<div class="checkrow ${off ? "failed" : c.unread ? "not_applicable" : "passed"}">
      <span class="mark">${off ? "✗" : c.unread ? "–" : "✓"}</span>
      <span class="cn">${esc(c.title)}${
        off ? `<span class="cw">The answer names ${c.named_but_not.map(esc).join(", ")}, and
          the code says otherwise.</span>`
        : c.unread ? `<span class="cw quiet">Waiting on ${esc(c.unread)}.</span>` : ""}</span>
      <span class="cgo"></span></div>`;
  };
  const off = claims.filter(c => c.named_but_not.length).length;
  return `<div class="mregion" data-section="claims">${measureTitle("Brief against code",
    `${fmt(claims.length - off)} of ${fmt(claims.length)} agree`)}
    <p>Each answer the code has an exact counterpart for, matched on a step's name. What to do
    about a disagreement is on the build page.</p>
    ${claims.map(row).join("")}</div>`;
}

/* ---------- the build page: progress, the numbers, the departures, the last run ---------- */
/* One chip a step, in pipeline order. The mark says whether it is built and the colour says
   what has happened to it since, so neither is carried by colour alone. */
function stepState(n) {
  if (n.planned) return "unbuilt";
  if (n.changed) return "moved";
  return ((n.over_the_record || {}).executions || 0) > 0 ? "proven" : "built";
}
const STATE_WORDS = {unbuilt: "Not built yet", moved: "Changed since its last run",
                     built: "Built, and no run has reached it", proven: "Proven by a run"};

function progressRegion() {
  if (!DECLARED.length) return "";
  const every = DECLARED.flatMap(p => p.nodes.map(n => stepState(n)));
  const of = (...states) => every.filter(s => states.includes(s)).length;
  const chip = n => `<button class="stepchip ${stepState(n)}" data-step="${esc(n.id)}"
    data-tip="${esc(n.id)}: ${esc(STATE_WORDS[stepState(n)])}"><i></i>${esc(n.id)}</button>`;
  const rows = DECLARED.map(p => `<div class="chiprow">${
    DECLARED.length > 1 ? `<span class="pn mono">${esc(p.name)}</span>` : ""}
    <span class="chips">${p.nodes.map(chip).join("")}</span></div>`).join("");
  const moved = DECLARED.filter(p => p.shape_moved === true).map(p => p.name);
  const unconfirmed = DECLARED.filter(p => p.shape_moved === null).map(p => p.name);
  const said = [
    `${fmt(of("built", "moved", "proven"))} of ${fmt(every.length)} steps built`,
    of("moved") ? `${fmt(of("moved"))} changed since the last run` : "",
    `${fmt(of("proven"))} proven by a run`,
  ].filter(Boolean).join(" · ");
  const agreement = moved.length
    ? `<span class="badge warn">Changed since you agreed: ${moved.map(esc).join(", ")}</span>`
    : unconfirmed.length
    ? `<span class="badge mut">Not agreed to yet: ${unconfirmed.map(esc).join(", ")}</span>`
    : `<span class="badge acc">Still the shape you agreed to</span>`;
  const legend = ["proven", "built", "moved", "unbuilt"]
    .filter(state => every.includes(state))
    .map(state => `<span class="keyrow"><i class="stepmark ${state}"></i>${
      esc(STATE_WORDS[state])}</span>`).join("");
  return `<div class="mregion" data-section="progress">
    ${measureTitle("Progress", said)}
    ${rows}
    <div class="legend">${legend}</div>
    <p class="asks">${agreement}</p>
    <p class="asks">Select a step to open it.</p></div>`;
}

/* Every number the code carries, and the decision that says somebody chose it. A number with
   no decision is one the coding agent picked alone, which is the whole reason to draw this. */
function constantsRegion() {
  const rows = DATA.constants || [];
  /* A number that is gone from the code is not waiting on anybody, so it is not counted as
     unconfirmed: there is nothing to confirm. */
  const open = rows.filter(r => !r.decision && !r.gone).length;
  if (!rows.length) {
    return `<div class="mregion">${measureTitle("Constants", "None recorded")}
      <p>A run records every module-level number the code reached. This project has no runs
      yet, so there is nothing to confirm.</p></div>`;
  }
  const modules = new Set(rows.map(r => r.module));
  const gone = rows.filter(r => r.gone).length;
  /* A number the newest run of every pipeline no longer records is not in the code, so there
     is nothing to agree to. Agreeing to one wrote a decision answering a constant the project
     did not have. */
  const body = rows.map(r => `<div class="numrow${r.gone ? " gone" : r.decision ? "" : " open"}">
    <span class="nm mono">${esc(r.name)}${
      modules.size > 1 ? ` <span class="asks">${esc(r.module)}</span>` : ""}</span>
    <span class="v mono">${esc(String(r.value))}</span>
    <span class="reach">${r.gone
      ? `<span class="asks">Last recorded ${esc(r.last_seen || "before the newest run")}</span>`
      : r.reached_from.steps.length
      ? r.reached_from.steps.map(s => `<span class="mono">${esc(s)}</span>`).join(", ")
        + (r.reached_from.through.length
          ? ` <span class="asks">through ${r.reached_from.through.map(t =>
              `<span class="mono">${esc(t)}</span>`).join(", ")}</span>` : "")
      : `<span class="asks">Written in ${esc(r.module)}</span>`}</span>
    <span class="conf">${r.gone
      ? `<span class="asks">Not in the code</span>`
      : r.decision
      ? `<span class="badge acc" data-tip="${esc(short(r.decision.chose, 300).said)}">${
          esc(r.decision.title)}</span>`
      : sentOr(SAY.agreeNumber(r.name, r.value),
          `<button class="btn primary" data-agreenum="${esc(r.name)}">Agree</button>`)}</span>
    </div>`).join("");
  return `<div class="mregion">${measureTitle("Constants",
    `${fmt(rows.length)} · ${open ? `${fmt(open)} unconfirmed` : "all confirmed"}`)}
    <p>Every number the project's own runs used, the steps it affects, and the decision that
    settled it. Agree records a decision for a number that has none.${gone
      ? ` ${fmt(gone)} number${gone === 1 ? " is" : "s are"} not in the code any more: an older run recorded ${gone === 1 ? "it" : "them"} and the newest does not.`
      : ""}</p>
    <div class="numhead"><span>Name</span><span>Value</span><span>Reached from</span>
      <span>Decision</span></div>
    ${body}</div>`;
}

/* The rules the prompts carry. A prompt no decision names is a rule the coding agent wrote
   and the builder has never read. */
function promptRulesRegion() {
  const rows = DATA.prompt_rules || [];
  if (!rows.length) {
    return `<div class="mregion">${measureTitle("Prompt rules", "None recorded")}
      <p>A run records the prompt each model call used, and this project's runs record
      none so far.${((DATA.prompts || {}).counts || {}).prompts
        ? ` The words each step holds are on the
        <button class="btn" data-goprompts="1">prompts page</button>.` : ""}</p></div>`;
  }
  const open = rows.filter(r => !r.decision).length;
  const body = rows.map(r => `<div class="numrow${r.decision ? "" : " open"}">
    <button class="nm mono" data-step="${esc(r.node_id)}"
      data-tip="Open ${esc(r.node_id)} for the code that builds its prompt">${
      esc(r.node_id)}</button>
    <span class="rule">${r.decision
      ? `<span title="${esc(r.decision.chose)}">${esc(short(r.decision.chose, 240).said)}</span>`
      : `<span class="asks">No rule is recorded for this prompt.</span>`}</span>
    <span class="conf">${r.decision
      ? `<span class="badge acc">${esc(r.decision.title)}</span>`
      : sentOr(SAY.showRule(r.node_id),
          `<button class="btn primary" data-agreeprompt="${esc(r.node_id)}">Show me the rule</button>`)
    }</span></div>`).join("");
  return `<div class="mregion">${measureTitle("Prompt rules",
    `${fmt(rows.length)} · ${open ? `${fmt(open)} unconfirmed` : "all confirmed"}`)}
    <p>What each prompt tells the model to do, where a decision records it. Select a step's
    name to open the code that builds its prompt, or read the words themselves on the
    <button class="btn" data-goprompts="1">prompts page</button>.</p>
    ${body}</div>`;
}

/* Where the build and the design disagree, each with the two ways out of it. Both are
   comments; which one is right is the builder's to say and the coding agent's to act on. */
function pipelineOf(nodeId) {
  const held = DECLARED.find(p => p.nodes.some(n => n.id === nodeId));
  return held ? held.name : null;
}
function departuresRegion() {
  const claims = (DATA.claims || []).filter(
    c => c.named_but_not.length || (c.names.length && c.in_code_but_unnamed.length));
  if (!claims.length) return "";
  const names = list => list.map(n => `<span class="mono">${esc(n)}</span>`).join(", ");
  const row = c => {
    const wrong = c.named_but_not;
    if (wrong.length) {
      const told = wrong.map(n =>
        `${n} is a ${c.kinds[n] || "step the code does not have"}`).join(", ");
      return `<div class="seamrow">
        <div class="sn">${esc(c.title)}</div>
        <p class="bad">The answer says ${names(wrong)} ${
          esc(wrong.length === 1 ? c.one : c.many)}. In the code, ${esc(told)}.</p>
        <p class="said">${longText(`claim:${c.entry}`, c.answer)}</p>
        <span class="acts">
          ${sentOr(SAY.answerWrong(c), `<button class="btn" data-answerwrong="${esc(c.entry)}">The answer is wrong</button>`)}
          ${sentOr(SAY.codeWrong(c), `<button class="btn" data-codewrong="${esc(c.entry)}">The code is wrong</button>`)}
        </span></div>`;
    }
    return `<div class="seamrow">
      <div class="sn">${esc(c.title)}</div>
      <p class="thin">${names(c.in_code_but_unnamed)} ${
        esc(c.in_code_but_unnamed.length === 1 ? c.one : c.many)} and the answer names only ${
        names(c.names)}.</p>
      <span class="acts">
        ${sentOr(SAY.answerWrong(c), `<button class="btn" data-answerwrong="${esc(c.entry)}">Add it to the answer</button>`)}
      </span></div>`;
  };
  return `<div class="mregion" data-section="claims">${measureTitle(
    "Build inconsistent with the design", `${fmt(claims.length)}`)}
    <p>An answer in the brief and the shape in the code were written at different times. Each
    row is one place they disagree, matched on a step's name.</p>
    ${claims.map(row).join("")}</div>`;
}

/* The newest run as one strip: where it went, in order, with what it did behind each step.
   The walk was a list on the ship page, and what a builder asks at `build` is whether the
   thing runs end to end, which is a shape rather than a transcript. */
let walkOpen = null;    // the step of the strip whose record is open, by sequence

function lastRunRegion() {
  const held = DATA.walks || {};
  const walks = held.walks || {};
  /* The project's own runs. A rollout is what an evaluation did, opened from the grid on the
     measure page; it is shown here when one was asked for, and never offered in the picker. */
  const names = Object.keys(walks).filter(name => !walks[name].rollout);
  if (!names.length && !(walking && walks[walking])) return "";
  if (!walking || !walks[walking]) walking = names[0];
  const one = walks[walking];
  const ran = one.steps.filter(s => s.termination !== "skipped");
  /* What the run was given, as the longest thing the first step received: a run's own input
     is the text, and the fields beside it are the metadata that came with it. */
  const first = (one.steps.find(s => (s.took_in || []).length) || {}).took_in || [];
  let given = first.length
    ? first.slice().sort((a, b) => (b.chars || 0) - (a.chars || 0))[0].value : "";
  /* A run given a list reads as how many and the first one, rather than as the JSON. */
  if (typeof given === "string" && /^\s*\[/.test(given)) {
    try {
      const items = JSON.parse(given);
      if (Array.isArray(items)) {
        const one = items[0];
        const shown = one && typeof one === "object"
          ? Object.values(one).map(v => String(v)).sort((a, b) => b.length - a.length)[0] || ""
          : String(one);
        given = `${fmt(items.length)} item${items.length === 1 ? "" : "s"}, the first ${esc(shown)}`;
      }
    } catch (e) { /* shown as it is */ }
  }
  const said = [
    String(one.started_at || "").slice(0, 10),
    `${fmt(one.ran)} step${one.ran === 1 ? "" : "s"} ran`,
    // A run whose calls could not be priced records a value of zero and no currency, and
    // "0.00" beside a date reads as a run that cost nothing rather than one nothing priced.
    one.cost && one.cost.value != null && one.cost.currency
      ? rate(one.cost.value, one.cost.currency) : "",
    one.outcome ? cap(String(one.outcome).replace(/_/g, " ")) : "",
  ].filter(Boolean).join(" · ");
  const chip = s => {
    /* The route names the step the arrow already points at, so the strip says it once. What
       a chip adds is what the name does not: which pass of a loop, and which item. */
    const skipped = s.termination === "skipped";
    const facts = [];
    // Which pass, only where the step is in the strip more than once. On a step that ran once
    // "pass 1" is the loop's bound restated, and the drawing already carries that.
    if (s.loop && ran.filter(x => x.node_id === s.node_id).length > 1) {
      facts.push(`pass ${s.loop.iteration}`);
    }
    if (s.item_index !== null && s.item_index !== undefined) facts.push(`item ${s.item_index}`);
    return `<button class="runstep${skipped ? " skipped" : ""}${
      walkOpen === s.sequence ? " open" : ""}" data-walkstep="${esc(String(s.sequence))}"
      data-tip="${esc(s.node_id)}${skipped ? ": the run did not reach it"
        : `: ${s.took_in_volume} in, ${s.handed_on_volume} out${
            s.ms ? `, ${Math.round(s.ms)} ms` : ""}`}">
      <span class="mono">${esc(s.node_id)}</span>${
      facts.length ? `<span class="rf">${esc(facts.join(" · "))}</span>` : ""}</button>`;
  };
  const strip = ran.map(chip).join(`<span class="runarrow">→</span>`);
  const never = one.steps.filter(s => s.termination === "skipped");
  const opened = one.steps.find(s => s.sequence === walkOpen);
  const picker = names.length > 1
    ? `<div class="dial"><span>Run</span>${names.map(name =>
        `<button data-walkpick="${esc(name)}" aria-pressed="${name === walking}">${
          esc(name.length > 26 ? name.slice(0, 25) + "…" : name)}</button>`).join("")}</div>`
    : "";
  const others = held.others || [];
  return `<div class="mregion" data-section="walk">${measureTitle(
    one.rollout ? "One rollout of the evaluation" : "The last run", said)}
    ${one.rollout ? `<p class="asks">This is a rollout the evaluation made, opened from the
      measure page. ${names.length ? `<button class="btn" data-walkpick="${esc(names[0])}">Back
      to the last run</button>` : ""}</p>` : ""}
    ${picker}
    ${given ? `<p class="given">It was given <b>${esc(given.length > 200
      ? given.slice(0, 199) + "…" : given)}</b></p>` : ""}
    <div class="runstrip">${strip}</div>
    ${never.length ? `<p class="asks">Never reached: ${never.map(s =>
      `<span class="mono">${esc(s.node_id)}</span>`).join(", ")}.</p>` : ""}
    ${opened ? `<div class="walk">${walkStep(opened, ran.indexOf(opened))}</div>`
      : `<p class="asks">Select a step for what it received, what it did, and what it
         produced.</p>`}
    ${one.left_out ? `<p class="pending">${fmt(one.left_out)} more steps are not shown.</p>` : ""}
    ${!others.length ? ""
      : live()
      ? `<div class="dial" style="margin-top:10px"><span>Open another</span>${
          others.slice(0, 24).map(name => `<button data-fetchwalk="${esc(name)}">${
            esc(name.length > 26 ? name.slice(0, 25) + "…" : name)}</button>`).join("")}</div>${
          others.length > 24 ? `<p class="pending">${fmt(others.length - 24)}${
            held.more ? "+" : ""} more are on disk.</p>` : ""}`
      : `<p class="asks">${fmt(others.length)}${held.more ? "+" : ""} other run${
         others.length === 1 ? " is" : "s are"} on disk and not in this file. Run
         <span class="mono">simple-agents view --serve</span> to open any of them, or
         <span class="mono">simple-agents report runs/${esc(others[0])}</span> to read one in
         the terminal.</p>`}</div>`;
}

/* ---------- the shape page: seams, shared state, decisions ---------- */
/* One click that stands for a sentence the builder would otherwise type. Where the page is
   served it lands as a thread; where it is a still picture it fills the writing panel with
   the words and the address, which is as far as a file on disk can carry it. */
async function oneClick(action) {
  const kind = action.kind || "comment";
  if (action.said && live()) {
    try {
      await post("/api/comment", {at: action.at, said: action.said, kind});
      // Shown from what this page already holds, so the control answers the click at once.
      // The reading that follows replaces it with the server's own account.
      justSent.add(sentKey(action.at, action.said));
      flash = "sent";
      renderAll();
      await refresh();
    } catch (err) {
      flash = String(err.message);
      renderComposer();
    }
    return;
  }
  select(action.at, addressName(action.at), kind);
  if (action.said) drafts[action.at + "|" + kind] = action.said;
  renderComposer();
  focusComposer();
}

/* Agreeing to one decision, which is the same relay as agreeing to the design: the words
   land as a thread on the decision and the coding agent moves the brief. */
function agreeToDecision(name) {
  return oneClick(SAY.agreeDecision(name));
}

/* The four answers the shape settles, each against the steps the code actually has. A seam
   the answer promises and the code lacks is the loudest line on the page. */
function seamsRegion() {
  const rows = DATA.seams || [];
  if (!rows.length) return "";
  const names = list => list.map(n => `<span class="mono">${esc(n)}</span>`).join(", ");
  const steps = part => part.steps.length
    ? part.steps.map(s => `<span class="mono">${esc(s.id)}</span>${
        s.through.length ? ` <span class="asks">through ${names(s.through)}</span>` : ""}${
        s.answered_by.length ? ` <span class="asks">· answered by ${
          esc(s.answered_by.join(", ").replace(/_/g, " "))}</span>` : ""}`).join("<br>")
    : `<span class="asks">None in the code</span>`;
  /* A row whose one part is the row says it once: the label column is there to separate
     spending from permanence, which is the only answer covering two things. */
  const body = rows.map(r => `<div class="seamrow">
    <div class="sn">${esc(r.title)}</div>
    ${r.parts.map(part => `<div class="part"><span>${
      part.words === r.title ? "In the code" : esc(part.words)}</span><span>${
      steps(part)}</span></div>`).join("")}
    ${r.status === "answered"
      ? `<p class="said">${longText(`seam:${r.entry}`, r.answer)}</p>`
      : `<p class="thin">Unanswered: ${esc(r.asked)}.</p>`}
    ${r.named_but_not.length
      ? `<p class="bad">The answer names ${names(r.named_but_not)}, and the code says
         ${r.named_but_not.length === 1 ? "it is" : "they are"} something else.</p>` : ""}
    ${r.in_code_but_unnamed.length && r.names.length
      ? `<p class="thin">${names(r.in_code_but_unnamed)} ${
          r.in_code_but_unnamed.length === 1 ? "does this too" : "do this too"}, unmentioned.</p>`
      : ""}
  </div>`).join("");
  const unsettled = rows.filter(r => r.status !== "answered" || r.named_but_not.length).length;
  return `<div class="mregion" data-section="seams">${measureTitle("Seams",
    unsettled ? `${fmt(unsettled)} of ${fmt(rows.length)} to settle` : `${fmt(rows.length)} · all settled`)}
    <p>Where the agent asks a person, spends money, changes something outside itself, or
    decides for itself. Each row shows what the code does next to what the builder answered.</p>
    ${body}</div>`;
}

/* Everything the run touches that outlives it, with the steps on each side. The system map
   draws the same links; this is the reading of them. */
function stateRegion() {
  const rows = DATA.resources || [];
  if (!rows.length) {
    return `<div class="mregion">${measureTitle("Shared state", "None declared")}
      <p>No step declares a resource. A step that reaches something outside the run names it
      with <span class="mono">touches=</span>, and so does a tool.</p></div>`;
  }
  const side = (words, list) => list.length
    ? `<b>${esc(words)}</b> ${list.map(w => `<span class="mono">${esc(w)}</span>`).join(", ")}`
    : "";
  const body = rows.map(r => {
    const ways = [side("Read by", r.readers), side("Written by", r.writers),
                  side("Touched by", r.unknown)].filter(Boolean).join("<br>");
    const gaps = [
      r.unknown.length ? `Direction undeclared for ${
        r.unknown.length === 1 ? "that step" : "those steps"}.` : "",
      !r.readers.length && r.writers.length ? "Nothing reads it." : "",
      !r.writers.length && r.readers.length ? "Nothing writes it." : "",
    ].filter(Boolean);
    return `<button class="staterow" data-store="${esc(r.name)}">
      <span class="mono">${esc(r.name)}</span>
      <span class="ways">${ways || `<span class="none">Reached by nothing the code declares.</span>`}${
        gaps.length ? `<br><span class="none">${esc(gaps.join(" "))}</span>` : ""}</span></button>`;
  }).join("");
  return `<div class="mregion">${measureTitle("Shared state",
    `${fmt(rows.length)} ${rows.length === 1 ? "resource" : "resources"}`)}
    <p>What the pipelines share. Select one for what goes in and out of it.</p>
    ${body}</div>`;
}

const DEC_MARK = {agreed: "●", proposed: "○", changed: "◐", not_applicable: "—"};
const DEC_WORDS = {agreed: "Agreed", proposed: "Proposed",
                   changed: "Changed since it was agreed", not_applicable: "Not applicable"};
const DEC_COUNT = {agreed: "agreed", proposed: "proposed", changed: "changed",
                   not_applicable: "not applicable"};

/* Every decision of one kind, with what it chose, why, and the one click that agrees to it.
   Agreeing is offered on anything not already agreed; amending is offered on all of them,
   because a decision the builder has agreed to is still theirs to change. */
function decisionsRegion(rows, title) {
  if (!rows.length) return "";
  const counts = {};
  rows.forEach(d => {
    const at = d.status || "proposed";
    counts[at] = (counts[at] || 0) + 1;
  });
  const count = Object.entries(counts)
    .map(([k, v]) => `${fmt(v)} ${DEC_COUNT[k] || k}`).join(" · ");
  const row = d => {
    const status = d.status || "proposed";
    return `<div class="drow dec ${esc(status)}">
      <span class="mark" data-tip="${esc(DEC_WORDS[status] || status)}">${
        DEC_MARK[status] || "○"}</span>
      <span><span class="dname">${esc(d.title || d.name)}</span>${
        status !== "agreed"
          ? ` <span class="badge ${status === "changed" ? "warn" : "mut"}">${
              esc(DEC_WORDS[status] || status)}</span>` : ""}
        <span class="chose">${longText(`decision:${d.name}`, d.chose || "")}</span>${
        d.because
          ? `<span class="why">${longText(`decision:${d.name}:why`, `Because ${d.because}`)}</span>`
          : ""}</span>
      <span class="acts">${status === "proposed"
        ? sentOr(SAY.agreeDecision(d.name),
            `<button class="btn primary" data-agree="decision:${esc(d.name)}">Agree</button>`) : ""}
        <button class="btn" data-amend="decision:${esc(d.name)}">Amend</button></span></div>`;
  };
  return `<div class="mregion" data-section="decisions">${measureTitle(title, count)}
    ${rows.map(row).join("")}</div>`;
}

function dataPathSection(sections) {
  const p = DECLARED.find(x => x.name === currentPipe);
  if (!p || !p.data_path || !p.data_path.length) return;
  const path = p.data_path;
  const first = path[0];
  const ends = path.filter(r => r.ends);
  const kept = [...new Set(path.flatMap(r => r.writes))];
  const undirected = [...new Set(path.flatMap(r => r.touches))];
  let inner = `<div class="pathenter">It starts with <b>${esc(first.takes_in)}</b>, at
    <span class="mono">${esc(first.id)}</span>.</div><div class="path">`;
  inner += path.map(r => `<div class="pathrow" data-step="${esc(r.id)}">
      <span class="st">${esc(r.id)}<small>${esc(r.kind_word)}${r.planned ? " · not built yet" : ""}</small></span>
      <span class="into">${esc(r.takes_in)}${
        r.took_in_volume ? `<br><span class="much">${esc(r.took_in_volume)}</span>` : ""}</span>
      <span class="outof"><b>Produces</b> ${esc(r.hands_on)}${
        r.reads.length ? `<br>reads ${r.reads.map(esc).join(", ")}` : ""}${
        r.writes.length ? `<br>writes ${r.writes.map(esc).join(", ")}` : ""}${
        r.handed_on_volume ? `<br><span class="much">${esc(r.handed_on_volume)}</span>` : ""}${
        r.touches.length ? `<br>touches ${r.touches.map(esc).join(", ")} · direction undeclared` : ""}</span>
    </div>`).join("");
  inner += `</div><div class="pathleave">It ends at ${
    ends.map(r => `<span class="mono">${esc(r.id)}</span>`).join(" or ")}, producing <b>${
    ends.map(r => esc(r.hands_on)).join(" or ")}</b>.${
    kept.length ? ` What outlives the run is written to ${kept.map(esc).join(", ")}.`
      : " No resource write is declared for this pipeline."}${
    undirected.length ? ` Direction is undeclared for ${undirected.map(esc).join(", ")}.` : ""}</div>`;
  sections.push(section("datapath", `Where the data goes in ${p.name}`,
    `${path.length} step${path.length === 1 ? "" : "s"}`, inner, false));
}

/* Which run directory a rollout's trajectory path names. */
function runOf(path) {
  if (!path) return "";
  const parts = String(path).split("/");
  return parts[parts.length - 2] || "";
}

let walking = null;   // the run being walked, by directory name

/* One step of a walk: what it received, what it did inside itself, what it produced. */
function walkStep(step, index) {
  const skipped = step.termination === "skipped";
  const did = (step.did || []).map(one => {
    if (one.kind === "model") {
      return `<div class="access"><div class="dirn">asked ${esc(one.name || "the model")}${
        one.replayed ? " · replayed" : ""}${
        one.finish_reason ? ` · ${esc(one.finish_reason)}` : ""}</div>
        ${one.said ? `<div class="side"><b>said</b><span>${esc(one.said)}</span></div>` : ""}
        ${(one.asked_for || []).length
          ? `<div class="side"><b>called</b><span>${esc(one.asked_for.join(", "))}</span></div>`
          : ""}</div>`;
    }
    if (one.kind === "tool") {
      return `<div class="access"><div class="dirn">called ${esc(one.name)}${
        one.failed ? " · it failed" : ""}${
        one.spent ? ` · spent ${esc(rate(one.spent, one.currency))}` : ""}</div>
        <div class="side"><b>asked</b><span>${esc(one.asked)}</span></div>
        <div class="side"><b>got</b><span>${esc(one.got)}</span></div></div>`;
    }
    if (one.kind === "access") {
      return `<div class="access"><div class="dirn">${
        esc(one.direction === "write" ? "wrote" : "read")} ${esc(one.name)}</div>
        <div class="side"><b>asked</b><span>${esc(one.asked)}</span></div>
        <div class="side"><b>got</b><span>${esc(one.got)}</span></div></div>`;
    }
    return `<div class="access"><div class="dirn">asked a person${
      one.answered_by ? ` · ${esc(one.answered_by)}` : ""}</div>
      <div class="side"><b>asked</b><span>${esc(one.prompt || "")}</span></div>
      <div class="side"><b>said</b><span>${esc(one.answer || one.resolution || "")}</span></div>
      </div>`;
  }).join("");

  const facts = [];
  if (!skipped) {
    facts.push(`${esc(step.took_in_volume)} in`);
    facts.push(`${esc(step.handed_on_volume)} out`);
    if (step.ms) facts.push(`${fmt(Math.round(step.ms))} ms`);
  }
  if (step.route && step.route.length) facts.push(`Then ${esc(step.route.join(", "))}`);
  if (step.loop) facts.push(`Iteration ${step.loop.iteration} of ${step.loop.max_iterations}`);
  if (step.item_index !== null && step.item_index !== undefined) {
    facts.push(`Item ${step.item_index}`);
  }
  return `<div class="walkstep${skipped ? " quiet" : ""}">
    <div class="walkhead"><span class="wn">${index + 1}</span>
      <span class="mono">${esc(step.node_id)}</span>
      <span class="wf">${skipped
        ? "The run did not reach it"
        : facts.join(" · ")}</span>${
      live() && !skipped && step.sequence
        ? `<button class="btn" data-fetchrecord="${step.sequence}">Full record</button>` : ""
    }</div>
    ${live() && !skipped && step.sequence
      ? `<div class="fullrec" data-fullrec="${step.sequence}" hidden></div>` : ""}
    ${step.error ? `<p class="pending" style="color:var(--attention)">${esc(step.error)}</p>` : ""}
    ${did}${step.did_not_shown
      ? `<p class="pending" style="margin-left:18px">and ${fmt(step.did_not_shown)} more it
         did, not shown.</p>` : ""}</div>`;
}

/* What the newest run wrote into its own directory. Every run gets one and nothing on the
   page said anything about it, so a pipeline that produces a file produced it invisibly. */
function workspaceSection(sections) {
  const held = DATA.workspace;
  if (!held) return;
  const inner = held.total
    ? `<p class="asks">${fmt(held.total)} file${held.total === 1 ? "" : "s"}, ${
        fmt(held.bytes)} bytes, written by ${esc(held.run)} into
        <span class="mono">runs/${esc(held.run)}/workspace/</span>.</p>` +
      held.files.map(f => `<div class="kv"><span class="mono">${esc(f.name)}</span><span>${
        fmt(f.bytes)} bytes</span></div>`).join("") +
      (held.total > held.files.length
        ? `<p class="pending">${fmt(held.total - held.files.length)} more are not listed.</p>`
        : "")
    : `<p class="asks">The newest run has no workspace files. Every run gets one
       at <span class="mono">runs/${esc(held.run)}/workspace/</span>, and a step that produces
       a file puts it there.</p>`;
  sections.push(section("workspace", "What the run wrote",
    held.total ? `${fmt(held.total)} files` : "empty", inner, false));
}

/* ---------- the prompts page ---------- */
/* Every instruction the project sends, as it was written and as it was sent. The record
   keeps the fixed text and each value's length apart, so the page can say which words the
   project wrote and which arrived at run time (`docs/view.md` §6.10). */
let promptShow = "sent";          // "sent" or "written"
let promptFilter = null;          // null, "unagreed" or "changed"
let promptHere = null;            // the step the path has selected
const promptShut = new Set();     // steps the reader has closed
const promptOpen = new Set();     // steps the reader has opened past the default
const promptValue = {};           // step key -> the value panel showing
const promptTurns = new Set();    // steps whose later turns are open
const promptShutPipes = new Set(); // pipelines the reader has collapsed in the path
let promptSelection = null;       // the words a selection thread carries with it

const promptKey = s => s.pipeline + "/" + s.node_id;
function promptSteps() {
  return (((DATA.prompts || {}).pipelines) || []).flatMap(p => p.steps || []);
}
function promptKept(step) {
  if (promptFilter === "unagreed") return !step.decision && !step.planned;
  if (promptFilter === "changed") return !!step.changed;
  return true;
}
/* Ten prompts or fewer and every one opens open. Above that only the selected step and the
   ones carrying something to read open, so a forty-step project is readable at the top. */
function promptIsOpen(step, many) {
  const key = promptKey(step);
  if (promptShut.has(key)) return false;
  if (promptOpen.has(key) || promptHere === key) return true;
