<script id="view-data" type="application/json">__DATA__</script>
<script>
(() => {
"use strict";
let DATA = JSON.parse(document.getElementById("view-data").textContent);
const css = n => getComputedStyle(document.documentElement).getPropertyValue(n).trim();
const esc = s => String(s ?? "").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
const fmt = n => Number(n).toLocaleString("en-US");
const el = (tag, attrs) => { const n = document.createElementNS("http://www.w3.org/2000/svg", tag);
  for (const k in attrs) n.setAttribute(k, attrs[k]); return n; };
const reduced = matchMedia("(prefers-reduced-motion: reduce)").matches;
const cap = s => { s = String(s ?? ""); return s.charAt(0).toUpperCase() + s.slice(1); };
function ago(iso) {
  const seconds = Math.max(0, (Date.now() - Date.parse(iso)) / 1000);
  if (!isFinite(seconds)) return "";
  if (seconds < 90) return `${Math.round(seconds)} s ago`;
  if (seconds < 5400) return `${Math.round(seconds / 60)} min ago`;
  return `${(seconds / 3600).toFixed(1)} h ago`;
}

/* ---------- state that survives a re-render ---------- */
let DECLARED = [], HISTORY = [];
let currentPipe = null, currentStep = null;
let graphFocus = false;
let railShows = null;                // {kind: "resource", name} while the rail is not a step
let selected = null;                 // {address, label, kind}
const drafts = {};                   // address|kind -> composer text
const subOpen = {data: true, agreed: true, conversation: true};  // step-card groups
let flash = "";                      // one-shot "sent" note
let shownStage = null;               // the stage page being read; anchored to DATA.stage
let browserFilter = null;            // {kind: "outcome"|"criterion"|"group", value, examples: Set}
let groupKey = null;                 // which key the grouped figures are over
let rungShown = null;                // a ladder rung's node set, shaded on the drawing
let compared = null;                 // a pick-two comparison the served page computed

function live() { return !!DATA.live; }

/* ---------- the stage pages ---------- */
const ALL_STAGES = ["brainstorm", "research", "shape", "build", "measure", "ship"];
/* `operate` is not a stage: the ship gate never closes, and a project with live runs has a
   page about what they are doing. It appears when there are live runs and not before. */
const OPERATE = "operate";
/* Nor is `prompts`: the words a project sends are read on their own page, linked from the
   build page's prompt rules and from any step's card. */
const PROMPTS = "prompts";
function stageSet() {
  const held = DATA.stages || [];
  const stages = held.length ? held.slice() : ALL_STAGES.slice();
  /* Prompts is a page rather than a stage: it appears once a step calls a model, and sits
     where the words are written, which is beside `build`. */
  if (((DATA.prompts || {}).counts || {}).prompts) {
    const after = stages.indexOf("build");
    stages.splice(after < 0 ? stages.length : after + 1, 0, PROMPTS);
  }
  if (DATA.operating) stages.push(OPERATE);
  return stages;
}
/* A section whose home page the tier does not have lands on `ship`, which every tier keeps. */
function pageFor(stage) {
  return stageSet().includes(stage) ? stage : "ship";
}
/* Where a decision is filed: its recorded kind names the stage whose conversation it is. */
const KIND_PAGE = {dependency: "research", shape: "shape", constant: "build",
                   prompt_rule: "build", measurement: "measure", presentation: "ship"};
function anchorStage() {
  /* A link may name the page (`#stage/shape`); otherwise the homepage is the project's
     own stage. */
  const linked = (window.location.hash || "").match(/^#stage\/([a-z]+)$/);
  if (linked && stageSet().includes(linked[1])) return linked[1];
  if (stageSet().includes(DATA.stage)) return DATA.stage;
  return DECLARED.length ? "shape" : stageSet()[0];
}
const MAP_PAGES = ["shape", "build", "measure"];
/* Which page a section lives on, for a finding that points at one from any page. */
function sectionPage(id) {
  const fixed = {prompts: PROMPTS, conversation: "ship", claims: "build", asked: "ship",
                 history: DATA.operating ? OPERATE : "ship",
                 checks: "ship", product: "ship", retention: "ship",
                 workspace: "ship", notes: "ship", problems: "ship",
                 walk: "build", changes: "build", moved: "build", datapath: "build",
                 progress: "build", constants: "build", seams: "shape",
                 examples: "measure", measure: "measure"};
  if (id in fixed) return pageFor(fixed[id]);
  if (id === "questions" || id === "answers") return pageFor(DATA.stage || "brainstorm");
  if (id === "decisions") return "shape";
  return null;
}
/* The drawing's home page, for a finding that points at a step or a store. */
function mapPage() {
  const at = pageFor(DATA.stage || "shape");
  return MAP_PAGES.includes(at) ? at : "shape";
}
function showPage(stage) {
  shownStage = pageFor(stage);
  if (window.history && window.history.replaceState) {
    history.replaceState(null, "", "#stage/" + shownStage);
  }
  /* The page presets what the drawing is over: the evaluation on the measure page, the
     project's own runs elsewhere. The two controls still change it after. */
  population = shownStage === "measure" ? "rollouts" : "runs";
  renderAll();
}
function renderStageStrip() {
  const strip = document.getElementById("stagestrip");
  const stages = stageSet();
  const at = stages.indexOf(DATA.stage);
  strip.hidden = false;
  strip.innerHTML = stages.map((s, i) => {
    if (s === OPERATE) {
      return `<button data-page="${esc(s)}" class="operate" aria-pressed="${s === shownStage}"
        title="Live runs are on record"><span class="mark">◆</span>Operate</button>`;
    }
    if (s === PROMPTS) {
      return `<button data-page="${esc(s)}" class="aside" aria-pressed="${s === shownStage}"
        title="Every prompt this project sends"><span class="mark">✎</span>Prompts</button>`;
    }
    const state = at < 0 ? "ahead" : i < at ? "done" : i === at ? "here" : "ahead";
    const mark = state === "done" ? "✓" : state === "here" ? "●" : "○";
    return `<button data-page="${esc(s)}" class="${state}" aria-pressed="${s === shownStage}"
      title="${esc(cap(s))}${state === "here" ? " · The project is here" : ""}">
      <span class="mark">${mark}</span>${esc(cap(s))}</button>`;
  }).join("") + (at >= 0 ? `<span class="youarehere">The project is at ${esc(DATA.stage)}</span>` : "");
  strip.querySelectorAll("[data-page]").forEach(b => b.onclick = () => showPage(b.dataset.page));
}

/* ---------- figures ---------- */
function rate(value, unit) {
  if (value === null || value === undefined) return "no figure";
  if (unit === "rate") return (value * 100).toFixed(1) + "%";
  const shown = Math.abs(value) < 1 ? value.toPrecision(3) : value.toLocaleString("en-US", {maximumFractionDigits: 4});
  return shown + (unit ? " " + unit : "");
}
function figureText(f) {
  if (!f || f.point === null || f.point === undefined) return esc(f && f.reason ? f.reason : "no figure");
  // A figure the project declared a count over the run is not an estimate of a rate, so it is
  // never drawn as a percentage and never carries a span.
  if (f.estimated === false) {
    const unit = f.unit && f.unit !== "rate" ? " " + f.unit : "";
    const why = f.reason ? ` <span class="span">${esc(f.reason)}</span>` : "";
    return `<span class="fig">${esc(fmt(f.point) + unit)}</span>${why}`;
  }
  const span = (f.low !== null && f.low !== undefined && f.high !== null && f.high !== undefined)
    ? ` <span class="span">${esc(rate(f.low, f.unit))}–${esc(rate(f.high, f.unit))}</span>` : "";
  const counts = (f.numerator !== null && f.numerator !== undefined
                  && f.denominator !== null && f.denominator !== undefined)
    ? ` <span class="span">${esc(fmt(f.numerator))} of ${esc(fmt(f.denominator))}</span>` : "";
  return `<span class="fig">${esc(rate(f.point, f.unit))}${span}${counts}</span>`;
}
function fieldList(card) {
  if (!card || !card.fields || !card.fields.length) return "";
  return `<div class="fieldlist">` + card.fields.map(f =>
    `<b>${esc(f.name)}</b> ${esc(f.type || "")}`).join("<br>") + `</div>`;
}
function amount(sh) {
  const n = (sh.count || 0).toLocaleString("en-US");
  if (sh.kind === "list") return `${n} item${sh.count === 1 ? "" : "s"}`;
  if (sh.kind === "text") return `${n} character${sh.count === 1 ? "" : "s"}`;
  if (sh.kind === "record") return `${n} field${sh.count === 1 ? "" : "s"}`;
  return sh.kind || "a value";
}
function shapeRows(sh, name, depth) {
  if (!sh || depth > 2) return [];
  const rows = [{depth, name, amount: amount(sh)}];
  if (sh.kind === "record" && sh.fields) {
    Object.entries(sh.fields).forEach(([key, inner]) => {
      rows.push(...shapeRows(inner, key, depth + 1));
    });
  } else if (sh.kind === "list" && sh.of) {
    rows.push(...shapeRows(sh.of, "each", depth + 1));
  }
  return rows;
}
function shapeBlock(sh, title) {
  const rows = shapeRows(sh, title, 0);
  if (!rows.length) return "";
  return `<div class="shape">` + rows.map(r =>
    `<div class="shrow" style="padding-left:${r.depth * 13}px"><span class="shname">${
      esc(r.name)}</span><span class="shamount">${esc(r.amount)}</span></div>`).join("")
    + `</div>`;
}
function volumeLine(n) {
  const ex = n.example;
  if (!ex || !ex.took_in_volume) return "";
  return `${ex.took_in_volume} → ${ex.handed_on_volume}`;
}

function exampleBlock(ex) {
  if (!ex) return "";
  if (ex.too_large) {
    return `<div class="example"><div class="exlabel">From ${esc(ex.run)}</div>
      <div class="exnote">This step's record is ${fmt(ex.too_large)} characters, too large to
      show here. It is in that run's trajectory.</div></div>`;
  }
  const side = (title, rows) => !rows || !rows.length ? "" : `<div class="exside">
    <span class="exhead">${esc(title)}</span>` + rows.map(r => `<div class="exrow">${
      r.key ? `<b>${esc(r.key)}</b> ` : ""}${esc(r.value)}${
      r.chars > r.value.length ? ` <i>… ${fmt(r.chars)} characters in all</i>` : ""}</div>`).join("")
    + `</div>`;
  const more = ex.executions > 1
    ? `<div class="exnote">It ran ${fmt(ex.executions)}× in that run; this is the first.</div>` : "";
  const held = (ex.held_back || []).length
    ? `<div class="exnote">Part of it was ${ex.held_back.map(esc).join(" and ")} before it was
       recorded, so what is above is not the whole value.</div>` : "";
  const failed = ex.error
    ? `<div class="exnote">That execution failed: ${esc(ex.error)}</div>` : "";
  const same = JSON.stringify(ex.took_in) === JSON.stringify(ex.handed_on);
  const much = ex.took_in_volume
    ? `<div class="exvolume">${esc(ex.took_in_volume)} <b>in</b> · ${
        esc(ex.handed_on_volume)} <b>out</b></div>` : "";
  return `<div class="example"><div class="exlabel"><b>One real value</b> · ${esc(ex.run)}</div>`
    + much + shapeBlock(ex.took_in_shape, "what arrived")
    + (same ? "" : shapeBlock(ex.handed_on_shape, "what left"))
    + side("it took in", ex.took_in)
    + (same ? `<div class="exnote">Its output matches its input.</div>`
            : side("it produced", ex.handed_on))
    + failed + held + more + `</div>`;
}

/* ---------- talking back ---------- */
async function post(path, payload) {
  const response = await fetch(path, {
    method: "POST", headers: {"Content-Type": "application/json"},
    body: JSON.stringify(payload),
  });
  const body = await response.json().catch(() => ({}));
  if (!response.ok) throw new Error(body.error || "the server refused it");
  return body;
}
async function refresh() {
  try {
    const response = await fetch("/data", {cache: "no-store"});
    if (!response.ok) return;
    DATA = await response.json();
    renderAll();
  } catch (e) { /* the server went away; the page keeps its last state */ }
}

/* ---------- selection ---------- */
function select(address, label, kind) {
  selected = {address, label, kind: kind || "comment"};
  renderComposer();
}
/* One `prompt:` address split the way `simple_agents.records.comments` splits it, or null.
   Every place on the page that reads one reads it here. */
function promptParts(address) {
  if (!address.startsWith("prompt:")) return null;
  const [where, part] = address.slice(7).split("#");
  const cut = where.indexOf("/");
  if (cut < 1 || cut === where.length - 1) return null;
  return {pipeline: where.slice(0, cut), step: where.slice(cut + 1), where, part: part || ""};
}
/* The address a thread is filed under, named for a reader. A step, edge, pipeline or
   resource is already called what the drawing calls it; a question or a decision is filed
   under a brief key, and the key is the library's vocabulary rather than the project's. */
function addressName(address) {
  const brief = DATA.brief || {};
  const held = promptParts(address);
  if (held) {
    if (!held.part) return `the prompt for ${held.step}`;
    return held.part.startsWith("words-")
      ? `words in the prompt for ${held.step}`
      : `the ${held.part} value in the prompt for ${held.step}`;
  }
  for (const [prefix, rows] of [["question:", brief.entries], ["decision:", brief.decisions]]) {
    if (!address.startsWith(prefix)) continue;
    const key = address.slice(prefix.length);
    const held = (rows || []).find(r => r.name === key)
      || (DATA.questions_due || []).find(q => q.name === key);
    return (held && held.title)
      || key.replace(/_/g, " ").replace(/^./, first => first.toUpperCase());
  }
  return address;
}
function threadsAt(address) {
  return (DATA.comments || []).filter(c => c.at === address);
}
function openAt(address) {
  return threadsAt(address).filter(c => c.status === "open");
}

/* ---------- the reader's colours ---------- */
/* Five palettes and the reader's own system. Every colour in the drawing is resolved to a
   literal at the moment it is drawn, so changing one redraws the page rather than restyling
   it; the same is true of the system changing underneath, which is why both call renderAll. */
const THEMES = [
  ["paper", "Paper", "#F7F5F0", "#0A6E52"],
  ["dawn", "Dawn", "#F4F5F9", "#3546C4"],
  ["forest", "Forest", "#0D1311", "#4ECFAF"],
  ["slate", "Slate", "#0F1216", "#5AB4F0"],
  ["midnight", "Midnight", "#0B0D18", "#8B7BFF"],
];
const THEME_KEY = "simple-agents.view.theme";

function savedTheme() {
  try { return localStorage.getItem(THEME_KEY); } catch (e) { return null; }
}
function keepTheme(name) {
  try {
    if (name) localStorage.setItem(THEME_KEY, name); else localStorage.removeItem(THEME_KEY);
  } catch (e) { /* a page opened from a file may refuse storage; the choice lasts the visit */ }
}
function applyTheme(name) {
  if (name) document.documentElement.setAttribute("data-theme", name);
  else document.documentElement.removeAttribute("data-theme");
}
function renderThemes() {
  const holder = document.getElementById("themes");
  const chosen = document.documentElement.getAttribute("data-theme");
  holder.innerHTML = THEMES.map(([key, words, ground, accent]) =>
    `<button data-theme-pick="${esc(key)}" aria-pressed="${key === chosen}" title="${esc(words)}"
      aria-label="${esc(words)}" style="background:${ground};box-shadow:inset 0 0 0 4px ${accent}"></button>`
  ).join("") + `<button class="sys" data-theme-pick="" aria-pressed="${!chosen}"
      title="Follow this device">Auto</button>`;
  holder.querySelectorAll("[data-theme-pick]").forEach(b => b.onclick = () => {
    const pick = b.dataset.themePick || null;
    applyTheme(pick); keepTheme(pick); renderAll();
  });
}

/* ---------- header ---------- */
function renderHeader() {
  document.getElementById("t-project").textContent = DATA.project || "the project";
  const stage = document.getElementById("t-stage");
  stage.hidden = !DATA.stage; if (DATA.stage) stage.textContent = cap(DATA.stage) + " stage";
  const tier = document.getElementById("t-tier");
  tier.hidden = !DATA.tier; if (DATA.tier) tier.textContent = cap(DATA.tier);
  renderThemes();
  document.getElementById("t-live").hidden = !live();
  document.getElementById("t-stamp").textContent = DATA.generated_at || "";
  document.getElementById("t-standing").textContent = DATA.standing || "";
  const intent = DATA.intent || {};
  const intentBox = document.getElementById("intent");
  if (intent.purpose || intent.for_whom || intent.outcome || intent.surface) {
    /* The masthead is a summary of four answers the `brainstorm` page holds whole. A cut here
       lands on a word and the `title` carries the rest, so the reader can see where it went. */
    const fact = (label, text) => {
      if (!text) return "";
      const held = short(text, 560);
      return `<span title="${esc(held.whole)}"><b>${label}</b> ${esc(held.said)}</span>`;
    };
    const facts = [fact("For", intent.for_whom), fact("Working when", intent.outcome),
                   fact("Used through", intent.surface)].filter(Boolean).join("");
    const purpose = short(intent.purpose, 560);
    intentBox.hidden = false;
    intentBox.innerHTML = `<div class="eyebrow">What this project is for</div>${
      intent.purpose ? `<div class="purpose" title="${esc(purpose.whole)}">${
        esc(purpose.said)}</div>` : ""
    }${facts ? `<div class="facts">${facts}</div>` : ""}`;
  } else {
    intentBox.hidden = true;
    intentBox.innerHTML = "";
  }
  const actions = document.getElementById("quickactions");
  const next = (DATA.questions_due || []).find(q => !q.pending);
  actions.innerHTML = `${DECLARED.length ? `<button data-action="map">View the map</button>` : ""}${
    live() ? `<button data-action="comment">Comment on this project</button>${
      next ? `<button class="primary" data-action="answer">Answer the next decision</button>` : ""
    }` : ""}`;
  actions.onclick = e => {
    const button = e.target.closest("[data-action]");
    if (!button) return;
    if (button.dataset.action === "map") {
      if (!MAP_PAGES.includes(shownStage)) showPage(mapPage());
      document.getElementById("map").scrollIntoView({behavior: reduced ? "auto" : "smooth"});
    } else if (button.dataset.action === "comment") {
      select("project", "the whole project", "comment"); focusComposer();
    } else if (button.dataset.action === "answer" && next) {
      select(`question:${next.name}`, next.asks, "answer"); focusComposer();
    }
  };
}

/* ---------- what needs attention ---------- */
/* A one-click sentence already sent and still open is with the coding agent. The button
   that sent it is replaced by that fact, so agreeing twice takes a second thread rather than
   a second click, and the builder can see that the act has been taken. */
/* Sent in this session and not yet in a reading from the server. `/data` re-reads the whole
   project, which takes a moment on one with runs, and until it returned the control sat
   unchanged: the builder clicked and nothing happened. */
const justSent = new Set();
const sentKey = (at, said) => `${at}|${String(said || "").trim()}`;

function sentAlready(at, said) {
  if (!said) return false;
  if (justSent.has(sentKey(at, said))) return true;
  return (DATA.comments || []).some(c =>
    c.at === at && c.status === "open" && String(c.said || "").trim() === String(said).trim());
}
const SENT_NOTE = `<span class="sentnote">Sent to your coding agent</span>`;
/* The sentences the one-clicks send. Each is built here so the region that offers the click
   and the check that says it was already sent read the same words. */
const SAY = {
  agreeDecision: name => ({at: `decision:${name}`, kind: "comment",
    said: "I agree to this decision."}),
  agreeNumber: (name, value) => ({at: "project", kind: "comment",
    said: `${name} should be ${value === undefined ? "what it is" : value}. Record it as a constant decision.`}),
  showRule: node => ({at: "project", kind: "comment",
    said: `Show me what the ${node} prompt tells the model, and record the rules in it as a prompt_rule decision.`}),
  answerWrong: c => {
    const wrong = c.named_but_not.length ? c.named_but_not : c.in_code_but_unnamed;
    return {at: `question:${c.entry}`, kind: "amendment",
      said: `The answer and the code disagree about ${(wrong || []).join(", ")}. The code is right; change the answer to say what is built.`};
  },
  codeWrong: c => {
    const first = (c.named_but_not || [])[0];
    const pipe = first ? pipelineOf(first) : null;
    return {at: pipe ? `${pipe}/${first}` : "project", kind: "comment",
      said: `The answer is right: ${(c.named_but_not || []).join(", ")} should ${
        c.named_but_not.length === 1 ? (c.should_one || c.one) : (c.should_many || c.many)}. Change the code to match.`};
  },
  confirmIdea: () => ({at: "project", kind: "comment",
    said: "idea.md describes what I am asking for. Record that I have confirmed it."}),
};
const sentOr = (action, button) => sentAlready(action.at, action.said) ? SENT_NOTE : button;
function actionLabel(finding) {
  const target = finding.target || {};
  if (target.node) return `Open ${target.node}`;
  if (target.resource) return `Open ${target.resource}`;
  if (target.pipeline) return `Open ${target.pipeline}`;
  if (target.section === "prompts") return "Read the prompt";
  if (target.section === "questions") return "Review decisions";
  if (target.section === "measure") return "Review evaluation";
  return "Open details";
}
/* Two lists, because they are two different things and one heading over both taught a reader
   to skip the number. What waits on the builder is an unanswered comment, a question the
   stage needs, an unconfirmed shape; each of those has something to do and the button
   says what it is. That a step decides for itself, or that money can leave at one of them, is
   a fact about the design: true, worth seeing, and not a task. Said under one heading, six
   facts and two tasks read as "8 items need attention", and none of them got done. */
function renderEyes() {
  const eyes = document.getElementById("eyes");
  const all = DATA.findings || [];
  const waiting = all.filter(f => f.waits);
  const knowing = all.filter(f => !f.waits);
  /* A finding that carries actions is one the builder can answer from here, so its own
     buttons replace the one that only goes and looks at it. */
  const row = (f, i) => `
    <div class="finding ${f.severity}">
      <span><b>${esc(f.head)}</b> <span class="body">${esc(f.body)}</span></span>
      ${(f.actions || []).length
        ? `<span class="go acts">${f.actions.map((a, k) =>
            sentAlready(a.at, a.said) ? SENT_NOTE
            : `<button class="btn${k === 0 ? " primary" : ""}" data-act="${i}:${k}">${
              esc(a.words)}</button>`).join("")}</span>`
        : f.target ? `<button class="go btn${f.waits ? " primary" : ""}" data-f="${i}">${
            esc(f.waits || actionLabel(f))}</button>` : ""}
    </div>`;
  const shown = waiting.slice(0, 4);
  const held = knowing.length
    ? `<details class="sub" data-sub="knowing" ${subOpen.knowing ? "open" : ""}>
        <summary><span>Worth knowing about this project</span>
        <span class="held">${knowing.length}</span></summary>
        <div class="subinner">${knowing.map((f, i) => row(f, waiting.length + i)).join("")}</div>
      </details>`
    : "";
  eyes.innerHTML = (waiting.length
    ? `<div class="eyes-head"><h2>Waiting on you</h2><span>${
        waiting.length === 1 ? "One thing" : `${waiting.length} things`} to do.</span></div>`
      + shown.map((f, i) => row(f, i)).join("")
      + (waiting.length > shown.length
        ? `<div class="more-findings">${waiting.length - shown.length} more below.</div>` : "")
    : `<div class="eyes-head"><h2>Waiting on you</h2><span>Nothing right now.</span></div>
       <div class="calm">Every question this stage needs is answered. Every comment has a
       reply. The shape below is one you agreed to.</div>`) + held;
  eyes.querySelectorAll("details.sub").forEach(d =>
    d.addEventListener("toggle", () => { subOpen[d.dataset.sub] = d.open; }));
  eyes.onclick = e => {
    const every = waiting.concat(knowing);
    const act = e.target.closest("[data-act]");
    if (act) {
      const [which, k] = act.dataset.act.split(":").map(Number);
      oneClick(every[which].actions[k]);
      return;
    }
    const b = e.target.closest(".go"); if (!b || b.dataset.f === undefined) return;
    goTo(every[+b.dataset.f].target);
  };
}

/* ---------- pipeline tabs ---------- */
function drawTabs() {
  const tabs = document.getElementById("pipetabs");
  if (DECLARED.length <= 1) { tabs.hidden = true; return; }
  tabs.hidden = false;
  tabs.innerHTML = DECLARED.map(p => `
    <button class="pipetab" data-p="${esc(p.name)}" aria-current="${p.name === currentPipe}">
      <span>${esc(p.name)}</span>

}

/* ---------- system map ---------- */
/* What one pipeline moves through one store, per run of that pipeline.

   Per run rather than as a total: a total draws its thickest line for the pipeline that ran
   most often, which is a fact about how often it ran and not about how much it leans on the
   store. The total is on the store's own card. */
function flowBetween(pipeName, resource) {
  const held = (resource.flow || {})[pipeName];
  if (!held) return {total: 0, per_run: 0, runs: 0};
  const p = DECLARED.find(x => x.name === pipeName);
  const over = p ? populationOf(p) : null;
  const total = held[population === "rollouts" ? "rollouts" : "runs"] || 0;
  const runs = over ? over.runs : 0;
  return {total, per_run: runs ? total / runs : 0, runs};
}

/* Every store this project reaches, with the pipelines that touch it and how they do. One
   entry per link, which is what the drawing measures. */
function systemLinks() {
  const links = [];
  (DATA.resources || []).forEach(r => {
    const seen = {};
    const add = (where, kind) => {
      const pipe = where.split("/")[0];
      if (!seen[`${pipe}|${kind}`]) { seen[`${pipe}|${kind}`] = true; links.push({r, pipe, kind}); }
    };
    (r.writers || []).forEach(w => add(w, "writes"));
    (r.readers || []).forEach(w => add(w, "reads"));
    (r.unknown || []).forEach(w => add(w, "unknown"));
  });
  return links;
}

/* One pipeline's figure for the selected measure: its steps' summed, which is what the box's
   bar carries. */
function pipelineMeasure(p) {
  const over = populationOf(p);
  if (!over) return {value: 0, words: ""};
  const value = Object.values(over.nodes || {})
    .reduce((total, held) => total + valueOf(held, measure), 0);
  if (!value) return {value: 0, words: ""};
  if (measure === "cost") {
    const basis = soleBasis(over) || "";
    return {value, words: basis.indexOf("device-seconds") === 0
      ? `${value.toLocaleString("en-US", {maximumFractionDigits: 1})} s`
      : rate(value, basis)};
  }
  if (measure === "ms") return {value, words: `${fmt(Math.round(value))} ms`};
  if (measure === "model_calls") return {value, words: `${fmt(value)} calls`};
  return {value, words: `${fmt(value)} items`};
}

/* The two controls, over every declared pipeline rather than over one. They set the same
   state the pipeline level's do, so the page shows one thing at a time and says so once. */
function drawSystemDials() {
  const holder = document.getElementById("sysdials");
  const populations = [];
  if (DECLARED.some(p => (p.over_runs || {}).runs)) {
    const runs = DECLARED.reduce((a, p) => a + ((p.over_runs || {}).runs || 0), 0);
    populations.push(["runs", `Your runs · ${fmt(runs)}`]);
  }
  if (DECLARED.some(p => (p.over_rollouts || {}).runs)) {
    const runs = DECLARED.reduce((a, p) => a + ((p.over_rollouts || {}).runs || 0), 0);
    populations.push(["rollouts", `The evaluation · ${fmt(runs)}`]);
  }
  if (populations.length && !populations.some(([key]) => key === population)) {
    population = populations[0][0];
  }
  const usable = MEASURES.filter(([key]) => DECLARED.some(p => {
    const over = populationOf(p);
    if (!over || (key === "cost" && !soleBasis(over))) return false;
    return Object.values(over.nodes || {}).some(n => valueOf(n, key) > 0);
  }));
  // A measure no pipeline can fill leaves every bar empty, so the drawing moves to one that
  // can. The pipeline level narrows this again for the pipeline on screen.
  if (usable.length && !usable.some(([key]) => key === measure)) measure = usable[0][0];
  const parts = [];
  if (populations.length > 1) {
    parts.push(`<div class="dial"><span>over</span>${populations.map(([key, words]) =>
      `<button data-syspop="${esc(key)}" aria-pressed="${key === population}">${esc(words)}</button>`
    ).join("")}</div>`);
  } else if (populations.length === 1) {
    parts.push(`<div class="dial"><span>over</span><span style="color:var(--muted)">${
      esc(populations[0][1])}</span></div>`);
  }
  if (usable.length) {
    parts.push(`<div class="dial"><span>the bar is</span>${usable.map(([key, words]) =>
      `<button data-sysmeasure="${esc(key)}" aria-pressed="${key === measure}">${esc(words)}</button>`
    ).join("")}</div>`);
  }
  holder.innerHTML = parts.join("");
  holder.querySelectorAll("[data-syspop]").forEach(b => b.addEventListener("click", () => {
    population = b.dataset.syspop; drawSystem(); drawGraph();
  }));
  holder.querySelectorAll("[data-sysmeasure]").forEach(b => b.addEventListener("click", () => {
    measure = b.dataset.sysmeasure; drawSystem(); drawGraph();
  }));
}

function drawSystem() {
  const holder = document.getElementById("system");
  const RES = DATA.resources || [];
  if (DECLARED.length <= 1) { holder.hidden = true; return; }
  holder.hidden = false;
  drawSystemDials();
  const svg = document.getElementById("sysmap");
  svg.innerHTML = "";
  /* A bar is drawn only where the record can fill one, so a project at `shape` gets the box
     it had before rather than an empty strip under every name. */
  const bars = DECLARED.map(p => pipelineMeasure(p));
  const biggest = Math.max(0, ...bars.map(b => b.value));
  const SYSBAR = biggest > 0 ? 16 : 0;
  const PW = 190, PH = 64 + SYSBAR, RW = 150, RH = 40, GX = 26, PAD = 12, ROWGAP = 74;
  /* The width the panel actually has, rather than a number written here. A wider window is
     spent on the drawing, and a store row that will not fit wraps like a pipeline row does:
     nine stores on one unwrapped row put four of them outside the frame, where nothing drew
     them at all. */
  const panel = svg.parentElement ? svg.parentElement.clientWidth - 36 : 1180;
  const room = Math.max(560, Math.min(panel || 1180, 1560));
  const perRow = Math.max(1, Math.floor((room + GX) / (PW + GX)));
  const resPerRow = Math.max(1, Math.floor((room + GX) / (RW + GX)));
  const rows = Math.ceil(DECLARED.length / perRow);
  const resRows = Math.ceil(RES.length / resPerRow);

  /* Where a store sits is chosen, not given: put each under the middle of whatever touches
     it and the links stop crossing each other. One barycentre pass, which is the cheap half
     of what a layered graph drawing does, and it halves the crossings on a real system. */
  const order = RES.map((r, i) => {
    const touching = [...(r.readers || []), ...(r.writers || []), ...(r.unknown || [])]
      .map(w => DECLARED.findIndex(p => p.name === w.split("/")[0]))
      .filter(k => k >= 0);
    const mid = touching.length
      ? touching.reduce((a, b) => a + (b % perRow), 0) / touching.length : i;
    return {r, mid, i};
  }).sort((a, b) => a.mid - b.mid || a.i - b.i).map(one => one.r);

  const widest = Math.max(
    ...Array.from({length: rows}, (_, k) =>
      Math.min(DECLARED.length - k * perRow, perRow) * (PW + GX) - GX),
    ...Array.from({length: resRows}, (_, k) =>
      Math.min(RES.length - k * resPerRow, resPerRow) * (RW + GX) - GX),
    0);
  const W = PAD * 2 + widest;
  const H = PAD * 2 + rows * PH + (rows - 1) * 16
    + (resRows ? ROWGAP + resRows * RH + (resRows - 1) * 14 : 0);
  svg.setAttribute("viewBox", `0 0 ${W} ${H}`);
  svg.style.maxWidth = W + "px";
  svg.style.margin = "0 auto";
  const pos = {}, rpos = {};
  DECLARED.forEach((p, i) => {
    const row = Math.floor(i / perRow), col = i % perRow;
    const across = Math.min(DECLARED.length - row * perRow, perRow);
    const left = (W - (across * (PW + GX) - GX)) / 2;
    pos[p.name] = { x: left + col * (PW + GX), y: PAD + row * (PH + 16) };
  });
  const resTop = PAD + rows * PH + (rows - 1) * 16 + ROWGAP;
  order.forEach((r, i) => {
    const row = Math.floor(i / resPerRow), col = i % resPerRow;
    const across = Math.min(RES.length - row * resPerRow, resPerRow);
    const left = (W - (across * (RW + GX) - GX)) / 2;
    rpos[r.name] = { x: left + col * (RW + GX), y: resTop + row * (RH + 14) };
  });
  const defs = el("defs", {});
  const mk = (id, orient) => {
    /* In user space, so every head is one size. Left in the default units a head is a
       multiple of its line's width, and edge width here means traffic: the busiest link grew
       a head about four times the size of the quietest one's. */
    const m = el("marker", {id, viewBox: "0 0 8 8", refX: 7.5, refY: 4, markerWidth: 9,
      markerHeight: 9, markerUnits: "userSpaceOnUse", orient});
    m.appendChild(el("path", {d: "M0 0 L8 4 L0 8 z", fill: css("--edge")}));
    defs.appendChild(m);
  };
  mk("sysarrow", "auto"); mk("sysarrow-back", "auto-start-reverse");
  svg.appendChild(defs);
  /* A link's width is how much that pipeline moves through that store in one of its runs,
     so the busiest path through the system draws itself. A link the record says nothing
     about is the hairline it was, rather than a line claiming nothing goes along it. */
  const links = systemLinks().filter(one => pos[one.pipe] && rpos[one.r.name]);
  const flows = links.map(one => flowBetween(one.pipe, one.r));
  const heaviest = Math.max(0, ...flows.map(f => f.per_run));
  /* Where the pipelines wrap onto more than one row, a link out of an upper row passes
     behind the boxes below it, and on a real system there are enough links that following
     one is work whether they cross or not. So the selected pipeline's links are drawn at
     full strength and the rest are held back: the shape of the whole system stays on the
     page, and the one being read is traceable through it. Drawing them on one row instead
     removes every crossing and makes the map 1,726px wide, which is a different loss. */
  const crowded = links.length > 8;
  links.forEach((one, i) => {
    const from = pos[one.pipe], to = rpos[one.r.name], flow = flows[i];
    const x1 = from.x + PW / 2, y1 = from.y + PH, x2 = to.x + RW / 2, y2 = to.y;
    const width = heaviest > 0 && flow.per_run > 0
      ? 1.2 + 4.8 * (flow.per_run / heaviest)
      : 1.4;
    const mine = one.pipe === currentPipe;
    const path = el("path", {
      d: `M${x1} ${y1} C ${x1} ${y1 + 26}, ${x2} ${y2 - 26}, ${x2} ${y2}`,
      fill: "none", stroke: css(flow.per_run > 0 ? "--edge" : "--edge-soft"),
      "stroke-width": mine && crowded ? width + 0.8 : width,
      opacity: crowded && !mine ? 0.32 : 1,
      "stroke-dasharray": one.kind === "unknown" ? "4 4" : "",
      "marker-end": one.kind === "writes" ? "url(#sysarrow)" : "",
      "marker-start": one.kind === "reads" ? "url(#sysarrow-back)" : "",
      style: "cursor:pointer",
    });
    const said = flow.total
      ? `${one.pipe} ${one.kind === "writes" ? "writes" : one.kind === "reads" ? "reads" : "touches"} `
        + `${one.r.name}: ${flow.per_run.toLocaleString("en-US", {maximumFractionDigits: 1})} `
        + `a run, ${fmt(flow.total)} in all`
      : `${one.pipe} touches ${one.r.name}; the record holds no access`;
    const tip = el("title", {}); tip.textContent = said; path.appendChild(tip);
    path.addEventListener("click", () => showResource(one.r.name));
    svg.appendChild(path);
  });
  DECLARED.forEach(p => {
    const {x, y} = pos[p.name];
    const g = el("g", {tabindex: 0, role: "button", "aria-label": p.name, style: "cursor:pointer"});
    const chosen = p.name === currentPipe;
    g.appendChild(el("rect", {x, y, width: PW, height: PH, rx: 9,
      fill: chosen ? css("--accent-soft") : css("--surface"),
      stroke: chosen ? css("--accent") : css("--line-strong"),
      "stroke-width": chosen ? 1.6 : 1,
      "stroke-dasharray": p.status === "planned" ? "5 4" : ""}));
    const t1 = el("text", {x: x + 14, y: y + 26, fill: css("--ink"),
      "font-family": "Archivo, sans-serif", "font-size": 15, "font-weight": 600});
    t1.textContent = p.name; g.appendChild(t1);
    const planned = p.nodes.filter(n => n.planned).length;
    const t2 = el("text", {x: x + 14, y: y + 46, fill: css("--muted"),
      "font-family": '"JetBrains Mono", monospace', "font-size": 12});
    const sub = `${p.nodes.length} step${p.nodes.length === 1 ? "" : "s"}`
      + (planned ? ` · ${planned} to build` : "")
      + (p.runs ? ` · ran ${fmt(p.runs.runs)}×` : "");
    t2.textContent = clip(sub, Math.floor((PW - 28) / 7.3));
    g.appendChild(whole(t2, sub));
    if (SYSBAR && populationOf(p)) {
      const held = bars[DECLARED.indexOf(p)];
      const by = y + PH - 11, track = PW - 28 - 76;
      g.appendChild(el("rect", {x: x + 14, y: by, width: track, height: 5, rx: 2.5,
        fill: css("--sunk")}));
      if (held.value > 0) {
        g.appendChild(el("rect", {x: x + 14, y: by,
          width: Math.max(2, track * (held.value / biggest)), height: 5, rx: 2.5,
          fill: css(held.value === biggest ? "--accent" : "--line-strong")}));
      }
      const v = el("text", {x: x + PW - 14, y: by + 5.5, fill: css("--muted"),
        "text-anchor": "end", "font-family": '"JetBrains Mono", monospace', "font-size": 11.5});
      v.textContent = held.words;
      g.appendChild(v);
    }
    let bx = x + PW - 18;
    if (p.nodes.some(n => n.asks_a_person)) {
      const c = el("circle", {cx: bx, cy: y + 16, r: 5, fill: css("--accent")});
      const tt = el("title", {}); tt.textContent = "can ask a person";
      c.appendChild(tt); g.appendChild(c); bx -= 14;
    }
    if (p.nodes.some(n => n.tools.some(t => t.effect === "spends_money"))) {
      const c = el("circle", {cx: bx, cy: y + 16, r: 5, fill: css("--note")});
      const tt = el("title", {}); tt.textContent = "can spend money";
      c.appendChild(tt); g.appendChild(c);
    }
    if (openAt(p.name).length) {
      g.appendChild(el("circle", {cx: x + 8, cy: y + 8, r: 4, fill: css("--attention")}));
    }
    g.addEventListener("click", () => { selectPipe(p.name); select(p.name, `the ${p.name} pipeline`); });
    g.addEventListener("keydown", e => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); selectPipe(p.name); } });
    svg.appendChild(g);
  });
  RES.forEach(r => {
    const {x, y} = rpos[r.name];
    const g = el("g", {tabindex: 0, role: "button", "aria-label": r.name, style: "cursor:pointer"});
    g.appendChild(el("rect", {x, y, width: RW, height: RH, rx: 20,
      fill: css("--sunk"), stroke: css("--line-strong")}));
    const t = el("text", {x: x + RW / 2, y: y + 25, fill: css("--muted"), "text-anchor": "middle",
      "font-family": '"JetBrains Mono", monospace', "font-size": 13});
    t.textContent = r.name; g.appendChild(t);
    if (openAt(`resource:${r.name}`).length) {
      g.appendChild(el("circle", {cx: x + 8, cy: y + 8, r: 4, fill: css("--attention")}));
    }
    g.addEventListener("click", () => showResource(r.name));
    g.addEventListener("keydown", e => {
      if (e.key === "Enter" || e.key === " ") { e.preventDefault(); showResource(r.name); }
    });
    svg.appendChild(g);
  });
  const said = [];
  if (SYSBAR) said.push(`The bar is ${measureWords()} across each pipeline's steps.`);
  if (heaviest > 0) {
    said.push("A thicker line means more of that store is moved in one run of that pipeline; "
      + "the totals are on the store's card.");
  }
  if (crowded) {
    said.push(`${currentPipe}'s links are drawn full strength and the rest are held back. `
      + "Select another pipeline to follow its own.");
  }
  document.getElementById("sysnote").textContent = said.join(" ");
}

/* ---------- pipeline graph ---------- */
const CW = 240, CH = 96, GX = 18, GY = 58, PAD = 12, SIDE = 46, LINE = 15, VOL = 18;
const TILE = 32;                     // the glyph tile at the left of every step
const BAR = 18;                      // the measure strip at the foot of a step
const GUTTER = 150;                  // the column the stores sit in, right of the graph
/* The rail's width, matching the stylesheet's clamp(320px, 24%, 440px): a laptop gives it
   320px and a wide desktop up to 440px, since a step card has more to say than a drawing
   one column wide. */
const railWidth = mapWidth => Math.min(440, Math.max(320, mapWidth * 0.24));
const COLS = 29;                     // characters that fit across a node at this width
/* A step's name shares its line with the affordance that opens the step, so its budget is
   what the box has left after that. It was truncated at 22 characters against room for 12,
   and every name longer than that drew on top of the words beside it. */
const NAME_COLS = 16;

/* Text a box cannot hold, cut where a reader would cut it. It was cut at the character, so
   `ticket 72 characters → tick…` lost a word halfway through; this backs up to the last
   space or separator when one is near the end. What was cut is on the element as a title,
   so the whole of it is a hover away. */
function clip(text, cols) {
  const words = String(text);
  if (words.length <= cols) return words;
  const cut = words.slice(0, cols - 1);
  const brk = Math.max(cut.lastIndexOf(" "), cut.lastIndexOf("·"), cut.lastIndexOf("→"));
  return (brk > cols * 0.55 ? cut.slice(0, brk) : cut).trimEnd() + "…";
}
/* Say on the element what was cut off it. */
function whole(node, text) {
  if (node.textContent !== String(text)) {
    const full = el("title", {});
    full.textContent = text;
    node.appendChild(full);
  }
  return node;
}
let expanded = null;                 // the one node drawn open, by id
let measure = "cost";                // what the bar in each step carries
let population = "runs";             // whose runs the bar and the edges are over

/* The kind glyphs. One frame, one tile, a mark per kind, drawn rather than written: a mark
   inherits the page's ink, prints, and is the same on every machine. They are a family on
   purpose — code, then a model, then a model that goes round again — so the vocabulary is
   learned from the key rather than memorised. Every path is on a 20x20 grid. */
const GLYPHS = {
  deterministic: {
    words: "plain code",
    draw: g => {
      g.push(el("path", {d: "M9 3.5 C6.4 3.5 8 9 5 10 C8 11 6.4 16.5 9 16.5",
        fill: "none", "stroke-width": 1.5, "stroke-linecap": "round"}));
      g.push(el("path", {d: "M11 3.5 C13.6 3.5 12 9 15 10 C12 11 13.6 16.5 11 16.5",
        fill: "none", "stroke-width": 1.5, "stroke-linecap": "round"}));
    },
  },
  llm: {
    words: "one model call",
    draw: g => {
      g.push(el("path", {d: "M5.5 6 L14.5 10 M5.5 14 L14.5 10", fill: "none",
        "stroke-width": 1.2}));
      [[5.5, 6], [5.5, 14]].forEach(([cx, cy]) =>
        g.push(el("circle", {cx, cy, r: 2, fill: "currentColor", stroke: "none"})));

/* One glyph, drawn into a group the caller places. `tone` is the token its ink comes from. */
function glyph(kind, x, y, tone, size) {
  const held = GLYPHS[kind] || GLYPHS.deterministic;
  const scale = (size || 20) / 20;
  const g = el("g", {transform: `translate(${x} ${y}) scale(${scale})`,
    stroke: css(tone || "--muted"), color: css(tone || "--muted")});
  const parts = [];
  held.draw(parts);
  parts.forEach(part => g.appendChild(part));
  return g;
}

/* Edges that go down the page. A cycle's closing edge is drawn and never ranked, or the two
   steps in it push each other down for as many passes as there are steps. */
function forward(n) {
  const back = new Set(n.closes_a_cycle || []);
  return (n.successors || []).concat(n.on_error ? [n.on_error] : [])
    .filter(s => !back.has(s));
}
function ranks(nodes) {
  const byId = Object.fromEntries(nodes.map(n => [n.id, n]));
  const rank = {}; nodes.forEach(n => rank[n.id] = 0);
  for (let pass = 0; pass < nodes.length; pass++) {
    let moved = false;
    nodes.forEach(n => forward(n).forEach(s => {
      if (byId[s] && rank[s] <= rank[n.id]) { rank[s] = rank[n.id] + 1; moved = true; }
    }));
    if (!moved) break;
  }
  return rank;
}
/* A column per step, on one grid: a step sits under the steps that feed it, and a step inside
   a nested pipeline sits under the one before it, so the frame around them is a tight box. */
function columns(nodes, rank) {
  const byId = Object.fromEntries(nodes.map(n => [n.id, n]));
  const feeders = {}; nodes.forEach(n => feeders[n.id] = []);
  nodes.forEach(n => forward(n).forEach(s => { if (byId[s]) feeders[s].push(n.id); }));
  const depth = Math.max(...nodes.map(n => rank[n.id])) + 1;
  const col = {};
  for (let r = 0; r < depth; r++) {
    const here = nodes.filter(n => rank[n.id] === r);
    const wanted = here.map((n, i) => {
      const above = feeders[n.id].map(f => col[f]).filter(c => c !== undefined);
      const mid = above.length ? above.reduce((a, b) => a + b, 0) / above.length : i;
      return {n, mid};
    }).sort((a, b) => a.mid - b.mid || nodes.indexOf(a.n) - nodes.indexOf(b.n));
    const taken = new Set();
    wanted.forEach(({n, mid}) => {
      let c = Math.round(mid);
      for (let step = 0; taken.has(c); step++) {
        c = Math.round(mid) + (step % 2 ? -Math.ceil((step + 1) / 2) : Math.ceil((step + 1) / 2));
      }
      taken.add(c); col[n.id] = c;
    });
  }
  const least = Math.min(...Object.values(col));
  nodes.forEach(n => col[n.id] -= least);
  return col;
}
function budgetWords(b) {
  if (!b) return "";
  const parts = [];
  if (b.max_steps != null) parts.push(`${fmt(b.max_steps)} model calls`);
  if (b.max_tokens != null) parts.push(`${fmt(b.max_tokens)} tokens`);
  if (b.max_cost != null) parts.push(`$${Number(b.max_cost).toLocaleString("en-US",
    {minimumFractionDigits: 2, maximumFractionDigits: 2})}`);
  if (b.max_wall_clock_ms != null) parts.push(`${fmt(b.max_wall_clock_ms)} ms`);
  return parts.length ? "each run stops at " + parts.join(" · ") : "no limits declared";
}
function wrap(text, cols) {
  const words = String(text ?? "").split(/\s+/).filter(Boolean);
  const lines = []; let line = "";
  words.forEach(w => {
    if (!line.length) { line = w; return; }
    if ((line + " " + w).length <= cols) { line += " " + w; return; }
    lines.push(line); line = w;
  });
  if (line.length) lines.push(line);
  return lines.length ? lines : [""];
}
function ran(n) {
  if (!n.ran) return null;
  if (n.ran.executions) return `Ran ${fmt(n.ran.executions)}× · ${fmt(Math.round(n.ran.ms))} ms`;
  if (n.ran.skipped) return "The run did not reach it";
  return "Did not run";
}
/* Every fact the open node shows, as label/value rows. The rail card holds the rest. */
function openRows(n, p) {
  const out = [];
  const takes = n.takes_in || {};
  out.push(["Takes in", takes.says || "—"]);
  const fields = (n.produces && n.produces.fields || []).map(f => f.name);
  out.push(["Produces", n.produces
    ? n.produces.name + (fields.length ? ` (${fields.slice(0, 6).join(", ")})` : "")
    : n.planned ? "not settled yet" : "plain data"]);
  if (n.tools.length) {
    out.push(["Tools", n.tools.map(t => t.name + (
      t.asks ? " (asks a person)" :
      t.effect === "spends_money" ? ` (${t.cost_per_call != null ? "$" + t.cost_per_call : "costs money"})` :
      t.effect === "read_only" ? " (reads)" :
      t.effect === "irreversible" ? " (permanent write)" : " (writes)")).join(", ")]);
  }
  if (n.touches.length) out.push(["Touches", n.touches.join(", ")]);
  const goes = [];
  if (n.successors.length > 1) goes.push((n.routes ? "chooses between " : "goes to ") + n.successors.join(", "));
  if (n.loop) goes.push(`back to ${n.loop.then === n.id ? "itself" : n.successors[0]} up to ${n.loop.back_for}×, then ${n.loop.then}`);
  if (n.on_error) goes.push(`if it fails, ${n.on_error}`);
  if (n.retries) goes.push(`${n.retries} attempts`);
  if (goes.length) out.push(["Where it goes", goes.join(" · ")]);
  const limits = budgetWords(n.budget);
  if (limits) out.push(["Limits", cap(limits)]);
  if (n.model) out.push(["Model", n.model]);
  const last = ran(n);
  if (last) out.push(["Last run", last]);
  const m = n.measured;
  if (m) {
    const bits = [`reached ${rate(m.reach, "rate")} of rollouts`];
    if (m.model_calls) bits.push(`${fmt(m.model_calls)} model calls`);
    if (m.cost != null) bits.push(`cost ${rate(m.cost, m.cost_currency)}`);
    if (m.tool_spend != null) bits.push(`tools spent ${rate(m.tool_spend, m.tool_spend_currency)}`);
    if (m.accuracy && m.accuracy.point != null) bits.push(`accuracy ${rate(m.accuracy.point, "rate")}`);
    if (m.errors) bits.push(`${fmt(m.errors)} errors`);
    out.push(["Measured", bits.join(" · ")]);
  }
  const ex = n.example;
  if (ex && ex.took_in_volume) {
    out.push(["How much moved", `${ex.took_in_volume} in, ${ex.handed_on_volume} out`]);
  }
  if (ex && !ex.too_large && (ex.took_in || []).length) {
    const first = ex.took_in[0];
    out.push(["One real value", (first.key ? first.key + ": " : "") + first.value]);
  }
  if (n.planned) out.push(["Will", n.does || ""]);
  return out;
}
function openHeight(n, p) {
  return openRows(n, p).reduce((a, [, v]) => a + (wrap(v, COLS).length + 1) * LINE, 0) + 14;
}

function drawPipeMeta(p) {
  const meta = document.getElementById("pipemeta");
  if (!p) { meta.innerHTML = ""; return; }
  const moving = DATA.running;
  let banner = "";
  if (moving && moving.pipeline === p.name) {
    const done = Object.values(moving.done || {}).filter(d => d.executions).length;
    const figs = [`Started ${ago(moving.started_at)}`,
      `${done} step${done === 1 ? "" : "s"} done`];
    if (moving.calls_in_flight) figs.push(`${moving.calls_in_flight} model call${
      moving.calls_in_flight === 1 ? "" : "s"} in flight`);
    if (moving.evaluation) {
      const ev = moving.evaluation;
      figs.push(ev.total
        ? `${ev.rollouts_done} of ${ev.total} rollouts scored`
        : `${ev.rollouts_done} rollouts finished so far`);
      /* A figure over what has landed is provisional, and says its n; the runner declared
         the total and estimates the time left from its own rate, so neither is invented. */
      if (ev.total && ev.rollouts_done && ev.scored_right !== null) {
        figs.push(`${Math.round(100 * ev.scored_right / ev.rollouts_done)}% right so far (n=${
          ev.rollouts_done}, provisional)`);
      }
      if (ev.cost !== null && ev.cost !== undefined && ev.currency) {
        figs.push(`${esc(rate(ev.cost, ev.currency))} spent`);
      }
      if (ev.remaining_s) figs.push(`about ${Math.max(1, Math.round(ev.remaining_s / 60))} min left`);
    }
    banner = `<div class="runbanner"><span class="pulse-dot">●</span>
      <b>${moving.evaluation ? "An evaluation is moving through" : "A run is moving through"} ${esc(p.name)}</b>
      <span class="figs">${figs.map(esc).join(" · ")}</span></div>`;
  }
  const bits = [`<b>${esc(p.name)}</b>`];
  if (p.status !== "built") bits.push(esc(cap(p.status)));
  bits.push(esc(cap(budgetWords(p.budget))));
  if (p.runs) {
    bits.push(`Ran ${fmt(p.runs.runs)}×`);
    if (p.runs.code_moved_since) bits.push(`<span class="badge warn">Code changed since its last run</span>`);
  }
  if (p.shape_moved === true) {
    bits.push(`<span class="badge warn">Changed since you agreed to it</span>`);
  } else if (p.shape_moved === false) {
    bits.push(`<span class="badge acc">Still the shape you agreed to</span>`);
  } else {
    bits.push(`<span class="badge mut">Proposed · you have not agreed to it yet</span>`);
  }

      && DATA.measured.headline.point != null) {
    bits.push(`Measured ${esc(rate(DATA.measured.headline.point, DATA.measured.headline.unit))} ${
      esc(DATA.measured.headline.name)}`);
  }
  meta.innerHTML = banner + bits.join('<span style="color:var(--line-strong)">·</span>');

/* Which runs the drawing is over. The project's own and an evaluation's rollouts answer
   different questions and are never mixed, so the page shows one and says which. */
function populationOf(p) {
  const held = population === "rollouts" ? p.over_rollouts : p.over_runs;
  return held && held.runs ? held : null;
}
function populationsFor(p) {
  const found = [];
  if (p.over_runs && p.over_runs.runs) found.push(["runs", `Your runs · ${fmt(p.over_runs.runs)}`]);
  if (p.over_rollouts && p.over_rollouts.runs) {
    found.push(["rollouts", `The evaluation · ${fmt(p.over_rollouts.runs)}`]);
  }
  return found;
}

/* One basis or none: two runs priced in dollars and device-seconds cannot share a bar, so
   where a shape holds both the cost measure says so instead of adding them. */
function soleBasis(over) {
  return over && (over.bases || []).length === 1 ? over.bases[0] : null;
}

const MEASURES = [
  ["cost", "What it cost"],
  ["ms", "How long it took"],
  ["model_calls", "Model calls"],
  ["items", "Items handled"],
];

function measuresFor(p) {
  const over = populationOf(p);
  if (!over) return [];
  return MEASURES.filter(([key]) => {
    if (key === "cost" && !soleBasis(over)) return false;
    return Object.values(over.nodes || {}).some(n => valueOf(n, key) > 0);
  });
}

function nodesInFocus(p) {
  if (!graphFocus || !currentStep) return p.nodes;
  const shown = new Set([currentStep]);
  const selectedNode = p.nodes.find(n => n.id === currentStep);
  if (selectedNode) {
    forward(selectedNode).forEach(id => shown.add(id));
  }
  p.nodes.forEach(node => {
    if ((node.successors || []).includes(currentStep) || node.on_error === currentStep) {
      shown.add(node.id);
    }
  });
  return p.nodes.filter(node => shown.has(node.id));
}

function valueOf(held, key) {
  if (!held) return 0;
  if (key === "cost") {
    const money = Object.values(held.cost_by_basis || {}).reduce((a, b) => a + b, 0);
    const spent = Object.values(held.spend_by_currency || {}).reduce((a, b) => a + b, 0);
    return money + spent;
  }
  return held[key] || 0;
}

/* One step's figure for the selected measure, and the same figure written out. A bar with no
   number beside it is a claim the reader cannot check. */
function measureOf(n) {
  const p = DECLARED.find(x => x.name === currentPipe);
  const over = p ? populationOf(p) : null;
  const held = over ? (over.nodes || {})[n.id] : null;
  const value = valueOf(held, measure);
  if (!value) return {value: 0, words: ""};
  if (measure === "cost") {
    const basis = soleBasis(over) || "";
    const written = basis && basis.indexOf("device-seconds") === 0
      ? `${value.toLocaleString("en-US", {maximumFractionDigits: 1})} s`
      : rate(value, basis);
    return {value, words: written};
  }
  if (measure === "ms") return {value, words: `${fmt(Math.round(value))} ms`};
  if (measure === "model_calls") return {value, words: `${fmt(value)} calls`};
  return {value, words: `${fmt(value)} items`};
}

/* The selected measure as words inside a sentence, so "The bar is what it cost". */
function measureWords() {
  const held = MEASURES.find(([key]) => key === measure);
  const words = held ? held[1] : measure;
  return words.charAt(0).toLowerCase() + words.slice(1);
}

/* Every store this pipeline reaches, with the steps that touch it and how many accesses the
   record holds. Drawn beside the graph rather than in it: stores are not pipeline steps. */
function storesHere(p, nodes) {
  const found = {};
  (nodes || p.nodes || []).forEach(n => {
    const names = new Set(n.touches || []);
    (n.tools || []).forEach(t => (t.touches || []).forEach(name => names.add(name)));
    names.forEach(name => {
      const held = found[name] || (found[name] = {name, nodes: [], accesses: 0});
      held.nodes.push(n.id);
    });
  });
  const over = populationOf(p) || {};
  Object.values(found).forEach(held => {
    held.accesses = (over.access_counts || {})[held.name] || 0;
  });
  return Object.values(found).sort((a, b) => a.name < b.name ? -1 : 1);
}

/* What one edge says on the line. Short by construction: what it carries, and how often it
   was taken. Everything else opens when the edge is selected. */
function edgeLabel(n, target, took, back) {
  /* An arm the record has not counted is a dotted hairline and the key says what that means,
     so writing it on the arm as well said it a third time. It said it wrongly too: "never"
     reads as a route the design cannot take, rather than one no run has taken so far.

     Every arm out of one step carries the same value and the step's own card names it, so
     repeating that per arm wrote one word three times into one band. What tells the arms
     apart is which of them fired, and how often. */
  if (back && n.loop) {
    const bound = `up to ${n.loop.back_for}×`;
    return took ? `${bound} · ${fmt(took)}` : bound;
  }
  const carries = n.produces && n.produces.name ? n.produces.name : "";
  if ((n.successors || []).length > 1) return took ? fmt(took) : "";
  return carries || (took ? fmt(took) : "");
}

/* The two dials. The drawing answers whichever question they are pointed at, which is what
   makes one picture serve "what should I make cheaper" and "where do the runs go". */
function drawDials(p) {
  const holder = document.getElementById("dials");
  if (!p) { holder.innerHTML = ""; return; }
  const populations = populationsFor(p);
  const measures = measuresFor(p);
  if (population === "rollouts" && !populations.some(([k]) => k === "rollouts")) {
    population = "runs";
  }
  if (measures.length && !measures.some(([k]) => k === measure)) measure = measures[0][0];
  const parts = [];
  if (populations.length > 1) {
    parts.push(`<div class="dial"><span>over</span>${populations.map(([key, words]) =>
      `<button data-pop="${esc(key)}" aria-pressed="${key === population}">${esc(words)}</button>`
    ).join("")}</div>`);
  } else if (populations.length === 1) {
    parts.push(`<div class="dial"><span>over</span><span style="color:var(--muted)">${
      esc(populations[0][1])}</span></div>`);
  }
  if (measures.length) {
    parts.push(`<div class="dial"><span>bars show</span>${measures.map(([key, words]) =>
      `<button data-measure="${esc(key)}" aria-pressed="${key === measure}">${esc(words)}</button>`
    ).join("")}</div>`);
  }
  if (p.nodes.length > 4) {
    parts.push(`<div class="dial"><span>show</span><button data-focus="whole" aria-pressed="${!graphFocus}">Whole pipeline</button>
      <button data-focus="selected" aria-pressed="${graphFocus}">Selected step and links</button></div>`);
  }
  holder.innerHTML = parts.join("");
  holder.querySelectorAll("[data-pop]").forEach(b => b.addEventListener("click", () => {
    population = b.dataset.pop; drawGraph();
  }));
  holder.querySelectorAll("[data-measure]").forEach(b => b.addEventListener("click", () => {
    measure = b.dataset.measure; drawGraph();
  }));
  holder.querySelectorAll("[data-focus]").forEach(b => b.addEventListener("click", () => {
    graphFocus = b.dataset.focus === "selected"; drawGraph();
  }));
}

/* The key, holding only what this drawing actually uses. A legend naming shapes the project
   does not have is furniture. */
function drawKey(p, nodes, showsNever) {

    items.push(`<span class="keyitem">${inner}<span>${esc(cap(words))}</span></span>`);

    <rect x="1" y="3" width="24" height="14" rx="4" fill="none"
      stroke="${css("--line-strong")}" ${attrs}></rect>${extra || ""}</svg>`;

  const kinds = [...new Set(nodes.map(n => n.kind))];
  ["deterministic", "llm", "agent"].forEach(kind => {
    if (!kinds.includes(kind)) return;
    mark(`<svg width="22" height="22" viewBox="0 0 22 22">${glyphMarkup(kind)}</svg>`,
      GLYPHS[kind].words);
  });
  if ((p.containers || []).length) {
    mark(`<svg width="22" height="22" viewBox="0 0 22 22">${glyphMarkup("pipeline")}</svg>`,
      GLYPHS.pipeline.words);

  const dot = tok => `<svg width="14" height="14" viewBox="0 0 14 14"><circle cx="7" cy="7" r="5" fill="${css(tok)}"></circle></svg>`;
  if (nodes.some(n => n.asks_a_person)) mark(dot("--accent"), "can ask a person");
  if (nodes.some(n => n.tools.some(t => t.effect === "spends_money"))) mark(dot("--note"), "can spend money");
  if (nodes.some(n => n.tools.some(t => t.effect === "irreversible"))) mark(dot("--attention"), "can make a permanent change");
  if (nodes.some(n => n.measured && !n.measured.reached)) mark(dot("--faint"), "the evaluation never reached it");
  const over = populationOf(p);
  if (over) {
    mark(`<svg width="26" height="20" viewBox="0 0 26 20">
      <path d="M1 14 L25 14" stroke="${css("--edge")}" stroke-width="4"></path>
      <path d="M1 6 L25 6" stroke="${css("--edge")}" stroke-width="1.3"></path></svg>`,
      "thicker means more runs went that way");
    if (showsNever) {
      mark(`<svg width="26" height="20" viewBox="0 0 26 20"><path d="M1 10 L25 10"
        stroke="${css("--edge-soft")}" stroke-width="1.3" stroke-dasharray="2 4"></path></svg>`,
        "not taken yet");
    }
    if (measuresFor(p).length) {
      mark(`<svg width="26" height="20" viewBox="0 0 26 20">
        <rect x="1" y="8" width="24" height="5" rx="2.5" fill="${css("--sunk")}"></rect>
        <rect x="1" y="8" width="15" height="5" rx="2.5" fill="${css("--accent")}"></rect>
        </svg>`, `the bar is ${measureWords()}`);

/* One glyph as markup, for the key, which is HTML rather than the drawing's SVG. */
function glyphMarkup(kind) {
  const holder = document.createElementNS("http://www.w3.org/2000/svg", "svg");
  holder.appendChild(glyph(kind, 1, 1, "--muted"));
  return holder.innerHTML;
}

function countableEdges(p) {
  return (p.nodes || []).reduce(
    (total, n) => total + (n.successors || []).length + (n.on_error ? 1 : 0), 0);
}

/* A point on a cubic curve, so an edge's label sits on the edge rather than near it. */
function onCurve(x0, y0, x1, y1, x2, y2, x3, y3, t) {
  const u = 1 - t;
  const a = u * u * u, b = 3 * u * u * t, c = 3 * u * t * t, d = t * t * t;
  return {x: a * x0 + b * x1 + c * x2 + d * x3, y: a * y0 + b * y1 + c * y2 + d * y3};
}

function drawGraph() {
  const svg = document.getElementById("graph");
  svg.innerHTML = "";
  const p = DECLARED.find(x => x.name === currentPipe);
  document.getElementById("pipes-title").textContent =
    DECLARED.length > 1 ? "One pipeline at a time" : "The pipeline";
  drawPipeMeta(p);
  drawDials(p);
  if (!p) {
    document.getElementById("graphkey").innerHTML = "";
    const tall = DATA.code_error ? 116 : 90;
    svg.setAttribute("viewBox", `0 0 640 ${tall}`); svg.setAttribute("height", tall);
    const t = el("text", {x: 320, y: DATA.code_error ? 44 : 50, "text-anchor": "middle",
      fill: css("--muted"), "font-family": "Archivo, sans-serif", "font-size": 14});
    /* Three reasons the frame is empty, and they are not one fact. A project before its first
       line of code has no picture yet. One whose `agent.py` will not import has a picture the
       page could not read, and "registered: none" would blame it for declaring nothing. */
    t.textContent = DATA.code_error
      ? "agent.py could not be imported, so the picture is unread."
      : HISTORY.length
      ? "Registered pipelines: none. What has run is in the record below."
      : "The project has no pipeline yet. The picture starts with the first one.";
    svg.appendChild(t);
    if (DATA.code_error) {
      const why = el("text", {x: 320, y: 74, "text-anchor": "middle", fill: css("--attention"),
        "font-family": "'JetBrains Mono', monospace", "font-size": 12});
      why.textContent = short(DATA.code_error, 88).said;
      svg.appendChild(why);
      const more = el("text", {x: 320, y: 96, "text-anchor": "middle", fill: css("--faint"),
        "font-family": "Archivo, sans-serif", "font-size": 12});
      more.textContent = "The whole of it is under What the page could not read.";
      svg.appendChild(more);
    }
    return;
  }
  const nodes = nodesInFocus(p);
  if (expanded && !nodes.some(n => n.id === expanded)) expanded = null;
  const over = populationOf(p);
  const stores = storesHere(p, nodes);
  const measurable = nodes.some(n => measureOf(n).value > 0);
  const biggest = Math.max(0, ...nodes.map(n => measureOf(n).value));
  /* Every step in the drawing is the same height, so a row reads as a row. A step with no
     volume line and no figure keeps the space, which is itself the statement that it moved
     nothing and cost nothing. */
  const anyVolume = nodes.some(n => volumeLine(n));
  const barTop = measurable ? (CH + (anyVolume ? VOL : 0) - 2) : null;
  const rank = ranks(nodes);
  const col = columns(nodes, rank);
  const rows = {};
  nodes.forEach(n => (rows[rank[n.id]] = rows[rank[n.id]] || []).push(n));
  const depth = Math.max(...Object.keys(rows).map(Number)) + 1;
  const across = Math.max(...Object.values(col)) + 1;
  const W = PAD * 2 + across * (CW + GX) - GX + SIDE * 2 + (stores.length ? GUTTER : 0);
  const height = {};
  nodes.forEach(n => {
    const base = CH + (anyVolume ? VOL : 0) + (barTop !== null ? BAR : 0);
    height[n.id] = n.id === expanded ? base + openHeight(n, p) : base;
  });
  const rowTop = {}; let y = PAD;
  for (let r = 0; r < depth; r++) {
    rowTop[r] = y;
    y += Math.max(...(rows[r] || []).map(n => height[n.id]), CH) + GY;
  }
  const pos = {};
  nodes.forEach(n => pos[n.id] = {
    x: PAD + SIDE + col[n.id] * (CW + GX), y: rowTop[rank[n.id]],
  });

  /* The stores stack down the gutter beside the graph, and a pipeline can touch more of them
     than it has rows of steps. Their column is measured here so the frame is tall enough for
     it: a step reaching eight stores drew three of them below the bottom edge, where nothing
     showed them at all. */
  const column = storesHere(p)
    .map(store => ({store, touching: store.nodes.filter(id => pos[id])}))
    .filter(held => held.touching.length)
    .map(held => ({...held, want: Math.min(...held.touching.map(id => pos[id].y)) + 14}))
    .sort((a, b) => a.want - b.want);
  let stackedTo = 0;
  column.forEach(held => { stackedTo = Math.max(held.want, stackedTo) + 44; });

  const H = Math.max(y - GY, stackedTo - 10) + PAD;
  svg.setAttribute("viewBox", `0 0 ${W} ${H}`);
  /* The rail sits beside the drawing where the drawing fits beside it at full size, and
     under it otherwise: a graph four columns wide needs the whole width of a laptop, and a
     graph one column wide leaves most of it for the story and the card. */
  const map = document.getElementById("map");
  const beside = map.clientWidth - railWidth(map.clientWidth) - 18 - 36;
  map.classList.toggle("stacked", W > beside);
  const note = document.getElementById("scrollnote");
  const wrapper = document.querySelector(".graphwrap");
  const room = wrapper ? wrapper.clientWidth : W;
  /* Scaling the drawing scales its labels with it, and they are the smallest text on the
     page. A tenth is as far as that can go before they stop being readable at all, so below
     that the drawing keeps its size and scrolls, and says which it did. The layout above is
     what makes this rare: at every common screen width the whole graph fits unscaled. */
  const fits = W <= room;
  const scaled = !fits && room / W >= 0.9;
  svg.setAttribute("width", scaled ? room : W);
  svg.setAttribute("height", scaled ? H * (room / W) : H);
  svg.style.maxWidth = "none";
  note.textContent = graphFocus ? "Showing the selected step and its direct links. Switch to the whole pipeline to see every step."
    : fits ? ""
    : scaled ? `Scaled to ${Math.round((room / W) * 100)}% to fit the panel.`
    : "The graph is wider than the panel: it scrolls sideways.";
  const defs = el("defs", {});
  [["ar", "--edge"], ["ar-acc", "--accent"], ["ar-err", "--attention"],
   ["ar-faint", "--edge-soft"]].forEach(([id, tok]) => {
    const m = el("marker", {id, viewBox: "0 0 8 8", refX: 7.5, refY: 4, markerWidth: 10,
      markerHeight: 10, markerUnits: "userSpaceOnUse", orient: "auto"});
    m.appendChild(el("path", {d: "M0 0 L8 4 L0 8 z", fill: css(tok)}));
    defs.appendChild(m);
  });
  svg.appendChild(defs);

  /* Where a label has already been written. A route's arms stagger along their own curve, a
     failure path is placed from its own geometry and a frame writes its own name, so none of
     the three knew anything of the others and they wrote in the same place. Anything that
     would land on something already written steps down a line at a time until it is clear. */
  const written = [];
  const hits = (o, x, y, w, h) =>
    Math.abs(o.x - x) * 2 < o.w + w && Math.abs(o.y - y) * 2 < o.h + h;
  const STEPS = [0, 14, -14, 28, -28, 42, -42, 56, -56, 70, -70];
  const clearOf = (x, y, text) => {
    const w = String(text).length * 6.9, h = 13;
    /* The nearest free line either way, so a label pushed off one thing does not walk down
       the drawing when the room above it was empty. Two words on top of each other cannot be
       read at all and a word near a box can, so where nothing is clear of both, clearing the
       other labels wins. */
    const spot = STEPS.find(s => !written.some(o => hits(o, x, y + s, w, h)))
      ?? STEPS.find(s => !written.some(o => !o.box && hits(o, x, y + s, w, h)))
      ?? 0;
    y += spot;
    written.push({x, y, w, h});
    return y;
  };
  // Every step's own box, so a label is written across one only where there is nowhere else.
  nodes.forEach(n => written.push({
    x: pos[n.id].x + CW / 2, y: pos[n.id].y + height[n.id] / 2,
    w: CW, h: height[n.id], box: true,
  }));

  /* a pipeline used as a node is drawn as a frame around the steps inside it */
  (p.containers || []).forEach(c => {
    const inside = nodes.filter(n => n.inside === c.id || n.id.startsWith(c.id + "."));
    if (!inside.length) return;
    const x1 = Math.min(...inside.map(n => pos[n.id].x)) - 11;
    const x2 = Math.max(...inside.map(n => pos[n.id].x + CW)) + 13;
    /* The frame opens above its first step to carry its own name on one horizontal line.
       That name was set rotated up the left edge, where it crossed whichever edge label
       ran down beside it, and reading a caption sideways is work a reader should not be given. */
    const y1 = Math.min(...inside.map(n => pos[n.id].y)) - 30;
    const y2 = Math.max(...inside.map(n => pos[n.id].y + height[n.id])) + 13;
    svg.appendChild(el("rect", {x: x1, y: y1, width: x2 - x1, height: y2 - y1, rx: 12,
      fill: "none", stroke: css("--line"), "stroke-width": 1.2, "stroke-dasharray": "1 4"}));
    const t = el("text", {
      x: x1 + 13, y: y1 + 18, fill: css("--muted"),
      "font-family": '"JetBrains Mono", monospace', "font-size": 12});
    t.textContent = c.reached_by === "delegation"
      ? `${c.name} · a pipeline the model can call`
      : `${c.name} · a pipeline inside this one`;
    const words = t.textContent, wide = words.length * 6.9;
    written.push({x: x1 + 13 + wide / 2, y: y1 + 18, w: wide, h: 13});
    svg.appendChild(t);
  });

  const label = (x, y, text, tok, weight) => {
    y = clearOf(x, y, text);
    const t = el("text", {x, y, fill: css(tok || "--muted"), "text-anchor": "middle",
      "font-family": '"JetBrains Mono", monospace', "font-size": 11.5,
      "font-weight": weight || 400});
    t.textContent = text; svg.appendChild(t);
  };

  /* Edges carry how often they were taken, and the width is that number. The spine of the
     system draws itself: the arm most runs take is the thick one, and an arm nothing has
     ever taken is a dotted hairline. Square-rooted, or one edge at 2,423 against another at
     8 would be forty times the width rather than seventeen. */
  const weights = over ? (over.edges || {}) : {};
  const heaviest = Math.max(1, ...Object.values(weights));
  const strokeFor = w => w > 0 ? 1.1 + 3.3 * Math.sqrt(w / heaviest) : 1;
  /* An edge is countable when its source records which way it went. A nested pipeline's last
     step routes inside its own graph and the container it sits in writes no record of its
     own, so the edge out of that step is drawn without a count rather than as untaken.
     Reporting nothing of an edge nothing could have counted is the better of the two. */
  const routed = {};
  Object.keys(weights).forEach(name => {
    const from = name.split("->")[0];
    routed[from] = (routed[from] || 0) + weights[name];
  });
  const countable = id => {
    if (!over) return false;
    const held = (over.nodes || {})[id];
    return !!routed[id] || !(held && held.executions);
  };
  const everRan = !!over && over.runs > 0;

  nodes.forEach(n => {
    const a = pos[n.id]; if (!a) return;
    /* Two routes to one step are one arm: drawn twice they wrote the same count on top of
       itself. */
    const targets = [...new Set(n.successors || [])].filter(s => pos[s]);
    targets.forEach((s, arm) => {
      const b = pos[s];
      const back = b.y <= a.y;
      const took = weights[`${n.id}->${s}`] || 0;
      const never = everRan && !took && countable(n.id);
      let d, midx, midy;
      if (back) {
        const x1 = a.x + CW, y1 = a.y + height[n.id] / 2, x2 = b.x + CW, y2 = b.y + height[s] / 2;
        d = `M${x1} ${y1} C ${x1 + SIDE} ${y1}, ${x2 + SIDE} ${y2}, ${x2} ${y2}`;
        midx = Math.max(x1, x2) + SIDE * .78; midy = (y1 + y2) / 2;
      } else {
        const x1 = a.x + CW / 2, y1 = a.y + height[n.id], x2 = b.x + CW / 2, y2 = b.y;
        const g = GY * .7;
        d = `M${x1} ${y1} C ${x1} ${y1 + g}, ${x2} ${y2 - g}, ${x2} ${y2}`;
        // On the curve rather than between the two boxes: three arms leaving one step put
        // their labels in the same place otherwise, and each one sits on its own line here.
        const at = onCurve(x1, y1, x1, y1 + g, x2, y2 - g, x2, y2,
                           0.34 + (arm % 3) * 0.11);
        midx = at.x; midy = at.y + 4;
        /* Arms that leave straight down share an x; a long one passes behind the next box
           and its label landed on the shorter arm's. They are spread sideways. */
        const straight = targets.filter(t => pos[t].x === a.x).length;
        if (straight > 1 && x2 === x1) midx += (arm - (targets.length - 1) / 2) * 48;
      }
      svg.appendChild(el("path", {d, fill: "none", class: "gline", "data-edge": `${n.id}->${s}`,
        stroke: css(back ? "--accent" : never ? "--edge-soft" : "--edge"),
        "stroke-width": back ? Math.max(1.4, strokeFor(took)) : strokeFor(took),
        "stroke-dasharray": back ? "5 4" : never ? "2 4" : "",
        opacity: never ? .8 : 1,
        "marker-end": `url(#${back ? "ar-acc" : never ? "ar-faint" : "ar"})`}));
      const hit = el("path", {d, fill: "none", stroke: "transparent", "stroke-width": 18,
        class: "gedge", tabindex: 0, role: "button",
        "aria-label": `edge ${n.id} to ${s}`});
      const address = `${p.name}/${n.id}->${s}`;
      const words = `the edge ${n.id} → ${s}`;
      const open = () => { showEdge(p, n, s); select(address, words); };
      hit.addEventListener("click", open);
      hit.addEventListener("keydown", e => {
        if (e.key === "Enter" || e.key === " ") { e.preventDefault(); open(); }
      });
      svg.appendChild(hit);
      const said = edgeLabel(n, s, took, back);
      if (said) label(midx, midy, said, back ? "--accent" : never ? "--faint" : "--muted",
        took && took === heaviest ? 500 : 400);
    });
    if (n.on_error && pos[n.on_error]) {
      const b = pos[n.on_error];
      const took = weights[`${n.id}->${n.on_error}`] || 0;
      const x1 = a.x, y1 = a.y + height[n.id] / 2, x2 = b.x, y2 = b.y + height[n.on_error] / 2;
      svg.appendChild(el("path", {
        d: `M${x1} ${y1} C ${x1 - SIDE} ${y1}, ${x2 - SIDE} ${y2}, ${x2} ${y2}`,
        fill: "none", stroke: css("--attention"), class: "gline",
        "data-edge": `${n.id}->${n.on_error}`,
        "stroke-width": Math.max(1.1, strokeFor(took)),
        "stroke-dasharray": "1.5 3", "marker-end": "url(#ar-err)"}));
      /* Beside the step it leaves, above where the edge departs: placed left of the
         leftmost box it sat over another arm when the failure step was to the right, and on
         the curve's midpoint it sat on the box's own edge. */
      label(x1 - SIDE * .95, y1 - 9,
        took ? `if it fails · ${fmt(took)}` : "if it fails", "--attention");
    }
  });

  /* The stores this pipeline reaches, in a column of their own to the right. They are not
     steps, so they sit outside the flow with a hairline to each
     step that touches them. */
  const wanted = column;
  let floorY = 0;
  wanted.forEach(held => {
    const store = held.store, touching = held.touching;
    const y = Math.max(held.want, floorY);
    floorY = y + 44;
    const x = W - PAD - GUTTER + 8;
    const g = el("g", {tabindex: 0, role: "button", "aria-label": store.name,
      style: "cursor:pointer"});
    touching.forEach(id => {
      const from = pos[id];
      const y1 = from.y + Math.min(height[id] / 2, 44);
      g.appendChild(el("path", {
        d: `M${from.x + CW} ${y1} C ${from.x + CW + 26} ${y1}, ${x - 26} ${y + 17}, ${x} ${y + 17}`,
        fill: "none", stroke: css("--edge-soft"), "stroke-width": 1.4,
        "stroke-dasharray": "1 3"}));
    });
    g.appendChild(el("rect", {x, y, width: GUTTER - 26, height: 34, rx: 17,
      fill: css("--sunk"), stroke: css("--line-strong"), "stroke-width": 1}));
    g.appendChild(glyph("store", x + 10, y + 7, "--faint"));
    const t = el("text", {x: x + 36, y: y + 21, fill: css("--muted"),
      "font-family": '"JetBrains Mono", monospace', "font-size": 12});
    /* The count is written from the right of the same capsule, so the name's room is what is
       left after it. A twelve-character name and a count were drawn on top of each other. */
    const counted = store.accesses ? fmt(store.accesses).length : 0;
    const room = Math.max(6, Math.floor((GUTTER - 26 - 46 - (counted ? counted * 6.6 + 8 : 0)) / 7.3));
    t.textContent = clip(store.name, room);
    g.appendChild(whole(t, store.name));
    if (store.accesses) {
      const c = el("text", {x: x + GUTTER - 36, y: y + 21, fill: css("--accent"),
        "text-anchor": "end", "font-family": '"JetBrains Mono", monospace',
        "font-size": 11});
      c.textContent = fmt(store.accesses);
      g.appendChild(c);
    }
    g.addEventListener("click", () => showResource(store.name));
    g.addEventListener("keydown", e => {
      if (e.key === "Enter" || e.key === " ") { e.preventDefault(); showResource(store.name); }
    });
    svg.appendChild(g);
  });

  nodes.forEach(n => {
    const {x, y} = pos[n.id];
    const open = n.id === expanded;
    const box = height[n.id];
    const g = el("g", {class: "gnode", tabindex: 0, role: "button", "aria-label": n.id,
      "data-node": n.id});
    /* A ladder rung shades the drawing to its own node set, so a rung is read on the graph
       it was cut from rather than as a list of names. */
    if (rungShown && shownStage === "measure" && !rungShown.has(n.id)) g.setAttribute("opacity", "0.3");
    const chosen = n.id === currentStep;
    const moving = DATA.running && DATA.running.pipeline === p.name ? DATA.running : null;
    const liveDone = moving && moving.done && moving.done[n.id] && moving.done[n.id].executions;
    const isNext = moving && !liveDone
      && nodes.filter(o => !((moving.done || {})[o.id] || {}).executions)[0] === n;
    /* The outline carries status only: solid is built, dashed is a promise, and the
       accent dash is a step that moved since this pipeline last ran. Kind moved to the glyph,
       which is what freed the outline to mean one thing. */
    const status = n.planned ? "planned" : n.changed ? "changed" : "built";
    g.appendChild(el("rect", {x, y, width: CW, height: box, rx: 9,
