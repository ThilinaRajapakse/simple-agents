      fill: chosen ? css("--accent-soft") : css("--surface"),
      stroke: isNext || chosen ? css("--accent")
        : status === "changed" ? css("--note") : css("--line-strong"),
      "stroke-width": isNext ? 2 : chosen ? 1.7 : status === "changed" ? 1.5 : 1.2,
      "stroke-dasharray": status === "planned" ? "6 4"
        : status === "changed" ? "9 3" : isNext ? "7 7" : ""}));

    const tone = n.planned ? "--note" : "--muted";
    g.appendChild(el("rect", {x: x + 9, y: y + 10, width: 28, height: 28, rx: 8,
      fill: css("--sunk"), stroke: css("--line"), "stroke-width": 1}));
    g.appendChild(glyph(n.kind, x + 13, y + 14, tone));

    const t1 = el("text", {x: x + 46, y: y + 24, fill: css("--ink"),
      "font-family": '"JetBrains Mono", monospace', "font-size": 14, "font-weight": 500});
    t1.textContent = clip(n.id, NAME_COLS);
    g.appendChild(whole(t1, n.id));

    const extras = [];
    if (n.planned) extras.push("not built yet");
    if (n.changed === "new") extras.push("new since the last run");
    else if (n.changed === "built") extras.push("built since the last run");
    else if (n.changed === "kind") extras.push("changed kind");
    if (n.fan_out) extras.push(`once per ${n.fan_out}`);
    if (n.successors.length > 1 && n.routes) extras.push("branches");
    if (n.loop) extras.push("loops back");
    const marks = [
      n.asks_a_person, n.tools.some(t => t.effect === "spends_money"),
      n.tools.some(t => t.effect === "irreversible"),
      n.measured && !n.measured.reached,
      Object.keys((n.ran || {}).ended || {}).filter(k => k !== "skipped").length,
      (n.asked || []).length,
    ].filter(Boolean).length;
    const t2 = el("text", {x: x + 46, y: y + 40,
      fill: css(n.planned || n.changed ? "--note" : "--faint"),
      "font-family": '"JetBrains Mono", monospace', "font-size": 12});
    let said = extras.length ? cap(extras.join(" · ")) : cap(n.kind_word);
    const room = COLS - 6 - Math.ceil(marks * 1.6);
    if (said.length > room) said = said.slice(0, Math.max(4, room - 1)) + "…";
    t2.textContent = said;
    g.appendChild(t2);

    const third = [];
    const hands = n.produces ? n.produces.name : n.planned ? "not settled yet" : "plain data";
    third.push("→ " + hands);
    if (liveDone) third.push(`done, ${fmt(Math.round(moving.done[n.id].ms))} ms`);
    if (n.measured && population === "rollouts") {
      third.push(`reached ${rate(n.measured.reach, "rate")}`);
    }
    const t3 = el("text", {x: x + 14, y: y + 60, fill: css("--faint"),
      "font-family": '"JetBrains Mono", monospace', "font-size": 12});
    const third_said = third.join(" · ");
    t3.textContent = clip(third_said, COLS);
    g.appendChild(whole(t3, third_said));

    // How much data went through, from the run's own record. 40 in and 8 out is what a
    // reader stops on; the schema name above it is what the step promised.
    const much = volumeLine(n);
    if (much) {
      const t4 = el("text", {x: x + 14, y: y + 78, fill: css("--accent"),
        "font-family": '"JetBrains Mono", monospace', "font-size": 12});
      t4.textContent = clip(much, COLS);
      g.appendChild(whole(t4, much));
    }

    /* The measure strip: one bar, whatever the selector is pointed at, with its own figure
       beside it. A length on its own is a claim a reader cannot check. */
    if (barTop !== null) {
      const by = y + barTop;
      const held = measureOf(n);
      const track = CW - 28 - 96;
      g.appendChild(el("rect", {x: x + 14, y: by, width: track, height: 5, rx: 2.5,
        fill: css("--sunk")}));
      if (held.value > 0 && biggest > 0) {
        g.appendChild(el("rect", {x: x + 14, y: by,
          width: Math.max(2, track * (held.value / biggest)), height: 5, rx: 2.5,
          fill: css(held.value === biggest ? "--accent" : "--line-strong")}));
      }
      const v = el("text", {x: x + CW - 14, y: by + 5.5, fill: css("--muted"),
        "text-anchor": "end", "font-family": '"JetBrains Mono", monospace',
        "font-size": 11.5});
      v.textContent = held.words;
      g.appendChild(v);
    }

    let bx = x + CW - 16;
    const dot = (tok, words) => {
      const c = el("circle", {cx: bx, cy: y + 42, r: 5, fill: css(tok)});
      const tt = el("title", {}); tt.textContent = words; c.appendChild(tt);
      g.appendChild(c); bx -= 14;
    };
    if (n.asks_a_person) dot("--accent", "can ask a person");
    if (n.tools.some(t => t.effect === "spends_money")) dot("--note", "can spend money");
    if (n.tools.some(t => t.effect === "irreversible")) dot("--attention", "can make a permanent change");
    if (n.measured && !n.measured.reached) dot("--faint", "the evaluation never reached it");
    const badly = Object.keys((n.ran || {}).ended || {}).filter(k => k !== "skipped");
    if (badly.length) dot("--attention", `its last run ended: ${badly.join(", ")}`);
    if ((n.asked || []).length) dot("--accent", `asked a person ${n.asked.length}×`);
    if (openAt(`${p.name}/${n.id}`).length) {
      const c = el("circle", {cx: x + 9, cy: y + 10, r: 4.5, fill: css("--attention")});
      const tt = el("title", {}); tt.textContent = "an open comment"; c.appendChild(tt);
      g.appendChild(c);
    }
    if (liveDone) {
      g.appendChild(el("circle", {cx: x + CW - 16, cy: y + 65, r: 6, fill: css("--accent")}));
      g.appendChild(el("path", {d: `M${x + CW - 19} ${y + 65} l2.2 2.4 l4 -4.6`,
        fill: "none", stroke: css("--surface"), "stroke-width": 1.6}));
    }
    if (isNext && !reduced) g.classList.add("run-live");

    if (open) {
      let ty = y + CH + (anyVolume ? VOL : 0) + (barTop !== null ? BAR : 0) - 6;
      openRows(n, p).forEach(([key, value]) => {
        const k = el("text", {x: x + 14, y: ty + 10, fill: css("--faint"),
          "font-family": '"JetBrains Mono", monospace', "font-size": 11,
          "letter-spacing": ".06em"});
        k.textContent = key.toUpperCase(); g.appendChild(k);
        wrap(value, COLS).forEach((line, i) => {
          const v = el("text", {x: x + 14, y: ty + 10 + (i + 1) * LINE, fill: css("--ink"),
            "font-family": '"JetBrains Mono", monospace', "font-size": 11.5});
          v.textContent = line; g.appendChild(v);
        });
        ty += (wrap(value, COLS).length + 1) * LINE;
      });
    }
    const hint = el("text", {x: x + CW - 13, y: y + 24, fill: css("--muted"),
      "text-anchor": "end", "font-family": '"JetBrains Mono", monospace', "font-size": 11});
    hint.textContent = open ? "Less" : "More";
    g.appendChild(hint);

    const pick = () => {
      expanded = expanded === n.id ? null : n.id;
      showStep(n.id, false);
    };
    g.addEventListener("click", pick);
    g.addEventListener("keydown", e => {
      if (e.key === "Enter" || e.key === " ") { e.preventDefault(); pick(); }
    });
    svg.appendChild(g);
  });
  drawKey(p, nodes, nodes.some(n =>
    (n.successors || []).some(t => pos[t] && !weights[`${n.id}->${t}`] && countable(n.id))));
  lightStep(storyCursor || currentStep);
}

/* ---------- the story ---------- */
/* The pipeline as a rail beside the drawing: one row a step, in the order the code declares
   them, what each is for in the project's own words, and the seams it holds. The row is the
   cursor into the drawing, so a reader following the sentence follows the picture. */
let storyCursor = null;

/* Light one step and every edge that touches it. A redraw on each hover rebuilds a thousand
   shapes, so this sets a class on the few that change and leaves the drawing alone. */
function lightStep(id) {
  storyCursor = id || null;
  const graph = document.getElementById("graph");
  graph.querySelectorAll("[data-node]").forEach(g =>
    g.classList.toggle("lit", !!id && g.getAttribute("data-node") === id));
  graph.querySelectorAll("[data-edge]").forEach(p => {
    const ends = String(p.getAttribute("data-edge")).split("->");
    p.classList.toggle("lit", !!id && (ends[0] === id || ends[1] === id));
  });
  document.querySelectorAll("[data-story]").forEach(b =>
    b.setAttribute("aria-current", b.getAttribute("data-story") === id));
}

/* A seam as one mark. The words are the builder's and the store is the project's, so the two
   are set apart: a name keeps its spelling and is monospace, a word is sentence-cased. */
function seamMarks(seams) {
  return (seams || []).map(s => `<span class="seam ${esc(s.kind)}"${
    s.kind === "touches" ? ` data-tip="Direction undeclared: it reaches ${esc(s.name)} and does not say which way"` : ""
  }>${esc(s.words)}${s.name ? ` <span class="mono">${esc(s.name)}</span>` : ""}</span>`).join("");
}

function renderStory() {
  const wrap = document.getElementById("storywrap");
  const p = DECLARED.find(x => x.name === currentPipe);
  const path = (p && p.data_path) || [];
  if (shownStage !== "shape" || !path.length) { wrap.hidden = true; return; }
  wrap.hidden = false;
  const holder = document.getElementById("story");
  const at = storyCursor || currentStep;
  holder.innerHTML = `<div class="story">` + path.map((r, i) => `
    <button class="srow${r.planned ? " planned" : ""}" data-story="${esc(r.id)}"
      aria-current="${r.id === at}">
      <span class="n">${i + 1}</span>
      <span><span class="sname">${esc(r.id)}</span>${
        r.intent ? `<span class="sdoes">${esc(cap(r.intent))}</span>` : ""}${
        r.seams.length ? `<span class="seams">${seamMarks(r.seams)}</span>` : ""}</span>
    </button>`).join("") + `</div>
    <p class="storynote">The steps of <span class="mono">${esc(p.name)}</span>, in the order
      the code declares them. Point at a step to light it in the drawing. The arrow keys walk
      the list. Select a step to open it.</p>`;
  const rows = [...holder.querySelectorAll("[data-story]")];
  rows.forEach(b => {
    const id = b.getAttribute("data-story");
    b.onmouseenter = () => lightStep(id);
    b.onfocus = () => lightStep(id);
    b.onclick = () => showStep(id, true);
    b.onkeydown = e => {
      if (e.key !== "ArrowDown" && e.key !== "ArrowUp") return;
      e.preventDefault();
      const next = rows[rows.indexOf(b) + (e.key === "ArrowDown" ? 1 : -1)];
      if (next) next.focus();
    };
  });
  holder.onmouseleave = () => lightStep(currentStep);
}

/* ---------- threads ---------- */
function renderThread(c, {withMeta = true} = {}) {
  const who = by => by === "builder" ? "You" : "Your coding agent";
  const kind = c.kind !== "comment" ? ` <span class="badge warn">${esc(cap(c.kind))}</span>` : "";
  const turns = [
    `<div class="turn ${esc(c.by)}"><span class="who">${who(c.by)}${
      c.when ? " · " + esc(String(c.when).slice(0, 10)) : ""}</span>
      <span class="said">${esc(c.said)}</span></div>`,
    ...c.replies.map(r => `
      <div class="turn ${esc(r.by)}"><span class="who">${who(r.by)}${
        r.when ? " · " + esc(String(r.when).slice(0, 10)) : ""}</span>
        <span class="said">${esc(r.said)}</span></div>`),
  ].join("");
  /* A thread about words in a prompt carries them, so the thread reads after the wording
     has been rewritten and no longer holds them. */
  const quoted = c.quoted
    ? `<div class="quoted">“${esc(c.quoted)}”${c.quoted_chars
        ? ` <span class="asks">of ${fmt(c.quoted_chars)} characters</span>` : ""}${
        c.run ? `<span class="asks"> · read in ${esc(c.run)}</span>` : ""}</div>`
    : "";
  const state = c.status === "open" ? "Open"
    : c.status === "withdrawn" ? "Taken back · not being acted on"
    : "Addressed" + (c.addressed_by ? " by " + esc(c.addressed_by) : "");
  const actions = [];
  if (live()) {
    if (c.status !== "withdrawn") {
      actions.push(`<button class="btn" data-reply="${esc(c.id)}">Reply</button>`);
    }
    if (c.by === "builder") {
      actions.push(c.status === "withdrawn"
        ? `<button class="btn" data-reopen="${esc(c.id)}">Put it back</button>`
        : c.status === "open"
        ? `<button class="btn" data-withdraw="${esc(c.id)}">Take it back</button>` : "");
    }
  }
  return `<div class="thread ${esc(c.status)}" data-thread="${esc(c.id)}">${kind}${quoted}${turns}
    ${withMeta ? `<div class="meta"><span>${esc(addressName(c.at))}</span><span>${state}</span>${actions.join("")}</div>` : ""}
    <div class="replyslot"></div>
  </div>`;
}
function wireThreads(scope) {
  scope.querySelectorAll("[data-reply]").forEach(b => b.onclick = () => {
    const holder = b.closest(".thread").querySelector(".replyslot");
    if (holder.querySelector("input")) { holder.innerHTML = ""; return; }
    holder.innerHTML = `<div class="replybox"><input type="text" placeholder="Your reply">
      <button class="button quiet">Send</button></div>`;
    const input = holder.querySelector("input");
    input.focus();
    const send = async () => {
      if (!input.value.trim()) return;
      try { await post("/api/reply", {id: b.dataset.reply, said: input.value}); await refresh(); }
      catch (err) { input.value = ""; input.placeholder = String(err.message); }
    };
    holder.querySelector("button").onclick = send;
    input.addEventListener("keydown", e => { if (e.key === "Enter") send(); });
  });
  const move = (attr, path) => scope.querySelectorAll(`[${attr}]`).forEach(b => {
    b.onclick = async () => {
      b.disabled = true;
      try { await post(path, {id: b.getAttribute(attr)}); await refresh(); }
      catch (err) { b.disabled = false; b.textContent = String(err.message); }
    };
  });
  move("data-withdraw", "/api/withdraw");
  move("data-reopen", "/api/reopen");
}

/* ---------- the resource card ---------- */
/* The path out of one store: every step that touches it, and what each produced after.
   The data view is anchored where the data enters rather than at the first step. */
function whereItGoes(r) {
  const found = [];
  const seen = new Set();
  DECLARED.forEach(p => {
    (p.nodes || []).forEach(n => {
      const names = new Set(n.touches || []);
      (n.tools || []).forEach(t => (t.touches || []).forEach(x => names.add(x)));
      if (!names.has(r.name)) return;
      const at = `${p.name}/${n.id}`;
      if (seen.has(at)) return;
      seen.add(at);
      const volume = n.example && n.example.handed_on_volume;
      found.push({at, said: volume
        ? `produces ${volume}`
        : `produces ${n.produces ? n.produces.name : "plain data"}`});
      (n.successors || []).forEach(target => {
        const next = (p.nodes || []).find(x => x.id === target);
        if (!next || seen.has(`${p.name}/${next.id}`)) return;
        seen.add(`${p.name}/${next.id}`);
        const onward = next.example && next.example.handed_on_volume;
        found.push({at: `${p.name}/${next.id}`,
          said: `then ${onward || (next.produces ? next.produces.name : "plain data")}`});
      });
    });
  });
  return found.slice(0, 10);
}

function showResource(name) {
  currentStep = null;
  railShows = {kind: "resource", name};
  const card = document.getElementById("stepcard");
  const r = (DATA.resources || []).find(x => x.name === name);
  const address = `resource:${name}`;
  selected = {address, label: `the ${name} resource`, kind: "comment"};
  if (!r) { card.innerHTML = ""; renderComposer(); return; }
  const rows = [];
  const kv = (k, v) => v && rows.push(
    `<div class="kv"><span>${esc(k)}</span><span>${v}</span></div>`);
  const reach = r.readers.length + r.writers.length + r.unknown.length;
  let html = `<div class="kicker">Resource</div><h3>${esc(r.name)}</h3>
    <div style="color:var(--muted)">Outside the pipelines. Reached by ${
      reach === 1 ? "one step" : `${reach} steps`}. Its contents are the project's; what is
      here is who touches it, how, and what has come out of it.</div>
    <div class="facts">`;
  rows.length = 0;
  const fromRuns = new Set(r.direction_from_runs || []);
  const side = list => list.map(one =>
    esc(one) + (fromRuns.has(one) ? ' <span class="pending">from what it recorded</span>' : "")
  ).join("<br>");
  kv("Read by", side(r.readers));
  kv("Written by", side(r.writers));
  kv("Touched, direction not declared", r.unknown.map(esc).join("<br>"));
  html += `<details class="sub" data-sub="who" open><summary>Who touches it
    <span class="count">${reach}</span></summary><div class="subinner">${
    rows.join("")}</div></details>`;

  if ((r.through || []).length) {
    const tools = r.through.map(tool => `<div class="qrow">
      <span class="qname">${esc(tool.name)}</span>
      <p class="asks">${esc(tool.description || "")}</p>
      <p class="pending" style="color:var(--muted)">${
        esc(tool.effect === "read_only" ? "reads it"
          : tool.effect === "spends_money" ? "a paid call, which can read or write"
          : tool.effect === "irreversible" ? "writes it permanently" : "writes it")
      } · called by ${tool.used_by.map(esc).join(", ")}</p>
      ${codeBlock(tool.code)}</div>`).join("");
    html += `<details class="sub" data-sub="through" open><summary>Through these tools
      <span class="count">${r.through.length}</span></summary><div class="subinner">${
      tools}</div></details>`;
  }

  // How much each pipeline moves through it. The system level draws a link's width from the
  // per-run figure; the totals it is drawn from are here.
  const carried = Object.keys(r.flow || {}).filter(name => DECLARED.some(p => p.name === name));
  if (carried.length) {
    rows.length = 0;
    carried.forEach(name => {
      const flow = flowBetween(name, r);
      if (!flow.total && !flow.runs) return;
      kv(name, flow.total
        ? `${fmt(flow.total)} access${flow.total === 1 ? "" : "es"} over ${
            fmt(flow.runs)} run${flow.runs === 1 ? "" : "s"} · ${
            flow.per_run.toLocaleString("en-US", {maximumFractionDigits: 1})} a run`
        : "no access on record");
    });
    if (rows.length) {
      html += `<details class="sub" data-sub="flow" open><summary>How much each pipeline moves
        <span class="count">${rows.length}</span></summary><div class="subinner">${
        rows.join("")}</div></details>`;
    }
  }

  // What actually came out of it. A store reached through a tool is on the tool's records;
  // one reached in a step's own code is here because the step recorded the access.
  const accesses = r.accesses || [];
  if (accesses.length) {
    const shown = accesses.slice(-8).reverse();
    html += `<details class="sub" data-sub="accesses" open><summary>What went in and out
      <span class="count">${fmt(r.access_count)}</span></summary><div class="subinner">
      <p class="asks">${fmt(r.access_count)} access${r.access_count === 1 ? "" : "es"} on
      record${accesses.length < r.access_count
        ? `, and the ${shown.length} most recent are shown` : ""}.${
      r.access_count_measuring
        ? ` The evaluation's rollouts reached it a further ${fmt(r.access_count_measuring)}
            time${r.access_count_measuring === 1 ? "" : "s"}, counted apart.` : ""}</p>
      ${shown.map(accessBlock).join("")}
      ${(() => {
        const own = accesses.filter(a => a.how === "its own code").length;
        if (!own) {
          return `<p class="pending">All tool calls. A step reaching it in its own code
            records what it did with <span class="mono">ctx.record_access</span>.</p>`;
        }
        if (own === accesses.length) {
          return `<p class="pending">All recorded by the steps themselves, through
            <span class="mono">ctx.record_access</span>. Tools reaching it: none.</p>`;
        }
        return `<p class="pending">The ones marked <span class="mono">its own code</span> were
          recorded by the step through <span class="mono">ctx.record_access</span>. The rest
          are tool calls that reached it.</p>`;
      })()}
      </div></details>`;
  } else if (r.access_count_measuring) {
    html += `<div class="nobody">Reached only by the evaluation: ${
      fmt(r.access_count_measuring)} access${r.access_count_measuring === 1 ? "" : "es"}
      from rollouts, 0 from the project's own runs.</div>`;
  } else if (!(r.through || []).length) {
    html += `<div class="nobody">Contents and direction unknown. Reached by no tool and
      unrecorded. A step that reaches it in its own code records what it did:
      <span class="mono">ctx.record_access("${esc(r.name)}", "read",
      outputs=...)</span>.</div>`;
  }

  // And where what came out of it went next: the steps that touch it, and what each of them
  // produced afterwards.
  const onward = whereItGoes(r);
  if (onward.length) {
    html += `<details class="sub" data-sub="onward" open><summary>Where it goes from here
      <span class="count">${onward.length}</span></summary><div class="subinner">${
      onward.map(step => `<div class="kv"><span>${esc(step.at)}</span><span>${
        esc(step.said)}</span></div>`).join("")}</div></details>`;
  }

  const here = threadsAt(address);
  if (here.length || live()) {
    html += `<details class="sub" data-sub="conversation" open><summary>The conversation here
      <span class="count">${here.length || ""}</span></summary><div class="subinner">${
      here.map(c => renderThread(c)).join("")}</div></details>`;
  }
  card.innerHTML = html + `</div>`;
  card.querySelectorAll("details.sub").forEach(d => {
    d.addEventListener("toggle", () => { subOpen[d.dataset.sub] = d.open; });
  });
  wireThreads(card);
  drawGraph();
  renderComposer();
}

/* What the code says about one function: the line a reader recognises it by, where it lives,
   and the body behind a click. None of it is written twice, so none of it can go stale. */
function signatureOf(code) {
  if (!code) return "";
  const written = (code.parameters || []).map(prm =>
    prm.name + (prm.type ? ": " + prm.type : "")).join(", ");
  return `${code.name}(${written})` + (code.returns ? ` -> ${code.returns}` : "");
}

/* `inline` puts the source straight into whatever opened this, rather than behind a second
   disclosure. A row called "The code it runs · 6 lines" that opens onto a row called "The
   code · 6 lines" is a level that says nothing. Inside a tool the extra click earns its
   place: the signature and the docstring come first and the body is the long part. */
function codeBlock(code, {withSource = true, inline = false} = {}) {
  if (!code) return "";
  let html = `<div class="sig">${esc(signatureOf(code))}</div>`;
  if (code.return_fields && code.return_fields.length) {
    html += `<div class="kicker" style="margin-top:8px">each one is</div>
      <div class="schema">${code.return_fields.map(f =>
        `<div class="frow"><span class="fname">${esc(f.name)}</span>
         <span class="ftype">${esc(f.type || "")}</span></div>`).join("")}</div>`;
  } else if (!code.returns) {
    html += `<p class="where">Return type undeclared.</p>`;
  }
  if (code.doc && code.doc !== code.says) {
    html += `<p class="asks">${esc(code.doc)}</p>`;
  }
  if (code.where) {
    html += `<p class="where">${esc(code.where.at)}${
      code.where.library ? " · the library's, not yours" : ""}</p>`;
  }
  if (withSource && code.source) {
    const body = `<div class="src">${esc(code.source.text)}</div>${
      code.source.clipped ? `<p class="where">${fmt(code.source.clipped)} more lines are not
      shown.</p>` : ""}`;
    html += inline ? body : `<details class="sub"><summary><span>Its source</span>
      <span class="held">${fmt(code.source.lines)} lines</span></summary>
      <div class="subinner">${body}</div></details>`;
  }
  return html;
}

/* One recorded access, as the store card lists them: which way, what was asked, what came
   back. A node's own code reported these, so what they hold is what it chose to report. */
function accessBlock(one) {
  const side = (label, value) => value === null || value === undefined ? "" :
    `<div class="side"><b>${esc(label)}</b><span>${esc(
      typeof value === "string" ? value : JSON.stringify(value))}</span></div>`;
  const omitted = (one.omitted || []).length
    ? `<p class="where">${esc(one.omitted.join(" and "))} not kept by this run's sampling.</p>`
    : "";
  const way = one.direction === "write" ? "written by"
    : one.direction === "read" ? "read by" : "touched by";
  return `<div class="access">
    <div class="dirn">${esc(way)} ${esc(one.node_id)}${
      one.how && one.how !== "its own code" ? ` · ${esc(one.how)}` : " · its own code"}</div>
    ${side("asked", one.inputs)}${side("came back", one.outputs)}${omitted}</div>`;
}

function toolWords(t) {
  if (t.asks) return "asks a person";
  if (t.effect === "read_only") return "reads";
  if (t.effect === "spends_money") {
    const price = t.cost_per_call != null
      ? (t.currency === "USD" ? "$" + t.cost_per_call
         : t.cost_per_call + " " + (t.currency || ""))
      : "money";
    return `spends ${price} per call`;
  }
  return t.effect === "irreversible" ? "permanent write" : "writes";
}

/* A figure in the basis its runs were priced against. Device-seconds are a measurement and
   not money, so they are never written with a currency beside them. */
function costAmount(value, basis) {
  if (basis && basis.indexOf("device-seconds") === 0) {
    return `${value.toLocaleString("en-US", {maximumFractionDigits: 1})} device-seconds`;
  }
  return rate(value, basis);
}

/* ---------- the edge card ---------- */

/* What selects this edge, in the builder's words. Four things can: a route choosing an arm,
   a cycle returning, a failure path, and nothing at all where a step has one way out. */
function whatSelects(n, target) {
  if ((n.closes_a_cycle || []).includes(target)) {
    return n.loop
      ? `The cycle returning. It goes back up to ${n.loop.back_for} times, then ${n.loop.then}.`
      : "The cycle returning.";
  }
  if (n.on_error === target && !(n.successors || []).includes(target)) {
    return "This step failing. It is reached no other way.";
  }
  if ((n.successors || []).length > 1) {
    return n.routes
      ? `Its route, choosing between ${n.successors.join(", ")}.`
      : `One of ${n.successors.length} declared ways on.`;
  }
  return "This step has one path and always takes it.";
}

function showEdge(p, n, target) {
  currentStep = null;
  railShows = {kind: "edge", from: n.id, to: target};
  const card = document.getElementById("stepcard");
  const to = (p.nodes || []).find(x => x.id === target);
  const over = populationOf(p);
  const took = over ? (over.edges || {})[`${n.id}->${target}`] || 0 : null;
  const runs = over ? over.runs : 0;
  const rows = [];
  const kv = (k, v) => v && rows.push(
    `<div class="kv"><span>${esc(k)}</span><span>${v}</span></div>`);

  let html = `<div class="kicker">Edge</div><h3>${esc(n.id)} → ${esc(target)}</h3>`;

  // What is planned to travel: readable before anything runs, which is what makes it the
  // answer at `shape`.
  const carries = n.produces;
  kv("Carries", carries ? esc(carries.name) : "plain data");
  if (to) {
    const join = (to.takes_in || {}).join;
    kv("Arrives as", join
      ? `one key of a Join, under <span class="mono">${esc(n.id)}</span>`
      : "the whole of what the next step is handed");
  }
  kv("Selected by", esc(whatSelects(n, target)));
  html += `<div class="facts">${rows.join("")}</div>`;

  if (carries && (carries.fields || []).length) {
    html += `<details class="sub" data-sub="edgeschema" open><summary>What is in it
      <span class="count">${carries.fields.length}</span></summary><div class="subinner">
      <div class="schema">${fieldList(carries)}</div></div></details>`;
  }

  // How often it fired, over whichever population the drawing is showing. A route arm
  // never taken is the fact that no reading of the code produces.
  if (over) {
    const share = runs ? Math.round((took / runs) * 100) : 0;
    const said = took
      ? `${fmt(took)} of ${fmt(runs)} runs went this way, which is ${share}%.`
      : `Untaken. ${fmt(runs)} run${runs === 1 ? "" : "s"} on record.`;
    let more = "";
    const siblings = (n.successors || []).filter(x => x !== target);
    if (siblings.length) {
      const others = siblings.map(x =>
        `${x} ${fmt((over.edges || {})[`${n.id}->${x}`] || 0)}`).join(" · ");
      more = `<p class="pending">The other ways out of ${esc(n.id)}: ${esc(others)}.</p>`;
      // Every out-edge of one step resolves with the same object, so what separates the arms
      // is which fired rather than what each carried. Saying otherwise would assert something
      // the executor does not do.
      more += `<p class="pending">Every arm carries the same ${
        esc(carries ? carries.name : "value")} that ${esc(n.id)} produced. Only which one
        fired differs.</p>`;
    }
    html += `<details class="sub" data-sub="edgeruns" open><summary>How often it is taken
      <span class="count">${took === null ? "" : fmt(took)}</span></summary>
      <div class="subinner"><p class="asks">${esc(said)}</p>${more}</div></details>`;
  }

  // And what actually travelled, read from the receiving end: a step with several edges into
  // it records one entry per edge, carrying the value or an absence saying why not.
  const arrived = ((to || {}).example || {}).arrived || {};
  const here = arrived[n.id];
  if (here) {
    const body = here.absent
      ? `<p class="pending">This edge delivered no value: ${esc(here.reason || "the edge did not fire")}.</p>`
      : `<div class="exrow"><span class="exval">${esc(here.value)}</span></div>
         <p class="pending">${esc(here.volume)}${
           here.chars > here.value.length ? ` · ${fmt(here.chars)} characters in all` : ""}</p>`;
    html += `<details class="sub" data-sub="edgelast" open><summary>What travelled last time
      </summary><div class="subinner">${body}
      <p class="pending">From the run ${esc((to.example || {}).run || "")}.</p>
      </div></details>`;
  } else if (to && to.example && !(to.takes_in || {}).join) {
    html += `<details class="sub" data-sub="edgelast" open><summary>What travelled last time
      </summary><div class="subinner">${exampleBlock({...to.example, handed_on: []})}
      </div></details>`;
  }

  const address = `${p.name}/${n.id}->${target}`;
  const threads = threadsAt(address);
  if (threads.length || live()) {
    html += `<details class="sub" data-sub="conversation" open><summary>The conversation here
      <span class="count">${threads.length || ""}</span></summary><div class="subinner">${
      threads.map(c => renderThread(c)).join("")}</div></details>`;
  }
  card.innerHTML = html;
  card.querySelectorAll("details.sub").forEach(d => {
    d.addEventListener("toggle", () => { subOpen[d.dataset.sub] = d.open; });
  });
  wireThreads(card);
  renderComposer();
}

/* ---------- the step card ---------- */
const kindLine = n =>
  n.kind === "agent" ? "Decides for itself: it chooses its own next move within its budget."
  : n.kind === "llm" ? "One model call, at a fixed place in the flow."
  : "A fixed step: plain code, no model involved.";

function showStep(stepId, pulse) {
  currentStep = stepId;
  railShows = null;
  const card = document.getElementById("stepcard");
  const p = DECLARED.find(x => x.name === currentPipe);
  const n = p && p.nodes.find(x => x.id === stepId);
  if (!n) {
    card.innerHTML = `<div class="nobody">Select a step in the graph to see what it does, the
      data it passes on, its tools and limits, and what was agreed about it. The panel below
      writes to whatever is selected.</div>`;
    drawGraph();
    renderComposer();
    return;
  }
  const address = `${p.name}/${n.id}`;
  selected = {address, label: `${n.id}, a ${n.kind_noun} in ${p.name}`, kind: "comment"};
  const rows = [];
  const kv = (k, v) => v !== null && v !== undefined && v !== "" &&
    rows.push(`<div class="kv"><span>${esc(k)}</span><span>${v}</span></div>`);

  let html = `<div class="kicker">${esc(n.kind_word)}</div><h3>${esc(n.id)}</h3>
    <div style="color:var(--muted)">${esc(kindLine(n))}</div>`;
  if (n.planned) html += `<p class="will">Will: ${esc(n.does)}</p>`;

  const badges = [];
  if (n.planned) badges.push(`<span class="badge warn">Not built yet</span>`);
  if (n.asks_a_person) badges.push(`<span class="badge acc">Can ask a person</span>`);
  if (n.tools.some(t => t.effect === "spends_money")) badges.push(`<span class="badge warn">Can spend money</span>`);
  if (n.tools.some(t => t.effect === "irreversible")) badges.push(`<span class="badge bad">Can make a permanent change</span>`);
  if (n.suspend_before) badges.push(`<span class="badge mut">Pauses for a check first</span>`);
  if (badges.length) html += `<div class="badges">${badges.join("")}</div>`;
  if (live()) html += `<p style="margin:10px 0 0"><button class="btn" data-talk="${esc(address)}">Comment on this step</button></p>`;

  html += `<div class="facts">`;
  /* The card in three bands: what the step is, what it has actually done, and what has been
     said about it. Eleven collapsibles in one flat list gave a reader no way in, and a shut
     one gave no reason to open it. A band is a heading and never a control; a row inside one
     opens, and says on its right what it holds while it is shut. */
  const band = (title, of) => `<div class="band"><span>${esc(title)}</span>${
    of ? `<span class="of">${esc(of)}</span>` : ""}</div>`;
  const group = (key, title, inner, fallbackOpen, held) => {
    if (!inner) return "";
    const open = key in subOpen ? subOpen[key] : !!fallbackOpen;
    return `<details class="sub" data-sub="${key}" ${open ? "open" : ""}>
      <summary><span>${esc(title)}</span>${
        held ? `<span class="held">${esc(held)}</span>` : ""}</summary>
      <div class="subinner">${inner}</div></details>`;
  };
  const bandOf = (title, of, parts) => {
    const held = parts.filter(Boolean);
    return held.length ? band(title, of) + held.join("") : "";
  };
  let inner = "";
  rows.length = 0;
  const takes = n.takes_in || {sources: [], says: "", declared: n.accepts};
  kv("Takes in", esc(takes.says));
  if (n.produces) kv("Produces", esc(n.produces.name || "?"));
  else kv("Produces", n.planned ? `<span style="color:var(--note)">not settled yet</span>` : "plain data");
  if (n.fan_out) kv("Runs once per", esc(n.fan_out));
  inner = rows.join("");
  (takes.sources || []).forEach(src => {
    const list = fieldList(src.carries);
    if (list) inner += `<div class="kicker" style="margin-top:8px">from ${esc(src.from)}</div>` + list;
  });
  if (n.produces && n.produces.fields && n.produces.fields.length) {
    inner += `<div class="kicker" style="margin-top:8px">it produces</div>` + fieldList(n.produces);
  }
  inner += exampleBlock(n.example);
  const parts = {};
  parts.data = group("data", "What it takes and produces", inner, true,
    n.produces ? `→ ${n.produces.name}` : n.planned ? "→ not settled yet" : "→ plain data");

  rows.length = 0;
  n.tools.forEach(t => kv(t.name, esc(toolWords(t)) +
    (t.touches.length ? ` · ${t.touches.map(esc).join(", ")}` : "")));
  if (n.touches.length) kv("Touches directly", n.touches.map(esc).join(", "));
  let toolsInner = rows.join("");
  n.tools.filter(t => t.code).forEach(t => {
    toolsInner += `<details class="sub"><summary><span>${esc(t.name)}</span>
      <span class="held">${esc(t.code.where ? t.code.where.at : "its source")}</span></summary>
      <div class="subinner">${t.description ? `<p class="asks">${esc(t.description)}</p>` : ""}
      ${codeBlock(t.code)}</div></details>`;
  });
  parts.tools = group("tools", "Tools and resources", toolsInner, false,
    [n.tools.length ? `${n.tools.length} tool${n.tools.length === 1 ? "" : "s"}` : "",
     n.touches.length ? n.touches.join(", ") : ""].filter(Boolean).join(" · "));

  // What the code says, which is the one thing on the page that is true before anything runs.
  parts.code = group("code", "The code it runs", codeBlock(n.code, {inline: true}), false,
    n.code && n.code.source ? `${fmt(n.code.source.lines)} lines` : "");

  // Over every run on record, not the newest one. The question a builder asks of a step is
  // what it costs in general, and one run is one sample.
  rows.length = 0;
  const record = n.over_the_record;
  if (record && record.executions) {
    kv("Ran", `${fmt(record.executions)}× over ${fmt((p.over_runs || {}).runs || 0)} runs`);
    Object.entries(record.cost_by_basis || {}).forEach(([basis, value]) =>
      kv("Its model calls cost", record.cost_unknown
        /* Summed over the calls that priced, so it is a floor rather than the total. */
        ? `at least ${esc(costAmount(value, basis))} · ${fmt(record.cost_unknown)} call(s) could not be priced`
        : `${esc(costAmount(value, basis))} in all`));
    Object.entries(record.spend_by_currency || {}).forEach(([currency, value]) =>
      kv("Its tools spent", `${esc(rate(value, currency))} in all`));
    if (record.model_calls) kv("Model calls", fmt(record.model_calls));
    if (record.tool_calls) kv("Tool calls", fmt(record.tool_calls));
    if (record.ms) kv("Time inside it", `${fmt(Math.round(record.ms))} ms in all`);
    if (record.items) {
      const perItem = Object.entries(record.cost_by_basis || {})[0];
      kv("Items handled", fmt(record.items) + (perItem
        ? ` · ${esc(costAmount(perItem[1] / record.items, perItem[0]))} each` : ""));
    }
    if (record.skipped) kv("Runs that did not reach it", fmt(record.skipped));
    Object.entries(record.reads || {}).forEach(([name, count]) =>
      kv(`Read ${esc(name)}`, `${fmt(count)}×, in its own code`));
    Object.entries(record.writes || {}).forEach(([name, count]) =>
      kv(`Wrote ${esc(name)}`, `${fmt(count)}×, in its own code`));
  }
  parts.record = group("record", "Across every run", rows.join(""), false,
    record && record.executions
      ? `${fmt(record.executions)}× over ${fmt((p.over_runs || {}).runs || 0)} runs` : "");

  rows.length = 0;
  if (n.successors.length > 1 && n.routes) kv("Chooses between", n.successors.map(esc).join(", "));
  else if (n.successors.length) kv("Then", n.successors.map(esc).join(", "));
  else kv("Then", "the run ends here");
  if (n.loop) kv("Can loop back", `up to ${n.loop.back_for}×, then ${esc(n.loop.then)}`);
  if (n.on_error) kv("If it fails", `the run goes to ${esc(n.on_error)}`);
  if (n.retries) kv("Retries", `${n.retries}×`);
  parts.flow = group("flow", "Where it goes next", rows.join(""), false,
    n.successors.length ? clip(n.successors.join(", "), 34) : "the run ends here");

  rows.length = 0;
  if (n.budget) {
    const b = n.budget;
    if (b.max_steps != null) kv("Model calls", `at most ${fmt(b.max_steps)}`);
    if (b.max_tokens != null) kv("Tokens", `at most ${fmt(b.max_tokens)}`);
    if (b.max_cost != null) kv("Spend", `at most $${b.max_cost}`);
    if (b.max_wall_clock_ms != null) kv("Time", `at most ${fmt(b.max_wall_clock_ms)} ms`);
  }
  if (n.max_output_tokens != null) kv("Answer length", `${fmt(n.max_output_tokens)} tokens`);
  if (n.model) kv("Model", esc(n.model));
  parts.limits = group("limits", "What bounds it", rows.join(""), false,
    rows.length ? `${rows.length} limit${rows.length === 1 ? "" : "s"}` : "");

  rows.length = 0;
  if (n.ran) {
    kv("In the last run", ran(n));
    if (n.ran.errors) kv("Errors", fmt(n.ran.errors));
    const ended = Object.entries(n.ran.ended || {}).filter(([k]) => k !== "skipped");
    if (ended.length) {
      kv("Ended as", ended.map(([k, v]) => `${esc(k.replace(/_/g, " "))} ${fmt(v)}`).join(" · "));
    }
    if (n.ran.executions > 1) kv("Attempts", `${fmt(n.ran.executions)} in that run`);
  }
  parts.lastrun = group("lastrun", "In the last run", rows.join(""), false, n.ran ? ran(n) : "");

  rows.length = 0;
  (n.asked || []).forEach(q => {
    rows.push(`<div class="qrow"><p class="answer">“${esc(q.prompt || "")}”</p>
      ${q.answer ? `<p class="asks">They said: “${esc(q.answer)}”${
      q.chose ? `, read as <b>${esc(q.chose)}</b>` : ", matching none of the options"}</p>`
        : `<p class="asks">${esc(q.reason || "The channel returned no answer.")}</p>`}
      <p class="pending">${esc(q.resolution)}${
        q.answered_by ? ` · answered by ${esc(q.answered_by)}` : ""}</p></div>`);
  });
  parts.asked = group("asked", "Questions it asked", rows.join(""), false,
    (n.asked || []).length
      ? `${n.asked.length} question${n.asked.length === 1 ? "" : "s"}` : "");

  rows.length = 0;
  const m = n.measured;
  if (m) {
    kv("Reached", m.runs
      ? `${esc(rate(m.reach, "rate"))} of rollouts · ${fmt(m.reached)} of ${fmt(m.runs)}`
      : "no rollouts");
    if (m.executions) kv("Ran", `${fmt(m.executions)}× in all · ${fmt(Math.round(m.wall_clock_ms))} ms`);
    if (m.model_calls) kv("Model calls", fmt(m.model_calls));
    if (m.tool_calls) kv("Tool calls", fmt(m.tool_calls)
      + (m.paid_tool_calls ? ` · ${fmt(m.paid_tool_calls)} paid` : ""));
    if (m.cost !== null && m.cost !== undefined) {
      kv("Its model calls cost", esc(rate(m.cost, m.cost_currency)) +
        (m.cost_is_upper_bound ? " at most" : ""));
    } else if (m.cost_measured !== null && m.cost_measured !== undefined) {
      /* No total, but a floor: an unmeasured token count is not zero, so the step has no
         price, and the calls that did price are still money that was spent. */
      kv("Its model calls cost", `at least ${esc(rate(m.cost_measured, m.cost_currency))}` +
        (m.cost_unpriced_calls
          ? ` · ${fmt(m.cost_unpriced_calls)} call(s) could not be priced` : "") +
        (m.cost_unknown_because ? ` · ${esc(m.cost_unknown_because)}` : ""));
    } else if (m.cost_unknown_because) {
      kv("Its model calls cost", esc(m.cost_unknown_because));
    }
    Object.entries(m.resource_reads || {}).forEach(([name, count]) =>
      kv(`Read ${esc(name)}`, `${fmt(count)}×, in its own code`));
    Object.entries(m.resource_writes || {}).forEach(([name, count]) =>
      kv(`Wrote ${esc(name)}`, `${fmt(count)}×, in its own code`));
    if (m.tool_spend !== null && m.tool_spend !== undefined) {
      kv("Its tools spent", esc(rate(m.tool_spend, m.tool_spend_currency)));
    }
    if (m.consultations) {
      const who = Object.keys(m.consultation_answered_by || {}).join(", ");
      kv("Questions asked", fmt(m.consultations) + (who ? ` · answered by ${esc(who)}` : ""));
      if (m.consultation_misreadings) {
        kv("Answers the route could not read", `${fmt(m.consultation_misreadings)}${
          m.consultation_misreadings >= m.consultations
            ? " — every one, so those branches were never taken" : ""}`);
      }
    }
    if (m.errors) kv("Errors", fmt(m.errors));
    if (m.absent_outputs) kv("Reported the value was absent", fmt(m.absent_outputs));
    if (m.unfinished_executions) kv("Ended with no output", fmt(m.unfinished_executions));
    const ended = Object.entries(m.terminations || {});
    if (ended.length) kv("Ended as", ended.map(([k, v]) => `${esc(k)} ${fmt(v)}`).join(" · "));
    if (m.accuracy) kv("Its own accuracy", figureText(m.accuracy));
    (m.metrics || []).forEach(f => kv(f.name, figureText(f)));
  } else if (DATA.measured && DATA.measured.path && !n.planned) {
    rows.push(`<div class="nobody">Unmeasured. The reported evaluation carries no figure
      for this step.</div>`);
  }
  parts.measured = group("measured", "Across the evaluation", rows.join(""), false,
    m ? `reached ${rate(m.reach, "rate")}` : "");

  let agreed = "";
  if (n.decisions && n.decisions.length) {
    /* The rail is a column beside the drawing and `renderSections` does not measure it, so
       this is cut here with the whole of it on the tip. The decision reads in full on the
       page its kind files under. */
    agreed = n.decisions.map(d => `<div class="quote" data-tip="${esc(d.chose)}">${
      esc(short(d.chose, 300).said)}
      <cite>${esc(d.name)}${d.status === "changed" ? " · changed since it was agreed" : ""}${
      d.exact === false ? " · matched on its wording" : ""}</cite></div>`).join("");
  } else if (((DATA.brief || {}).decisions || []).length) {
    agreed = `<div class="nobody">No recorded decision names this step. A decision is matched
      to a step by the steps it lists, or by its wording. A step agreed under other words is
      not matched.</div>`;
  }
  parts.agreed = group("agreed", "What was agreed about it", agreed, true);

  const here = threadsAt(address);
  parts.conversation = group("conversation", "The conversation about it",
    here.map(c => renderThread(c)).join(""), true,
    here.length ? `${here.length} thread${here.length === 1 ? "" : "s"}` : "");

  html += bandOf("How it is wired", "as declared", [
    parts.data, parts.flow, parts.limits, parts.tools, parts.code,
  ]);
  html += bandOf("What it has done", "from the record", [
    parts.record, parts.lastrun, parts.measured, parts.asked,
  ]);
  html += bandOf("What has been said", "with the builder", [
    parts.agreed, parts.conversation,
  ]);
  html += `</div>`;
  card.innerHTML = html;
  card.querySelectorAll("details.sub").forEach(d => {
    d.addEventListener("toggle", () => { subOpen[d.dataset.sub] = d.open; });
  });
  wireThreads(card);
  card.querySelectorAll("[data-talk]").forEach(button => {
    button.onclick = () => { select(button.dataset.talk, `${n.id}, a ${n.kind_noun} in ${p.name}`, "comment"); focusComposer(); };
  });
  drawGraph();
  if (pulse) {
    document.querySelectorAll("#graph .gnode").forEach(g => {
      g.classList.toggle("pulse", g.getAttribute("data-node") === stepId);
    });
  }
  renderComposer();
}

/* ---------- the composer ---------- */
function renderComposer() {
  const box = document.getElementById("composer");
  if (!selected) {
    box.innerHTML = `<div class="kicker">Tell the coding agent</div><div class="nobody">Select a step, edge,
      pipeline, resource, question, or decision. The message will stay attached to it.</div>`;
    return;
  }
  const verb = selected.kind === "answer" ? "Send the answer"
    : selected.kind === "amendment" ? "Send the amendment" : "Send the comment";
  const placeholder = selected.kind === "answer"
    ? "Your answer, in your own words"
    : selected.kind === "amendment"
    ? "What should change, and why"
    : "What do you want to say about this?";
  if (!live()) {
    /* A click that stands for a sentence (Agree, This is right, The code is wrong) drafts
       the sentence; on a still page the sentence is what the builder carries to the coding
       agent, so it is shown, and the copy button copies the address with it. */
    const draft = drafts[selected.address + "|" + selected.kind] || "";
    box.innerHTML = `
      <div class="kicker">Discuss this with the coding agent</div>
      <div class="tofield">on <b>${esc(addressName(selected.address))}</b></div>
      <div style="color:var(--muted);font-size:var(--s-1)">${esc(selected.label || "")}</div>
      ${draft ? `<p class="quote" id="draft-words">${esc(draft)}</p>` : ""}
      <div class="hint">This copy of the page is a still picture. Run
        <span class="mono">simple-agents view --serve</span> to send comments, answers and
        replies from here. Until then, give your coding agent the
        ${draft ? "words above with the address" : "address above with the words"}.</div>
      <div class="send"><button class="button quiet" id="copy-addr">${
        draft ? "Copy the words and the address" : "Copy the address"}</button>
        <span class="sent" id="sent"></span></div>`;
    box.querySelector("#copy-addr").onclick = () => {
      /* A selection's address is a digest of the words, which says nothing on its own, so
         the words go with it. */
      const quoted = promptSelection && /#words-/.test(selected.address)
        ? ` about “${promptSelection.quoted}”` : "";
      const words = draft
        ? `${selected.address}${quoted}: ${draft}` : `${selected.address}${quoted}`;
      navigator.clipboard && navigator.clipboard.writeText(words);
      const sent = box.querySelector("#sent");
      sent.textContent = "copied";
      setTimeout(() => { sent.textContent = ""; }, 1200);
    };
    return;
  }
  box.innerHTML = `
    <div class="kicker">Tell the coding agent</div>
    <div class="tofield">${selected.kind === "comment" ? "On" : selected.kind === "answer" ? "Answering" : "Amending"}
      <b>${esc(addressName(selected.address))}</b></div>
    <div style="color:var(--muted);font-size:var(--s-1)">${esc(selected.label || "")}</div>
    <textarea id="composer-text" placeholder="${esc(placeholder)}"></textarea>
    <div class="send">
      <button class="button" id="composer-send">${esc(verb)}</button>
      <span class="sent" id="sent">${esc(flash)}</span>
    </div>
    <div class="hint">It is saved in the project. Your coding agent reads it there and
      answers in the same thread.</div>`;
  flash = "";
  const text = box.querySelector("#composer-text");
  text.value = drafts[selected.address + "|" + selected.kind] || "";
  text.oninput = () => { drafts[selected.address + "|" + selected.kind] = text.value; };
  box.querySelector("#composer-send").onclick = async () => {
    if (!text.value.trim()) { text.focus(); return; }
    try {
      /* A thread on words in a prompt carries them, the run they were read in and the
         digest the fixed text had, so it still reads after the wording is rewritten. */
      const words = /#words-/.test(selected.address) ? (promptSelection || {}) : {};
      await post("/api/comment", {at: selected.address, said: text.value, kind: selected.kind,
                                  ...words});
      delete drafts[selected.address + "|" + selected.kind];
      flash = "sent";
      await refresh();
    } catch (err) {
      box.querySelector("#sent").textContent = String(err.message);
    }
  };
}

/* ---------- selection of pipelines/steps ---------- */
function selectPipe(name, stepId) {
  currentPipe = name;
  graphFocus = false;
  const p = DECLARED.find(x => x.name === name);
  currentStep = stepId
    || (p && (p.nodes.find(n => n.planned) || p.nodes.find(n => n.kind === "agent") || p.nodes[0]) || {}).id
    || null;
  drawTabs(); drawSystem(); showStep(currentStep);
}
function goTo(target) {
  if (!target) return;
  if ((target.pipeline || target.resource) && !MAP_PAGES.includes(shownStage)) {
    showPage(mapPage());
  }
  if (target.pipeline) {
    selectPipe(target.pipeline, target.node || null);
    if (target.node) showStep(target.node, true);
    document.getElementById("map").scrollIntoView({behavior: reduced ? "auto" : "smooth"});
    return;
  }
  if (target.resource) {
    showResource(target.resource);
    document.getElementById("map").scrollIntoView({behavior: reduced ? "auto" : "smooth"});
    return;
  }
  if (target.section) {
    const home = target.page && stageSet().includes(target.page)
      ? pageFor(target.page) : sectionPage(target.section);
    if (home && home !== shownStage) showPage(home);
    /* A section is a `details` on most pages and a region `div` on the rest; a finding
       points at either, and the page has to land on it. */
    const d = document.querySelector(`[data-section="${target.section}"]`);
    if (d) {
      openAncestors(d);
      if (d.tagName === "DETAILS") d.open = true;
      d.scrollIntoView({behavior: reduced ? "auto" : "smooth"});
    }
  }
}

function openAncestors(element) {
  let parent = element.parentElement;
  while (parent) {
    if (parent.tagName === "DETAILS") parent.open = true;
    parent = parent.parentElement;
  }
}

/* ---------- sections ---------- */
function costText(key, value) {
  const [basis, currency, label] = key.split(":");
  if (basis === "device") {
    const hours = value / 3600;
    return hours >= 1 ? `${hours.toLocaleString("en-US", {maximumFractionDigits: 1})} h on ${label}`
      : `${Math.round(value).toLocaleString("en-US")} s on ${label}`;
  }
  if (currency === "USD") {
    if (value > 0 && value < 0.005) return "under 1¢";
    return `$${value.toLocaleString("en-US", {maximumFractionDigits: 2})}`;
  }
  return `${value.toLocaleString("en-US", {maximumFractionDigits: 2})} ${currency || ""}`;
}
function section(id, title, count, inner, open) {
  const held = document.querySelector(`details[data-section="${id}"]`);
  const wasOpen = held ? held.open : open;
  return `<details data-section="${id}" ${wasOpen ? "open" : ""}>
    <summary>${esc(title)} <span class="count">${esc(count)}</span></summary>
    <div class="inner">${inner}</div></details>`;
}
function focusComposer() {
  document.getElementById("composer").scrollIntoView({behavior: reduced ? "auto" : "smooth"});
  const text = document.getElementById("composer-text");
  if (text) text.focus();
}
/* "4 examples × 2 rollouts", or the two counts where k is not whole. */
function overText(f) {
  const rollouts = f.rollouts || 0, examples = f.examples || 0;
  if (examples && rollouts % examples === 0) {
    return `${fmt(examples)} example${examples === 1 ? "" : "s"} × ${fmt(rollouts / examples)} rollout${rollouts / examples === 1 ? "" : "s"}`;
  }
  return `${fmt(rollouts)} rollout${rollouts === 1 ? "" : "s"} over ${fmt(examples)} example${examples === 1 ? "" : "s"}`;
}

/* ---------- stated boundaries that the code contradicts ---------- */
function claimsSection(sections) {
  const claims = DATA.claims || [];
  const concerns = claims.filter(c => c.named_but_not.length
    || (c.names.length && c.in_code_but_unnamed.length));
  if (!concerns.length) return;
  const inner = concerns.map(c => {
    const differs = c.named_but_not.length;
    const code = differs ? c.in_code : c.in_code_but_unnamed;
    const status = differs ? "The code contradicts this boundary." : "The code includes a step this boundary does not name.";
    return `<div class="qrow">
      <span class="qname">${esc(c.title || c.entry)}</span>
      <span class="badge ${differs ? "bad" : "warn"}">${esc(status)}</span>
      <p class="answer">${esc(c.answer)}</p>
      <div class="kv"><span>Code</span><span>${code.length ? code.map(esc).join(", ") : "no step"}</span></div>
      <div class="actions"><button class="btn" data-amend="question:${esc(c.entry)}">Change the brief</button>
        <button class="btn" data-comment="question:${esc(c.entry)}">Comment</button></div>
    </div>`;
  }).join("");
  sections.push(section("claims", "Boundaries that need checking",
    `${concerns.length} ${concerns.length === 1 ? "boundary" : "boundaries"}`, inner, true));
}

/* ---------- what the run asked a person ---------- */
function askedSection(sections) {
  const asked = DATA.asked || [];
  if (!asked.length) return;
  const inner = asked.map(q => `<div class="qrow">
    <span class="qname">${esc(q.asked_by)}</span>
    <span class="badge ${q.resolution === "answered" ? "acc"
      : q.resolution === "unmatched" ? "bad" : "warn"}">${esc(cap(q.resolution))}</span>
    <p class="answer">“${esc(q.prompt || "")}”</p>
    ${q.options.length ? `<p class="asks">Offered: ${q.options.map(esc).join(", ")}</p>` : ""}
    ${q.answer ? `<p class="asks">They said: “${esc(q.answer)}”${
      q.chose ? `, read as <b>${esc(q.chose)}</b>` : ", and it matched none of the options"}</p>`
      : `<p class="asks">${esc(q.reason || "The channel returned no answer.")}</p>`}
    ${q.misread ? `<p class="pending">The channel said this was ${esc(q.declared_choice)}
      and the rule read ${esc(q.chose)}, so the branch behind it was never taken.</p>` : ""}
    <p class="pending" style="color:var(--faint)">${esc(q.pipeline || "")} · ${esc(q.run)}${
      q.answered_by ? ` · answered by ${esc(q.answered_by)}` : ""}${
      q.blocking ? " · the run waited for it" : ""}</p>
  </div>`).join("");
  const answered = asked.filter(q => q.resolution === "answered").length;
  sections.push(section("asked", "What the agent asked a person",
    `${asked.length} question${asked.length === 1 ? "" : "s"} · ${answered} answered`,
    inner + `<p>From the newest run of each pipeline. Every run's questions are in its own
      trajectory, and the evaluation counts them across every rollout.</p>`, false));
}

/* ---------- what moved since the run before ---------- */
function movedSection(sections) {
  const moved = DATA.moved || {};
  const names = Object.keys(moved);
  if (!names.length) return;
  const count = names.reduce((a, n) => a + moved[n].length, 0);
  sections.push(section("moved", "What moved since the run before",
    `${count} change${count === 1 ? "" : "s"}`,
    names.map(name => `<p><b>${esc(name)}</b></p><ul>` +
      moved[name].map(l => `<li>${esc(l)}</li>`).join("") + `</ul>`).join("")
    + `<p>The last two runs of each pipeline, compared step by step. The change ledger above
       lists what moved in the code. This lists what moved in the data.</p>`, false));
}

function examplesSection(sections) {
  const ex = DATA.examples;
  if (!ex) return;
  const splits = Object.entries(ex.splits || {});
  const rows = splits.map(([name, count]) => {
    const absent = (ex.absent || {})[name] || 0;
    return `<div class="kv"><span>${esc(name)}</span><span>${fmt(count)} example${
      count === 1 ? "" : "s"}${
      absent ? ` · ${fmt(absent)} with no expected value` : ""
    }</span></div>`;
  }).join("");
  let inner = rows;
  const facts = [];
  if (ex.fields.length) facts.push(`Each example carries ${ex.fields.map(f => `<span class="mono">${esc(f)}</span>`).join(", ")}.`);
  if (ex.sources) facts.push(`They come from ${fmt(ex.sources)} distinct source${ex.sources === 1 ? "" : "s"}.`);
  if (ex.labelled_steps.length) {
    const steps = ex.labelled_steps.map(s => `<span class="mono">${esc(s)}</span>`);
    facts.push(`${steps.length === 1 ? steps[0] + " carries" : steps.slice(0, -1).join(", ") + " and " + steps[steps.length - 1] + " carry"} a right answer of ${
      steps.length === 1 ? "its" : "their"} own, so ${steps.length === 1 ? "that step is" : "those steps are"} scored on ${steps.length === 1 ? "its" : "their"} own too.`);
  }
  if (facts.length) inner += `<p style="margin-top:10px">${facts.join(" ")}</p>`;
  if (ex.unreadable) {
    inner += `<div class="nobody">${fmt(ex.unreadable)} line${
      ex.unreadable === 1 ? "" : "s"} of ${esc(ex.path)} could not be read.</div>`;
  }
  if (ex.worked) {
    const w = ex.worked;
    inner += `<details class="sub" data-sub="worked" open><summary>One of them<span
      class="count">${esc(w.id)} · ${esc(w.split)}</span></summary><div class="subinner">
      <div class="example"><div class="exlabel"><b>what goes in</b></div>` +
      w.inputs.map(r => `<div class="exrow">${r.key ? `<b>${esc(r.key)}</b> ` : ""}${
        esc(r.value)}</div>`).join("") +
      `<div class="exlabel" style="margin-top:8px"><b>the right answer</b></div>` +
      w.expected.map(r => `<div class="exrow">${r.key ? `<b>${esc(r.key)}</b> ` : ""}${
        esc(r.value)}</div>`).join("") +
      (w.expects_absence
        ? `<div class="exnote">This example has no expected value. The agent should report
           that absence rather than guess.</div>` : "") +
      `</div><p>This example is from the ${esc(w.split)} split. Held-out examples remain
       reserved for evaluation.</p></div></details>`;
  } else {
    inner += `<div class="nobody">All examples are held out. The page shows split counts;
      the examples remain reserved for evaluation.</div>`;
  }
  sections.push(section("examples", "Evaluation examples",
    `${fmt(ex.total)} example${ex.total === 1 ? "" : "s"}`, inner, false));
}

/* ---------- the measure page ----------
   Three questions, in order down the page: how good is it (the headline strip), where does
   it lose it (the outcomes beside the example grid, then every figure on one axis, then the
   rungs on the drawing), and did the last change help (the comparison beside the trend).
   Nothing that is a chart collapses; the only things that open are drill-downs. */

/* Outcomes are an ordered share: right on the left arm, wrong on the right arm, and the
   rollouts that measured nothing in a neutral centre. The arms are the palette's own hues
   stepped for its surface (validated per palette; see the tokens in the stylesheet). */
const OUTCOME_ARMS = {
  right: ["correct", "correct_abstention"],
  centre: ["failed", "no_response", "left_the_slice", "unrecorded"],
  wrong: ["partially_correct", "missed", "false_confidence"],
};
const OUTCOME_TOKEN = {correct: "--o-right", correct_abstention: "--o-absent",
  partially_correct: "--o-partial", missed: "--o-missed", false_confidence: "--o-wrong"};
const OUTCOME_WORDS = {correct: "Right", correct_abstention: "Right, by reporting absence",
  partially_correct: "Partly right", missed: "Missed", false_confidence: "Confidently wrong",
  failed: "Failed", no_response: "No response", left_the_slice: "Left the rung",
  unrecorded: "Unrecorded"};
function outcomeTone(name) { return css(OUTCOME_TOKEN[name] || "--o-none"); }
function outcomeWords(name) { return OUTCOME_WORDS[name] || String(name).replace(/_/g, " "); }
function isRight(name) { return OUTCOME_ARMS.right.includes(name); }
/* Text set inside a fill takes whichever of the surface or the ink clears it. */
function inkOn(hex) {
  const h = String(hex || "").replace("#", "");
  if (h.length !== 6) return css("--surface");
  const lin = c => { c /= 255; return c <= 0.03928 ? c / 12.92 : ((c + 0.055) / 1.055) ** 2.4; };
  const L = 0.2126 * lin(parseInt(h.slice(0, 2), 16)) + 0.7152 * lin(parseInt(h.slice(2, 4), 16)) + 0.0722 * lin(parseInt(h.slice(4, 6), 16));
  return L > 0.35 ? css("--ink") : css("--surface");
}

let openFigure = null;     // the figure whose numbers are open, by name
let openCell = null;       // "example:rollout" whose detail is open under its row
let gridSort = "worst";    // worst | name | expected
let comparisonPick = null; // which written comparison (or the picked pair) is shown
let pickBefore = null;     // the served page's compare-two control, kept across redraws
let pickAfter = null;

const pct = v => `${(100 * Math.max(0, Math.min(1, v))).toFixed(1)}%`;

/* One row's worth of a 0–100% axis: the range as a band, the point as a dot, and any extra
   marks (the floor, last time). Every mark carries its words for hover and for a reader
   with no pointer. */
function axisRow(f, marks = [], opts = {}) {
  if (!f || f.point === null || f.point === undefined) return `<div class="ax empty"></div>`;
  const low = f.low ?? f.point, high = f.high ?? f.point;
  const band = f.low !== null && f.low !== undefined
    ? `<span class="band" style="left:${pct(low)};width:${(100 * Math.max(0.004, high - low)).toFixed(1)}%"></span>` : "";
  const extra = marks.filter(k => k && k.value !== null && k.value !== undefined).map(k =>
    `<span class="mark ${esc(k.kind)}" style="left:${pct(k.value)}" data-tip="${esc(k.words)}"></span>`).join("");
  return `<div class="ax${opts.tall ? " tall" : ""}"${opts.tip ? ` data-tip="${esc(opts.tip)}"` : ""}>
    ${band}${extra}<span class="dot" style="left:${pct(f.point)}"></span></div>`;
}

function rangeText(f) {
  if (!f || f.point === null || f.point === undefined) return "";
  if (f.low === null || f.low === undefined) return "";
  return `${rate(f.low, f.unit)} to ${rate(f.high, f.unit)}`;
}

/* The evaluation before the reported one that measured the same figure over the whole
   pipeline: what "since last time" is read against. */
function previousEvaluation(m) {
  const rows = (m.history || []).filter(h => !h.slice && !h.reported && h.headline
    && h.headline.point !== null && h.headline.point !== undefined
    && m.headline && h.headline.name === m.headline.name
    && String(h.created_at || "") <= String(m.created_at || "~"));
  return rows[0] || null;
}

/* A figure as plain words, for a cell or a tooltip: the point, and a declared count's reason. */
function figureWords(f) {
  if (!f || f.point === null || f.point === undefined) return f && f.reason ? f.reason : "no figure";
  if (f.estimated === false) return `${fmt(f.point)}${f.unit && f.unit !== "rate" ? " " + f.unit : ""}${f.reason ? ` (${f.reason})` : ""}`;
  return rate(f.point, f.unit);
}
function measureTitle(words, count) {
  return `<div class="mhead"><h3>${esc(words)}</h3>${count !== undefined ? `<span class="count">${esc(count)}</span>` : ""}</div>`;
}

/* ---- 1. how good is it: the headline strip ---- */
function headlineStrip(m) {
  const h = m.headline;
  const floorRate = m.floor && m.floor.of ? m.floor.right / m.floor.of : null;
  const prev = previousEvaluation(m);
  const marks = [
    floorRate !== null ? {kind: "floor", value: floorRate,
      words: `Doing nothing: ${fmt(m.floor.right)} of ${fmt(m.floor.of)} right`} : null,
    prev ? {kind: "last", value: prev.headline.point,
      words: `Last time (${prev.file.replace(/\.json$/, "")}): ${rate(prev.headline.point, prev.headline.unit)}`} : null,
  ];
  const hero = h && h.point !== null && h.point !== undefined
    ? `<div class="hero"><span class="big">${esc(rate(h.point, h.unit))}</span>
         <span class="what"><span class="mono">${esc(h.name)}</span><br><span class="asks">${esc(h.definition || "")}</span></span></div>
       ${axisRow(h, marks, {tall: true, tip: `${h.name} ${rate(h.point, h.unit)}, plausibly ${rangeText(h)}`})}
       <div class="axends"><span>0%</span><span class="range">${esc(rangeText(h))}</span><span>100%</span></div>
       <div class="axkey">${floorRate !== null ? `<span><i class="mark floor"></i>Doing nothing</span>` : ""}${
         prev ? `<span><i class="mark last"></i>Last time</span>` : ""}<span><i class="dot"></i>This evaluation, with its plausible range</span></div>`
    : `<div class="hero"><span class="big muted">No headline figure</span></div>`;

  const tiles = [];
  if (prev && h) {
    const diff = 100 * (h.point - prev.headline.point);
    const dir = Math.abs(diff) < 0.05 ? "Held" : diff > 0 ? "Up" : "Down";
    const reportedRow = (m.history || []).find(x => x.reported) || {};
    const behaviourMoved = prev.behaviour && reportedRow.behaviour && prev.behaviour !== reportedRow.behaviour;
    tiles.push(`<div class="tile"><span class="lbl">Since last time</span>
      <span class="val ${dir === "Up" ? "up" : dir === "Down" ? "down" : ""}">${dir === "Held" ? "Held" : `${dir === "Up" ? "▲" : "▼"} ${Math.abs(diff).toFixed(1)} points`}</span>
      <span class="sub">${esc(rate(prev.headline.point, prev.headline.unit))} on ${esc(prev.file.replace(/\.json$/, ""))}${
        behaviourMoved ? "<br>The behaviour changed between the two" : ""}</span></div>`);
  } else {
    tiles.push(`<div class="tile"><span class="lbl">Since last time</span><span class="val muted">First evaluation</span>
      <span class="sub">Nothing earlier measured ${h ? esc(h.name) : "this"}</span></div>`);
  }
  if (m.floor) {
    tiles.push(`<div class="tile"><span class="lbl">Doing nothing</span>
      <span class="val">${fmt(m.floor.right)} of ${fmt(m.floor.of)} right</span>
      <span class="sub">The declared baseline, under the same rules</span></div>`);
  }
  const per = m.cost_per;
  if (per && per.value !== null && per.value !== undefined) {
    tiles.push(`<div class="tile"><span class="lbl">What measuring cost</span>
      <span class="val">${esc(rate(per.value, per.currency))}${per.is_upper_bound ? " at most" : ""}</span>
      <span class="sub">${esc(rate(per.per_example, per.currency))} an example · ${esc(rate(per.per_rollout, per.currency))} a rollout</span></div>`);
  }
  const cov = DATA.coverage || {};
  const declaredSteps = DECLARED.reduce((a, p) => a + p.nodes.filter(n => !n.planned).length, 0);
  tiles.push(`<div class="tile"><span class="lbl">Steps it reached</span>
    <span class="val">${fmt((cov.measured || []).length)} of ${fmt(cov.built_here || declaredSteps)}</span>
    <span class="sub">${(cov.never_reached || []).length ? `Never reached: ${cov.never_reached.map(esc).join(", ")}` : "Every built step ran at least once"}${
      (cov.unmeasured_pipelines || []).length ? `<br>Not measured: ${cov.unmeasured_pipelines.map(esc).join(", ")}` : ""}</span></div>`);

  const facts = [
    m.counts ? `${fmt(m.counts.right)} of ${fmt(m.counts.of)} rollouts right` : "",
    (m.n || m.k) ? `${fmt(m.n || 0)} examples, ${m.k === 1 ? "one rollout each" : `${fmt(m.k || 0)} rollouts each`}` : "",
    m.split ? `${esc(m.split.replace(/_/g, "-"))} set` : "",
    m.created_at ? esc(String(m.created_at).slice(0, 10)) : "",
    m.model ? esc(m.model) : "",
    ({record: "calls made live", replay: "calls replayed from a recording",
      update: "replayed where recorded, live otherwise"})[m.cassette] || "",
    `<span class="mono">${esc(m.path)}</span>`,
  ].filter(Boolean);
  return `<div class="mregion strip">
    <div class="stripgrid"><div class="heroside">${hero}</div><div class="tiles">${tiles.join("")}</div></div>
    <div class="facts">${facts.join(" · ")}</div>
    ${(m.problems || []).length ? `<div class="nobody">${m.problems.map(esc).join(" ")}</div>` : ""}
  </div>`;
}

/* ---- 2. where does it lose it: the outcomes, as one diverging bar ---- */
function outcomesRegion(m) {
  const counts = m.outcomes || {};
  const total = Object.values(counts).reduce((a, v) => a + v, 0);
  if (!total) return "";
  const known = new Set([...OUTCOME_ARMS.right, ...OUTCOME_ARMS.centre, ...OUTCOME_ARMS.wrong]);
  const centre = [...OUTCOME_ARMS.centre, ...Object.keys(counts).filter(k => !known.has(k))];
  const order = [...OUTCOME_ARMS.right, ...centre, ...OUTCOME_ARMS.wrong].filter(k => counts[k]);
  const rightCount = OUTCOME_ARMS.right.reduce((a, k) => a + (counts[k] || 0), 0);
  const wrongCount = OUTCOME_ARMS.wrong.reduce((a, k) => a + (counts[k] || 0), 0);
  const noneCount = total - rightCount - wrongCount;
  const lit = k => browserFilter && browserFilter.kind === "outcome" && browserFilter.value === k;
  const seg = k => {
    const share = counts[k] / total, tone = outcomeTone(k);
    return `<button class="seg" data-outcome="${esc(k)}" aria-pressed="${lit(k)}"
      style="flex:${counts[k]};background:${tone};color:${inkOn(tone)}"
      data-tip="${esc(outcomeWords(k))}: ${fmt(counts[k])} of ${fmt(total)} rollouts (${Math.round(100 * share)}%)">${
      share > 0.3 || (share > 0.16 && outcomeWords(k).length <= 8) ? `${esc(outcomeWords(k))} ${fmt(counts[k])}` : share > 0.06 ? fmt(counts[k]) : ""}</button>`;
  };
  const key = k => `<span class="keyrow"><i style="background:${outcomeTone(k)}"></i>${esc(outcomeWords(k))}
    <b>${fmt(counts[k])}</b> <span class="asks">${Math.round(100 * counts[k] / total)}%</span></span>`;
  return `<div class="mregion">
    ${measureTitle("How the rollouts ended", `${fmt(total)} rollouts`)}
    <div class="divends"><span>${fmt(rightCount)} right</span>${noneCount ? `<span class="muted">${fmt(noneCount)} measured nothing</span>` : ""}<span>${fmt(wrongCount)} wrong</span></div>
    <div class="divbar">${order.map(seg).join("")}</div>
    <div class="legend">${order.map(key).join("")}</div>
    <p class="asks">Select a segment to light those rollouts in the grid.</p>
    ${criteriaBlock(m)}
  </div>`;
}

/* Which condition of the answer key fails most: one row per condition, met share on the
   shared axis, each row lighting the rollouts that fell short of it. */
function criteriaBlock(m) {
  const rows = m.criteria || [];
  if (!rows.length) return "";
  const failed = m.criteria_failed || {};
  const lit = name => browserFilter && browserFilter.kind === "criterion" && browserFilter.value === name;
  return `<div class="crit">${measureTitle("Which condition fails most", `${rows.length} conditions`)}
    ${rows.slice().sort((a, b) => (a.point ?? 1) - (b.point ?? 1)).map(f => `<button class="crow" data-criterion="${esc(f.name)}" aria-pressed="${lit(f.name)}"
      data-tip="${esc(f.name)}: met on ${esc(rate(f.point, f.unit))} of ${fmt(f.rollouts || 0)} rollouts, plausibly ${esc(rangeText(f))}">
      <span class="mono">${esc(f.name)}</span>${axisRow(f)}<span class="pt">${esc(rate(f.point, f.unit))}</span>
      <span class="asks">${(failed[f.name] || []).length ? `${fmt(failed[f.name].length)} example${failed[f.name].length === 1 ? "" : "s"} fell short` : "Met everywhere"}</span>
    </button>`).join("")}</div>`;
}

/* ---- 2. where does it lose it: the example grid, the hub every drill-down lights ---- */
function cellLit(r, x) {
  if (!browserFilter) return true;
  if (browserFilter.kind === "outcome") return x.outcome === browserFilter.value;
  if (browserFilter.kind === "criterion") return (x.unmet || []).includes(browserFilter.value);
  return browserFilter.examples.has(r.example);
}
function expectedWords(r) {
  if (r.expects) return r.expects;
  if (r.expects_absence) return "An absence";
  if (r.label !== null && r.label !== undefined) return r.label;
  const parts = (r.rollouts.find(x => x.total) || {}).total;
  return parts ? `${fmt(parts)} conditions` : "Several conditions";
}
/* The button that opens one rollout's walk, offered only where pressing it does something.
   The still page carries the newest run of each shape and the rollouts that came out wrong;
   the served page reads any other on demand. Offered for a rollout that is neither, it was a
   button that did nothing. */
function walkable(run) {
  if (!run) return "";
  const walks = (DATA.walks || {}).walks || {};
  if (walks[run]) return `<button class="btn" data-walk="${esc(run)}">Walk this rollout</button>`;
  if (live()) return `<button class="btn" data-fetchwalk="${esc(run)}">Walk this rollout</button>`;
  return `<span class="asks" data-tip="The still page carries the runs that came out wrong. Run simple-agents view --serve to open any of them.">Not in this file</span>`;
}

function gridRegion(m) {
  const rows = (m.browser || []).slice();
  if (!rows.length) return "";
  if (gridSort === "name") rows.sort((a, b) => a.example.localeCompare(b.example));
  else if (gridSort === "expected") rows.sort((a, b) => expectedWords(a).localeCompare(expectedWords(b)) || a.example.localeCompare(b.example));
  const k = Math.max(1, ...rows.map(r => r.rollouts.length));
  const litRows = rows.filter(r => r.rollouts.some(x => cellLit(r, x)));
  const litCells = rows.reduce((a, r) => a + r.rollouts.filter(x => cellLit(r, x)).length, 0);
  const note = browserFilter
    ? `<span class="litnote">${browserFilter.kind === "group"
        ? `${fmt(litRows.length)} examples ${esc(String(browserFilter.value))}`
        : `${fmt(litCells)} rollout${litCells === 1 ? "" : "s"} ${browserFilter.kind === "outcome" ? esc(outcomeWords(browserFilter.value).toLowerCase()) : `short on ${esc(String(browserFilter.value))}`}`}
       <button class="btn" data-clearfilter>Show all</button></span>` : "";
  const cell = (r, x) => {
    const key = `${r.example}:${x.rollout}`, tone = outcomeTone(x.outcome);
    return `<button class="gcell${cellLit(r, x) ? "" : " dim"}${openCell === key ? " open" : ""}" data-cell="${esc(key)}"

/* ---- 2. where does it lose it: every figure on one axis ---- */

/* ---- 3. did the last change help: the comparison, before → after per figure ---- */
function comparisonEntries(m) {

        n.accuracy && n.accuracy.moved ? ` accuracy ${esc(rate(n.accuracy.before, "rate"))} → ${esc(rate(n.accuracy.after, "rate"))}` : ""}</span></div>`).join("")}</div></details>` : ""}

      ? `<p class="asks">${fmt(rec.only_before.length)} example(s) only in the earlier one, ${fmt((rec.only_after || []).length)} only in the later; the figures are over the ${fmt(rec.shared_examples || 0)} shared.</p>` : ""}`;

/* ---- 3. did the last change help: the headline figure over time ---- */
function trendRegion(m) {
  /* A variant sweep writes a results file per arm and one for its own baseline. Those are

     off the line and are counted beside it. */
  const arms = new Set();
  (m.comparisons || []).forEach(c => {
    Object.values(c.variants || {}).forEach(v => { if (v.eval_id) arms.add(v.eval_id); });
    if (c.baseline && c.baseline.eval_id) arms.add(c.baseline.eval_id);

  const rows = every.filter(h => !(h.eval_id && arms.has(h.eval_id) && !h.reported));
